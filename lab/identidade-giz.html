<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Identidade Giz: duas versões</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Nunito:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ?v=a fiel às referências (Descomplica) · ?v=b adulta. Só tema claro. */
      :root {
        --voz: 'Nunito', system-ui, sans-serif;
        --ui: 'Inter', system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font: 500 13px/18px var(--ui);
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      .stage {
        width: 1280px;
        height: 800px;
        overflow: hidden;
        background: var(--fundo);
        color: var(--texto);
        padding: 18px 24px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      /* ===== A · fiel: preto, verde néon, tiles coloridos, etiqueta retangular ===== */
      html[data-v='a'] {
        --fundo: #f4f4f1;
        --cartao: #fff;
        --texto: #000;
        --texto2: #5c5c5c;
        --linha: #dcdcd8;
        --tinta: #000;
        --sobre-tinta: #fff;
        --acao: #00e58b;
        --sobre-acao: #000;
        --alerta: #d93025;
        --m-azul: #a9d5fb;
        --m-verde: #b3f5dd;
        --m-rosa: #fcc5c5;
        --m-lilas: #dcc9fb;
        --m-cinza: #e3e3e3;
        --m-texto: #000;
        --t-verde: #00e58b;
        --t-coral: #ff7a7a;
        --t-lilas: #c9a6ff;
        --t-azul: #6fbfff;
        --t-texto: #000;
      }
      html[data-v='a'] .card {
        border-radius: 12px;
        border: 1px solid var(--linha);
      }
      html[data-v='a'] .tag {
        border-radius: 4px;
        padding: 1px 7px;
        text-transform: uppercase;
        font: 500 12px/18px var(--ui);
        letter-spacing: 0.2px;
      }
      html[data-v='a'] .alerta {
        border: 1px solid var(--alerta);
        border-radius: 4px;
        color: var(--alerta);
        padding: 0 5px;
      }
      html[data-v='a'] .hero {
        border-radius: 16px;
      }
      html[data-v='a'] .tile {
        border-radius: 16px;
      }
      html[data-v='a'] .btn {
        border-radius: 8px;
      }
      html[data-v='a'] .chip {
        background: #fff;
        border: 1px solid var(--linha);
        border-radius: 999px;
      }
      html[data-v='a'] .chip.on {
        background: #000;
        color: #fff;
        border-color: #000;
      }

      /* ===== B · adulta: mesma lógica, tom contido, sem contorno, pílulas ===== */
      html[data-v='b'] {
        --fundo: #e9ebe8;
        --cartao: #fafbfa;
        --texto: #141a17;
        --texto2: #59635d;
        --tinta: #17201c;
        --sobre-tinta: #eef2ef;
        --acao: #b9e3cf;
        --sobre-acao: #10231b;
        --alerta: #a8362b;
        --alerta-fundo: #f3d9d5;
        --m-azul: #cfdcec;
        --m-verde: #cfe3d9;
        --m-rosa: #ecd5d3;
        --m-lilas: #ddd7ec;
        --m-cinza: #dde0de;
        --m-texto: #1b2a24;
        --t-verde: #cfe6da;
        --t-coral: #ecd0cb;
        --t-lilas: #dad3ea;
        --t-azul: #cddbea;
        --t-texto: #16201b;
      }
      html[data-v='b'] .card {
        border-radius: 20px;
      }
      html[data-v='b'] .tag {
        border-radius: 999px;
        padding: 1px 10px;
        font: 700 12px/18px var(--ui);
        letter-spacing: 0.3px;
      }
      html[data-v='b'] .alerta {
        background: var(--alerta-fundo);
        border-radius: 999px;
        color: var(--alerta);
        padding: 0 9px;
        font-weight: 700;
      }
      html[data-v='b'] .hero {
        border-radius: 24px;
      }
      html[data-v='b'] .tile {
        border-radius: 20px;
      }
      html[data-v='b'] .btn {
        border-radius: 999px;
      }
      html[data-v='b'] .chip {
        background: var(--cartao);
        border-radius: 999px;
      }
      html[data-v='b'] .chip.on {
        background: var(--tinta);
        color: var(--sobre-tinta);
      }

      /* ===== comum ===== */
      .topo {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .topo h1 {
        font: 800 22px/26px var(--voz);
      }
      .topo .sub {
        color: var(--texto2);
      }
      .sp {
        flex: 1;
      }
      .hero {
        background: var(--tinta);
        color: var(--sobre-tinta);
        padding: 18px 24px;
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .hero .txt {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .hero .lin {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .hero h2 {
        font: 800 26px/30px var(--voz);
      }
      .hero .sub {
        opacity: 0.7;
        font-size: 14px;
      }
      .hero .pill {
        border: 1px solid currentColor;
        border-radius: 999px;
        padding: 0 12px;
        font-size: 12.5px;
        line-height: 22px;
        opacity: 0.9;
      }
      .btn {
        background: var(--acao);
        color: var(--sobre-acao);
        font: 700 14px/20px var(--ui);
        padding: 10px 20px;
        white-space: nowrap;
      }
      .tiles {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }
      .tile {
        padding: 14px 18px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        color: var(--t-texto);
        background: var(--c);
      }
      .tile small {
        font: 700 12px/16px var(--ui);
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      .tile b {
        font: 800 34px/38px var(--voz);
      }
      .tile span {
        font-size: 12.5px;
      }
      .tile.t0 {
        --c: var(--tinta);
        color: var(--sobre-tinta);
      }
      .tile.t1 {
        --c: var(--t-verde);
      }
      .tile.t2 {
        --c: var(--t-coral);
      }
      .tile.t3 {
        --c: var(--t-lilas);
      }
      .chips {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .chip {
        padding: 3px 14px;
        font: 600 13px/20px var(--ui);
      }
      .dias {
        flex: 1;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 14px;
        min-height: 0;
      }
      .dia {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
      }
      .dia > h3 {
        text-align: center;
        font: 700 15px/20px var(--voz);
        color: var(--texto2);
      }
      .card {
        background: var(--cartao);
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .card .lin {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .card h2 {
        font: 800 16px/21px var(--voz);
        color: var(--texto);
      }
      .card .pe {
        display: flex;
        justify-content: space-between;
        color: var(--texto2);
        font-size: 12.5px;
      }
      .tag {
        display: inline-block;
        background: var(--cor);
        color: var(--m-texto);
        align-self: flex-start;
      }
      .alerta {
        font-size: 12px;
        line-height: 18px;
      }
      .m-azul {
        --cor: var(--m-azul);
      }
      .m-verde {
        --cor: var(--m-verde);
      }
      .m-rosa {
        --cor: var(--m-rosa);
      }
      .m-lilas {
        --cor: var(--m-lilas);
      }
      .m-cinza {
        --cor: var(--m-cinza);
      }
    </style>
  </head>
  <body>
    <div class="stage" id="s"></div>
    <script>
      const q = new URLSearchParams(location.search);
      document.documentElement.dataset.v = q.get('v') === 'b' ? 'b' : 'a';
      const M = { ANA: 'azul', FIS: 'verde', HIS: 'rosa', BIO: 'lilas', NIV: 'cinza' };
      const tag = (k) => `<span class="tag m-${M[k]}">${k}</span>`;
      const c = (k, t, p, al) =>
        `<div class="card"><div class="lin">${tag(k)}${al ? '<span class="alerta">cai na prova</span>' : ''}</div><h2>${t}</h2><div class="pe"><span>${p}</span><span>0%</span></div></div>`;
      const dias = [
        [
          'Dia 1',
          [
            c('NIV', 'Revisão da semana', '35 questões'),
            c('ANA', 'Plexo braquial', 'Conteúdo base', 1),
            c('ANA', 'Exercícios de plexo braquial', 'Aprofundamento'),
          ],
        ],
        [
          'Dia 2',
          [
            c('NIV', 'Revisão da semana', '36 questões'),
            c('FIS', 'Débito cardíaco e pós-carga', 'Conteúdo base', 1),
            c('BIO', 'Glicólise e gliconeogênese', 'Conteúdo base'),
          ],
        ],
        [
          'Dia 3',
          [
            c('NIV', 'Revisão da semana', '29 questões'),
            c('HIS', 'Tecido epitelial de revestimento', 'Conteúdo base'),
            c('ANA', 'Nervos cranianos', 'Conteúdo base', 1),
          ],
        ],
        [
          'Dia 4',
          [
            c('NIV', 'Revisão da semana', '35 questões'),
            c('FIS', 'Fisiologia renal', 'Conteúdo base'),
            c('BIO', 'Ciclo de Krebs', 'Conteúdo base', 1),
          ],
        ],
        [
          'Dia 5',
          [
            c('NIV', 'Revisão da semana', '26 questões'),
            c('ANA', 'Anatomia do abdome', 'Conteúdo base'),
            c('HIS', 'Tecido conjuntivo', 'Conteúdo base'),
          ],
        ],
      ];
      const tile = (n, l, v, s) =>
        `<div class="tile t${n}"><small>${l}</small><b>${v}</b><span>${s}</span></div>`;
      document.getElementById('s').innerHTML = `
<div class="topo"><h1>Início</h1><span class="sub">Semana 21 · Quarta-feira</span></div>
<div class="hero"><div class="txt"><div class="lin"><span class="pill">Continue de onde parou</span><span class="pill">Revisão</span></div>
 <h2>Débito cardíaco e pós-carga</h2><p class="sub">Fisiologia · 7 atividades · não iniciado</p></div><span class="btn">Continuar agora</span></div>
<div class="tiles">${tile(0, 'Total', '0', 'questões hoje')}${tile(1, 'Fisiologia', '12', 'para revisar')}${tile(2, 'Anatomia', '4', 'para revisar')}${tile(3, 'Provas', '2', 'nesta semana')}</div>
<div class="chips"><span class="chip">7 dias</span><span class="chip on">30 dias</span><span class="chip">90 dias</span><span class="chip">Todo o período</span></div>
<div class="dias">${dias.map(([n, l]) => `<div class="dia"><h3>${n}</h3>${l.join('')}</div>`).join('')}</div>`;
    </script>
  </body>
</html>
