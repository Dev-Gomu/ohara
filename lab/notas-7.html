<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notas: novo layout</title>
    <style>
      .tela {
        height: 752px;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        gap: var(--vao-mosaico);
        padding: var(--vao-mosaico);
        background: var(--cor-fundo);
        color: var(--cor-texto);
      }
      .barra {
        display: flex;
        align-items: center;
        gap: var(--e3);
        height: 40px;
        padding-left: var(--e1);
      }
      .barra .num {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--cor-cartao);
        font: var(--ui-botao);
        color: var(--cor-texto-2);
      }
      .barra .num[data-sel='true'] {
        background: var(--cor-destaque);
        color: var(--cor-tinta);
      }
      .barra h2 {
        margin-left: var(--e2);
        font: var(--voz-titulo);
        letter-spacing: 0.02em;
      }
      .cartao {
        background: var(--cor-cartao);
        border-radius: var(--raio-bloco);
        padding: var(--e5) var(--e6);
        min-width: 0;
        min-height: 0;
      }
      .cartao.ativo {
        border: var(--borda-bloco) solid var(--cor-cursor);
        padding: calc(var(--e5) - 2px) calc(var(--e6) - 2px);
      }
      .rotulo {
        color: var(--cor-texto-2);
        font: var(--ui-rotulo);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .apoio {
        color: var(--cor-texto-2);
        font: var(--ui-apoio);
      }
      kbd {
        font: var(--ui-tecla);
        color: var(--cor-texto-2);
      }
      .num-t {
        font-family: var(--fonte-interface);
        font-variant-numeric: tabular-nums;
      }
      .baixa {
        background: color-mix(in srgb, var(--cor-materia-0) 30%, var(--cor-cartao));
      }

      /* cabeçalho de tela */
      .topo {
        display: flex;
        align-items: center;
        gap: var(--e5);
        padding: 0 var(--e2);
        height: 48px;
      }
      .abas {
        display: flex;
        gap: var(--e5);
      }
      .abas span {
        font: var(--ui-botao);
        color: var(--cor-texto-2);
        padding: var(--e2) 0;
      }
      .abas span[data-sel='true'] {
        color: var(--cor-texto);
        box-shadow: inset 0 -3px 0 var(--cor-cursor);
      }
      .topo .fim {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: var(--e4);
        font: var(--ui-apoio);
        color: var(--cor-texto-2);
      }
      .topo .ano {
        font: var(--voz-item);
        color: var(--cor-texto);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: var(--e2);
        height: 40px;
        padding: 0 var(--e4);
        border-radius: var(--raio-pilula);
        background: var(--cor-cartao);
        font: var(--ui-botao);
        color: var(--cor-texto);
      }

      .disc {
        display: flex;
        align-items: center;
        gap: var(--e3);
        min-width: 0;
      }
      .pt {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex: none;
      }
      .cod {
        width: 36px;
        color: var(--cor-texto-2);
        font: var(--ui-sigla);
        letter-spacing: 0.04em;
      }
      .nm {
        font: var(--ui-botao);
        font-weight: 600;
        white-space: nowrap;
      }
      .sit {
        display: inline-flex;
        align-items: center;
        gap: var(--e2);
        font: var(--ui-item);
        white-space: nowrap;
      }
      .sit i {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: var(--cor-tinta);
      }
      .sit i svg {
        width: 11px;
        height: 11px;
      }
      .sit.ok i {
        background: var(--cor-materia-3);
      }
      .sit.at i {
        background: var(--cor-materia-0);
      }
      .sit.nd {
        color: var(--cor-texto-2);
      }
      .foco {
        outline: var(--contorno-foco) solid var(--cor-contorno-foco);
        outline-offset: -4px;
      }
      .sel {
        background: var(--cor-escolhido);
      }

      
      .corpo { display: grid; gap: var(--vao-mosaico); min-height: 0; grid-template-rows: auto minmax(0, 1fr) minmax(0, auto); }
      .num-t { font-variant-numeric: tabular-nums; }

      /* régua de disciplinas */
      .regua { display: flex; align-items: center; gap: var(--e2); padding: var(--e3) var(--e4); border-radius: var(--raio-bloco); background: var(--cor-cartao); }
      .ri { display: flex; align-items: center; gap: var(--e2); height: 48px; padding: 0 var(--e4); border-radius: var(--raio-item); font: 700 15px/20px var(--fonte-interface); white-space: nowrap; }
      .ri .m { font-weight: 500; color: var(--cor-texto-2); font-variant-numeric: tabular-nums; }
      .ri[data-sel='true'] { background: var(--cor-escolhido); }
      .ri[data-sel='true'] .m { color: var(--cor-texto); }
      .ri.geral { gap: var(--e3); padding-right: var(--e5); }
      .ri.geral small { display: block; color: var(--cor-texto-2); font: var(--ui-apoio); }
      .ri.geral b { display: block; font: var(--ui-botao); }
      .ri.geral svg { width: 20px; height: 20px; }
      .ri.geral span { white-space: nowrap; }
      .lado .fc { width: 108px; padding-inline: var(--e2); }
      .lado .fc.ano { width: 112px; }
      .lado .grupos { gap: var(--e3); }
      .busca { margin-left: auto; display: flex; align-items: center; gap: var(--e2); height: 44px; padding: 0 var(--e4); border-radius: var(--raio-pilula); background: var(--cor-cartao-2); color: var(--cor-texto-2); font: var(--ui-item); font-weight: 500; }
      .busca kbd { margin-left: var(--e5); }

      /* cabeçalho + faixas */
      .cab { display: flex; align-items: center; gap: var(--e3); }
      .cab h3 { font: var(--voz-tela); }
      .cab .md { margin-left: auto; display: grid; justify-items: end; gap: 2px; }
      .cab .md b { font: var(--voz-numero); font-size: 56px; line-height: 48px; }
      .grupos { display: flex; gap: var(--e5); margin-top: var(--e4); }
      .gr { display: grid; gap: var(--e2); }
      .gr > .rotulo { padding-left: var(--e1); }
      .fs { display: flex; gap: var(--e2); }
      .fc { width: 132px; min-height: 100px; padding: var(--e3) var(--e3) var(--e3); border-radius: var(--raio-item); background: var(--cor-cartao-2); display: grid; align-content: start; gap: 2px; }
      .fc .t { color: var(--cor-texto-2); font: var(--ui-rotulo); letter-spacing: 0.06em; text-transform: uppercase; }
      .fc .n { font: 700 30px/36px var(--fonte-interface); font-variant-numeric: tabular-nums; }
      .fc .d { color: var(--cor-texto-2); font: var(--ui-apoio); }
      .fc .pb { height: 5px; border-radius: 3px; background: color-mix(in srgb, var(--cor-texto) 14%, transparent); margin-top: var(--e2); overflow: hidden; }
      .fc .pb i { display: block; height: 100%; background: var(--cor-texto); border-radius: 3px; }
      .fc.baixa { background: color-mix(in srgb, var(--cor-materia-0) 30%, var(--cor-cartao)); }
      .fc.baixa .pb i { background: var(--cor-materia-0); }
      .fc.tot { background: var(--cor-escolhido); }
      .fc.vz { background: transparent; border: 2px dashed var(--cor-texto-2); padding: calc(var(--e3) - 2px); }
      .fc.vz .n { color: var(--cor-texto-2); font-weight: 400; }
      .fc.foco { outline: var(--contorno-foco) solid var(--cor-contorno-foco); outline-offset: -4px; }
      .fc.ano { width: 140px; }

      /* base: avaliações e quanto preciso */
      .base { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--vao-mosaico); min-height: 0; }
      .tit2 { display: flex; align-items: center; gap: var(--e3); margin-bottom: var(--e2); }
      .tit2 h4 { font: var(--voz-titulo); }
      .tit2 .apoio b { color: var(--cor-texto); }
      .btn.p { margin-left: auto; background: var(--cor-acao); color: var(--cor-sobre-acao); }
      .btn.p kbd { color: inherit; opacity: 0.7; }
      .ava { display: grid; grid-template-columns: minmax(0, 1fr) 70px 130px; align-items: center; }
      .ava > * { min-height: 46px; display: flex; align-items: center; }
      .ava .h { min-height: 28px; }
      .ava .h.r, .ava .pe, .ava .no { justify-content: center; }
      .ava .an { font: var(--voz-mini); padding-left: var(--e3); }
      .ava .pe { color: var(--cor-texto-2); font: var(--ui-item); font-variant-numeric: tabular-nums; }
      .ava .no span { width: 96px; height: 38px; display: grid; place-items: center; border-radius: var(--raio-campo); border: 2px dashed var(--cor-texto-2); color: var(--cor-texto-2); font: var(--ui-item); }
      .ava .no span.ok { border: 0; background: var(--cor-cartao-2); color: var(--cor-texto); font: 700 17px/20px var(--fonte-interface); }
      .ava .sel { background: var(--cor-escolhido); }
      .ava .an.sel { border-radius: var(--raio-item) 0 0 var(--raio-item); }
      .ava .no.sel { border-radius: 0 var(--raio-item) var(--raio-item) 0; }
      .qp .mt { display: flex; align-items: center; gap: var(--e3); }
      .qp .mt .s { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; background: var(--cor-cartao-2); font: var(--ui-botao); }
      .qp .mt b { font: var(--voz-item); }
      .qp .tt { display: flex; align-items: center; gap: var(--e3); margin-bottom: var(--e2); }
      .qp .tt .mt { margin-left: auto; }
      .lq { display: flex; align-items: center; gap: var(--e3); min-height: 58px; padding: 0 var(--e4); border-radius: var(--raio-item); }
      .lq .x { flex: 1; display: grid; }
      .lq .x b { font: var(--ui-botao); }
      .lq .x small { color: var(--cor-texto-2); font: var(--ui-apoio); }
      .lq .v { font: 800 30px/32px var(--fonte-voz); font-variant-numeric: tabular-nums; }
      .lq.fm { background: var(--cor-escolhido); }

      /* lista lateral (versão 2) */
      .lado { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: var(--vao-mosaico); min-height: 0; }
      .lst { display: grid; align-content: start; gap: 2px; margin-top: var(--e3); }
      .lst .it { display: flex; align-items: center; gap: var(--e3); min-height: var(--item-lista); padding: 0 var(--e3); border-radius: var(--raio-item); font: 700 15px/20px var(--fonte-interface); }
      .lst .it .nm { flex: 1; }
      .lst .it .m { font-variant-numeric: tabular-nums; }
      .lst .it .m.vz { color: var(--cor-texto-2); font-weight: 400; }
      .lst .it[data-sel='true'] { background: var(--cor-escolhido); }
      .lst .it.geral { font-weight: 600; margin-bottom: var(--e2); }

      /* régua integrada ao cartão (versão 3) */
      .int { display: flex; gap: var(--e1); margin-bottom: var(--e4); align-items: center; }
      .int .ri { height: 40px; padding: 0 var(--e3); }
      .int .ri.geral { padding-right: var(--e4); }
      .int .busca { height: 40px; }

    </style>
  </head>
  <body>
    <script type="module">
      import { Sala } from './_sala.js';
      const ICO = {
        at: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><path d="M12 5v9M12 19v.01"/></svg>',
        ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>',
        lista: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>',
        lupa: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="m20 20-4-4"/></svg>',
      };
      const D = [
        ['GEN', 'Genética', 'rosa', '7,8'], ['IMU', 'Imunologia', 'destaque', '6,5'], ['PRO', 'Propedêutica', 'azul', '6,7'],
        ['APS', 'Atenção primária', 'verde', '7,2'], ['MIC', 'Microbiologia', 'ciano', '8,0'], ['PSI', 'Psicologia', 'laranja', '—'],
      ];
      const SEL = 2;
      const pt = (c) => `<span class="pt" style="background:var(--cor-${c})"></span>`;
      const sigla = (d) => `<span class="sigla" style="display:inline-flex;align-items:center;height:26px;padding:0 var(--e3);border-radius:var(--raio-pilula);background:var(--cor-${d[2]});color:var(--cor-tinta);font:var(--ui-sigla)">${d[0]}</span>`;
      const barra = `<div class="barra">${[1, 2, 3, 4, 5, 6].map((n) => `<span class="num" ${n === 5 ? 'data-sel="true"' : ''}>${n}</span>`).join('')}<h2>NOTAS</h2>
        <div class="fim" style="margin-left:auto;display:flex;align-items:center;gap:var(--e3)"><span class="btn">‹ <b style="font:var(--voz-item)">2026</b> ›</span><span class="btn">Aberto</span><span class="btn">‹ Agenda <kbd>Esc</kbd></span></div></div>`;
      const moldura = (corpo) => `<div class="tela">${barra}${corpo}</div>`;

      // régua de disciplinas
      const buscar = `<span class="busca">${ICO.lupa} Buscar disciplina <kbd>/</kbd></span>`;
      const geral = (sel) => `<span class="ri geral" ${sel ? 'data-sel="true"' : ''}>${ICO.lista}<span><b>Boletim geral</b><small>todas as disciplinas · 7,3</small></span></span>`;
      const itens = D.map((d, i) => `<span class="ri" ${i === SEL ? 'data-sel="true"' : ''}>${pt(d[2])}${d[0]}<span class="m">${d[3]}</span></span>`).join('');

      // cabeçalho
      const sit = `<span class="sit at"><i>${ICO.at}</i>Atenção</span>`;
      const titulo = `<div class="cab">${sigla(D[SEL])}<div><h3>Propedêutica</h3></div>${sit}<div class="md"><span class="rotulo">Média atual</span><b>6,7</b></div></div>`;
      const fc = (t, n, de, frac, cls = '') => `<div class="fc ${cls}"><span class="t">${t}</span><span class="n">${n}</span><span class="d">${de}</span>${frac === null ? '' : `<span class="pb"><i style="width:${frac * 100}%"></i></span>`}</div>`;
      const faixas = `<div class="grupos">
        <div class="gr"><span class="rotulo">1º semestre</span><div class="fs">${fc('1º bim', '2,4', 'de 3', 0.8)}${fc('2º bim', '4,9', 'de 7', 0.7)}${fc('Total', '7,3', 'de 10', 0.73, 'tot')}</div></div>
        <div class="gr"><span class="rotulo">2º semestre</span><div class="fs">${fc('3º bim', '1,8', 'de 3', 0.6, 'baixa')}${fc('4º bim', '—', 'de 7 · aberto', null, 'vz foco')}${fc('Total', '—', 'de 10', null, 'tot')}</div></div>
        <div class="gr"><span class="rotulo">Ano</span><div class="fs">${fc('Média', '—', 'de 10', null, 'vz ano')}</div></div>
      </div>`;

      const lan = (n, v, nota, sel) => `<span class="an${sel ? ' sel' : ''}">${n}</span><span class="pe${sel ? ' sel' : ''}">${v}</span><span class="no${sel ? ' sel' : ''}">${nota ? `<span class="ok">${nota}</span>` : '<span>lançar</span>'}</span>`;
      const avaliacoes = `<div class="cartao ativo"><div class="tit2"><h4>4º bimestre</h4><span class="apoio"><b>0,0</b> de 7,0</span><span class="btn p">+ Nova avaliação <kbd>Alt N</kbd></span></div>
        <div class="ava"><span class="h rotulo">Avaliação</span><span class="h r rotulo">Vale</span><span class="h r rotulo">Nota</span>
        ${lan('Prova teórica', '4,0')}${lan('Prova prática', '2,0', null, true)}${lan('Seminário', '1,0')}</div></div>`;
      const lq = (t, sub, v, fm) => `<div class="lq${fm ? ' fm' : ''}"><span class="x"><b>${t}</b><small>${sub}</small></span><span class="v">${v}</span></div>`;
      const quanto = `<div class="cartao qp"><div class="tt"><span class="rotulo">Quanto preciso tirar</span><span class="mt"><span class="rotulo">Meta</span><span class="s">‹</span><b>7,0</b><span class="s">›</span></span></div>
        ${lq('Fechar o 1º semestre', 'já fechado', '7,3')}${lq('Fechar o 2º semestre', '7,0 no 4º bimestre', '5,2')}${lq('Fechar o ano', '7,0 no 4º bimestre', '4,9', true)}</div>`;
      const base = `<div class="base">${avaliacoes}${quanto}</div>`;
      const cartaoTopo = (extra = '') => `<div class="cartao">${extra}${titulo}${faixas}</div>`;

      // 1. régua em bloco próprio
      const V1 = () => moldura(`<div class="corpo"><div class="regua">${geral(false)}${itens}${buscar}</div>${cartaoTopo()}${base}</div>`);
      // 2. lista lateral
      const V2 = () => moldura(`<div class="lado"><div class="cartao"><span class="rotulo">Disciplinas</span><div class="lst">
        <div class="it geral">${ICO.lista.replace('<svg', '<svg width="20" height="20"')}<span class="nm">Boletim geral</span><span class="m">7,3</span></div>
        ${D.map((d, i) => `<div class="it" ${i === SEL ? 'data-sel="true"' : ''}>${pt(d[2])}<span class="nm">${d[1]}</span><span class="m${d[3] === '—' ? ' vz' : ''}">${d[3]}</span></div>`).join('')}</div></div>
        <div class="corpo" style="grid-template-rows:auto minmax(0,1fr)">${cartaoTopo()}${base}</div></div>`);
      // 3. régua dentro do cartão do cabeçalho, uma caixa a menos
      const V3 = () => moldura(`<div class="corpo" style="grid-template-rows:auto minmax(0,1fr)">${cartaoTopo(`<div class="int">${geral(false)}${itens}${buscar}</div>`)}${base}</div>`);

      Sala.montar({
        titulo: 'Notas: novo layout',
        dados: null,
        variantes: [
          { id: 'a', nome: 'A. Régua em bloco próprio (como no ClaudeWeb)', html: V1 },
          { id: 'b', nome: 'B. Lista lateral', html: V2 },
          { id: 'c', nome: 'C. Régua dentro do cartão da disciplina', html: V3 },
        ],
      });
    </script>
  </body>
</html>
