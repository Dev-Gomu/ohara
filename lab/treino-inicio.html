<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Treino: tela inicial</title>
    <style>
      .tela {
        display: grid;
        place-items: start center;
        padding-top: var(--e2);
      }
      .cartao {
        position: relative;
        width: min(760px, 100%);
        padding: var(--e5) var(--e6) var(--e6);
        border-radius: var(--raio-bloco);
        background: var(--cor-cartao);
        border: 2px solid var(--cor-bloco-ativo);
        display: grid;
        justify-items: center;
        gap: var(--e2);
      }
      .rotulo {
        color: var(--cor-texto-2);
        font: var(--ui-rotulo);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .numero {
        font: var(--voz-numero);
        font-size: 88px;
        line-height: 80px;
        margin-top: var(--e2);
      }
      .legenda {
        color: var(--cor-texto-2);
        font: var(--leitura-texto);
      }
      .recorte {
        font: var(--voz-item);
        margin-top: var(--e2);
      }
      .infos {
        display: flex;
        gap: var(--e2);
        margin: var(--e2) 0 var(--e3);
      }
      .info {
        padding: 0 var(--e4);
        height: 40px;
        display: grid;
        align-content: center;
        border-radius: var(--raio-pilula);
        background: var(--cor-cartao-2);
        font: var(--ui-item);
      }
      .iniciar {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 52px;
        padding: 0 var(--e6);
        border-radius: var(--raio-botao);
        background: var(--cor-botao);
        color: var(--cor-sobre-botao);
        font: var(--ui-botao);
      }
      .iniciar kbd {
        font: var(--ui-tecla);
        opacity: 0.75;
      }
      .ajustar {
        margin-top: var(--e2);
        padding: var(--e2) var(--e4);
        color: var(--cor-texto);
        font: var(--ui-item);
      }
      .bloco {
        width: 100%;
        display: grid;
        gap: var(--e2);
        margin-top: var(--e3);
      }
      .bloco > .rotulo {
        justify-self: start;
      }
      .regua {
        display: flex;
        padding: var(--e1);
        border-radius: var(--raio-pilula);
        background: var(--cor-cartao-2);
      }
      .regua span {
        flex: 1;
        text-align: center;
        padding: 0 var(--e3);
        height: 44px;
        display: grid;
        align-content: center;
        border-radius: var(--raio-pilula);
        font: var(--ui-item);
      }
      .regua span[data-sel='true'] {
        background: var(--cor-marca);
      }
      .sigla {
        display: inline-grid;
        align-content: center;
        height: 24px;
        padding: 0 var(--e3);
        border-radius: var(--raio-pilula);
        color: var(--cor-tinta);
        font: var(--ui-sigla);
      }
      .item {
        display: inline-flex;
        align-items: center;
        gap: var(--e2);
        height: 48px;
        padding: 0 var(--e4);
        border-radius: var(--raio-pilula);
        background: var(--cor-cartao-2);
        font: var(--ui-item);
        white-space: nowrap;
        cursor: pointer;
      }
      .item[data-sel='true'] {
        background: var(--cor-marca);
      }
      .item small {
        color: var(--cor-texto-2);
        font: var(--ui-apoio);
      }
      .foco {
        outline: 4px solid var(--cor-contorno-foco);
        outline-offset: -4px;
      }
      .tudo {
        width: 100%;
      }
      .dica {
        justify-self: start;
        color: var(--cor-texto-2);
        font: var(--ui-apoio);
      }

      /* A. Régua que rola: uma linha só, o resto escondido atrás de "mais N" */
      .v-a .linha {
        display: flex;
        gap: var(--e2);
        overflow: hidden;
      }
      .v-a .mais {
        margin-left: auto;
        flex: none;
        background: var(--cor-cartao-2);
      }

      /* B. Seletor único com busca, aberto */
      .v-b .seletor {
        position: relative;
      }
      .v-b .gatilho {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 56px;
        padding: 0 var(--e5);
        border-radius: var(--raio-campo);
        background: var(--cor-cartao-2);
        font: var(--ui-item);
        cursor: pointer;
      }
      .v-b .gatilho b {
        display: flex;
        align-items: center;
        gap: var(--e3);
        font: var(--voz-mini);
      }
      .v-b .painel {
        position: absolute;
        z-index: 2;
        left: 0;
        right: 0;
        top: 64px;
        padding: var(--e3);
        border-radius: var(--raio-bloco);
        background: var(--cor-cartao);
        box-shadow: 0 8px 28px rgb(0 0 0 / 22%);
        display: grid;
        gap: var(--e2);
      }
      .v-b .busca {
        height: 44px;
        padding: 0 var(--e4);
        display: grid;
        align-content: center;
        border-radius: var(--raio-campo);
        background: var(--cor-cartao-2);
        color: var(--cor-texto-2);
        font: var(--leitura-campo);
      }
      .v-b .lista {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--e1) var(--e2);
        max-height: 172px;
        overflow: hidden;
      }
      .v-b .linhaMat {
        display: flex;
        align-items: center;
        gap: var(--e3);
        height: 44px;
        padding: 0 var(--e3);
        border-radius: var(--raio-item);
        font: var(--ui-item);
        cursor: pointer;
      }
      .v-b .linhaMat small {
        margin-left: auto;
        color: var(--cor-texto-2);
        font: var(--ui-apoio);
      }
      .v-b .linhaMat[data-sel='true'] {
        background: var(--cor-marca);
      }
      .v-b .reserva {
        height: 190px;
      }

      /* C. Grade de siglas com contagem */
      .v-c .grade {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: var(--e2);
      }
      .v-c .cel {
        display: grid;
        justify-items: center;
        gap: 2px;
        padding: var(--e3) var(--e1);
        border-radius: var(--raio-item);
        background: var(--cor-cartao-2);
        cursor: pointer;
      }
      .v-c .cel[data-sel='true'] {
        background: var(--cor-marca);
      }
      .v-c .cel small {
        color: var(--cor-texto-2);
        font: var(--ui-apoio);
      }
    </style>
  </head>
  <body>
    <script type="module">
      import { Sala } from './_sala.js';
      const MATERIAS = [
        ['IMU', 'Imunologia', 'var(--cor-destaque)', 10],
        ['GEN', 'Genética', 'var(--cor-laranja)', 4],
        ['PRO', 'Processos patológicos', 'var(--cor-azul)', 7],
        ['APS', 'Atenção primária', 'var(--cor-verde)', 0],
        ['PSI', 'Psicologia médica', 'var(--cor-rosa)', 3],
        ['ANA', 'Anatomia', 'var(--cor-amarelo)', 12],
        ['FIS', 'Fisiologia', 'var(--cor-ciano)', 5],
        ['BIO', 'Bioquímica', 'var(--cor-cinza-lavanda)', 0],
        ['HIS', 'Histologia', 'var(--cor-laranja)', 2],
        ['EMB', 'Embriologia', 'var(--cor-azul)', 6],
        ['FAR', 'Farmacologia', 'var(--cor-verde)', 9],
        ['PAT', 'Patologia geral', 'var(--cor-rosa)', 1],
        ['SEM', 'Semiologia', 'var(--cor-amarelo)', 8],
        ['ETI', 'Ética médica', 'var(--cor-ciano)', 0],
      ];
      const sigla = (s, cor) => `<span class="sigla" style="background:${cor}">${s}</span>`;
      const cabeca = `
        <span class="rotulo">Sua sessão</span><span class="numero">10</span><span class="legenda">cartões para hoje</span>
        <span class="recorte">Imunologia · 4º bimestre</span>
        <div class="infos"><span class="info">10 de 42 no recorte</span><span class="info">Mais antigos primeiro</span></div>
        <span class="iniciar">▷ Iniciar treino <kbd>Enter</kbd></span>
        <span class="ajustar">Ajustar o que treinar ›</span>`;
      const periodo = `<div class="bloco"><span class="rotulo">Estudar</span><div class="regua"><span>Todos</span><span>Ano 2026</span><span>Semestre atual</span><span data-sel="true">Bimestre atual</span></div></div>`;
      const moldura = (v, disc) =>
        `<div class="tela v-${v}"><div class="cartao">${cabeca}${periodo}${disc}</div></div>`;

      const a = () => {
        const itens = [
          ['Todas', '', 'var(--cor-cartao-2)'],
          ...MATERIAS.map(([s, , c, n]) => [s, n, c]),
        ];
        const mostrados = itens
          .slice(0, 6)
          .map(
            ([s, n, c], i) =>
              `<span class="item${i === 1 ? ' foco' : ''}" ${i === 1 ? 'data-sel="true"' : ''}>${i === 0 ? 'Todas' : sigla(s, c)}${n !== '' ? `<small>${n}</small>` : ''}</span>`,
          )
          .join('');
        return `<div class="bloco"><span class="rotulo">Disciplina</span><div class="linha">${mostrados}<span class="item mais">+ 9 ›</span></div><span class="dica">← → andam pela régua e trocam na hora; o resto fica atrás do “+ 9”.</span></div>`;
      };
      const b = () => {
        const linhas = MATERIAS.slice(0, 8)
          .map(
            ([s, nome, c, n], i) =>
              `<span class="linhaMat${i === 0 ? ' foco' : ''}" ${i === 0 ? 'data-sel="true"' : ''}>${sigla(s, c)}<span>${nome}</span><small>${n ? `${n} hoje` : 'em dia'}</small></span>`,
          )
          .join('');
        return `<div class="bloco"><span class="rotulo">Disciplina</span><div class="seletor"><div class="gatilho"><b>${sigla('IMU', 'var(--cor-destaque)')} Imunologia</b><span>10 hoje ▾</span></div><div class="painel"><div class="busca">Digite para filtrar: “imu”, “anat”…</div><div class="lista">${linhas}</div></div></div><div class="reserva"></div><span class="dica">← → trocam sem abrir; Enter abre a lista; digitar filtra.</span></div>`;
      };
      const c = () => {
        const cel = (s, cor, n, i) =>
          `<span class="cel${i === 1 ? ' foco' : ''}" ${i === 1 ? 'data-sel="true"' : ''}>${s === 'Todas' ? '<b>Todas</b>' : sigla(s, cor)}<small>${n === '' ? '' : n ? `${n} hoje` : 'em dia'}</small></span>`;
        const itens = [['Todas', '', 36], ...MATERIAS.map(([s, , cor, n]) => [s, cor, n])];
        return `<div class="bloco"><span class="rotulo">Disciplina</span><div class="grade">${itens.map(([s, cor, n], i) => cel(s, cor, n, i)).join('')}</div><span class="dica">Setas nos dois eixos; todas visíveis de relance, a grade cresce em linhas.</span></div>`;
      };

      Sala.montar({
        titulo: 'Treino: tela inicial',
        dados: {},
        variantes: [
          { id: 'a', nome: 'A. Régua que rola (+ N)', html: () => moldura('a', a()) },
          { id: 'b', nome: 'B. Seletor com busca', html: () => moldura('b', b()) },
          { id: 'c', nome: 'C. Grade de siglas', html: () => moldura('c', c()) },
        ],
      });
    </script>
  </body>
</html>
