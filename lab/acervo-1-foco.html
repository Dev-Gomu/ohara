<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acervo 1: foco sobre a cor da matéria</title>
    <style>
      .grade { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--vao-mosaico); padding: 8px; }
      .materia { display: grid; height: 110px; border-radius: var(--raio-bloco); }
      .corpo { display: flex; flex-direction: column; justify-content: space-between; padding: var(--e3); border-radius: var(--raio-bloco);
        background: var(--cor-materia); color: var(--cor-tinta); }
      .sigla { align-self: flex-start; padding: 2px 9px; border-radius: var(--raio-pilula); background: var(--cor-tinta); color: var(--cor-sobre-tinta); font: var(--ui-sigla); }
      .corpo b { font: var(--voz-titulo); text-transform: uppercase; }
      .atual { outline: 4px solid var(--cor-contorno-foco); outline-offset: -4px; } /* o que existe hoje, em 2px */
      .v-atual .foco { outline: 2px solid var(--cor-contorno-foco); outline-offset: -2px; }
      .v-a .foco .corpo { box-shadow: inset 0 0 0 4px var(--cor-tinta); }
      .v-b .foco .corpo { box-shadow: inset 0 0 0 3px var(--cor-tinta), inset 0 0 0 5px var(--cor-sobre-tinta), inset 0 0 0 6px var(--cor-tinta); }
      .v-c .foco { transform: scale(1.035); position: relative; z-index: 1; }
      .v-c .foco .corpo { box-shadow: inset 0 0 0 3px var(--cor-tinta), 0 6px 18px color-mix(in srgb, var(--cor-tinta) 45%, transparent); }
      .v-d .foco .corpo { background: color-mix(in srgb, var(--cor-materia) 38%, var(--cor-tinta)); color: var(--cor-sobre-tinta); }
      .v-d .foco .sigla { background: var(--cor-materia); color: var(--cor-tinta); }
      /* E: 4px de --cor-foco (escura no claro, clara no escuro) */
      .v-e .foco .corpo { box-shadow: inset 0 0 0 4px var(--cor-foco); }
      /* F: duplo que vale nos dois temas: 2px de tinta, 3px de --cor-foco, 1px de tinta (mais fino que o B) */
      .v-f .foco .corpo { box-shadow: inset 0 0 0 2px var(--cor-tinta), inset 0 0 0 5px var(--cor-foco), inset 0 0 0 6px var(--cor-tinta); }
    </style>
  </head>
  <body>
    <script type="module">
      import { Sala } from './_sala.js';
      const NOMES = ['Genética', 'Imunologia', 'Propedêutica', 'Atenção primária', 'Farmacologia', 'Fisiologia', 'Patologia geral', 'Bioética'];
      const SIG = ['GEN', 'IMU', 'PRO', 'APS', 'FAR', 'FIS', 'PAT', 'BIO'];
      const grade = (cls, focos) => `<div class="grade v-${cls}">${NOMES.map((n, i) =>
        `<div class="materia ${focos.includes(i) ? 'foco' : ''}"><span class="corpo" data-materia="${i}"><span class="sigla">${SIG[i]}</span><b>${n}</b></span></div>`).join('')}</div>`;
      const v = (id, nome) => ({ id, nome, html: () => grade(id, [0, 1, 2, 3, 4, 5, 6, 7]) });
      Sala.montar({
        titulo: 'Acervo 1: foco sobre a cor da matéria (todas as 8 cores marcadas, para comparar)',
        dados: {},
        variantes: [v('atual', 'Hoje (2px, cor ativa)'), v('a', 'A. 4px de tinta'), v('b', 'B. Contorno duplo'), v('c', 'C. Sobe + sombra'), v('d', 'D. Escurece o fundo'), v('e', 'E. 4px de cor de foco (inverte com o tema)'), v('f', 'F. Duplo fino nos dois temas')],
      });
    </script>
  </body>
</html>
