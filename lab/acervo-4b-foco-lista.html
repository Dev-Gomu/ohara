<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acervo 4b: foco na lista de aulas</title>
    <style>
      .bloco { width: 440px; padding: var(--e3); border-radius: var(--raio-bloco); background: var(--cor-cartao); display: flex; flex-direction: column; gap: var(--e1); }
      .titulo { padding: 0 var(--e2) var(--e2); color: var(--cor-texto-2); font: var(--ui-rotulo); letter-spacing: .06em; text-transform: uppercase; }
      .aula { display: grid; grid-template-columns: 1fr auto; align-items: center; min-height: var(--item-lista); padding: 6px var(--e3); border-radius: var(--raio-item); font: var(--ui-item); }
      .aula small { color: var(--cor-texto-2); font: var(--ui-apoio); }
      .aula .c { grid-row: 1 / 3; grid-column: 2; font: var(--ui-apoio); color: var(--cor-texto-2); }
      .sel { background: color-mix(in srgb, var(--cor-escolhido) 55%, var(--cor-cartao)); }
      .par { display: flex; gap: var(--e5); flex-wrap: wrap; }
      .legenda { color: var(--cor-texto-2); font: var(--ui-apoio); margin-bottom: var(--e2); }

      /* Hoje: 4px, item de 56px com 12px de recuo */
      .v-atual .foco { outline: 4px solid var(--cor-contorno-foco); outline-offset: -4px; }
      /* A: contorno de 2px */
      .v-a .foco { outline: 2px solid var(--cor-contorno-foco); outline-offset: -2px; }
      /* B: 4px, mas o item cresce: 68px de altura e 20px de recuo lateral */
      .v-b .aula { min-height: 68px; padding: 8px 20px; }
      .v-b .foco { outline: 4px solid var(--cor-contorno-foco); outline-offset: -4px; }
      /* C: 2px e item um pouco maior (64px, recuo de 16px) */
      .v-c .aula { min-height: 64px; padding: 8px var(--e4); }
      .v-c .foco { outline: 2px solid var(--cor-contorno-foco); outline-offset: -2px; }
      /* D: sem contorno; o item em foco recebe fundo da cor ativa suave e título na cor ativa */
      .v-d .foco { background: color-mix(in srgb, var(--cor-cursor) 22%, var(--cor-cartao)); }
      .v-d .foco b { color: var(--cor-cursor); }
      .v-d .foco.sel { background: color-mix(in srgb, var(--cor-cursor) 30%, var(--cor-cartao)); }
    </style>
  </head>
  <body>
    <script type="module">
      import { Sala } from './_sala.js';
      const lista = (itens) => `<div class="bloco"><div class="titulo">Aulas · 4</div>${itens.map(([t, d, c, cls]) =>
        `<div class="aula ${cls}"><b>${t}</b><span class="c">${c} cartões</span><small>${d}</small></div>`).join('')}</div>`;
      const base = [['Mutações e reparo do DNA', '27 out · 2º bimestre', 0], ['Expressão gênica', '08 nov · 2º bimestre', 9], ['Herança mendeliana', '02 nov · 1º bimestre', 4]];
      const com = (cls) => lista(base.map((a, i) => [...a, cls[i] ?? '']));
      const v = (id, nome) => ({ id, nome, html: () => `<div class="v-${id}"><div class="par">
        <div><div class="legenda">Só foco (2ª aula)</div>${com(['', 'foco', ''])}</div>
        <div><div class="legenda">Selecionada (1ª) e foco (2ª)</div>${com(['sel', 'foco', ''])}</div>
        <div><div class="legenda">Selecionada e em foco (1ª)</div>${com(['sel foco', '', ''])}</div></div></div>` });
      Sala.montar({
        titulo: 'Acervo 4b: foco na lista de aulas',
        dados: {},
        variantes: [v('atual', 'Hoje (4px, item de 56px)'), v('a', 'A. 2px'), v('b', 'B. 4px com item maior (68px)'), v('c', 'C. 2px com item de 64px'), v('d', 'D. Sem contorno: fundo da cor ativa')],
      });
    </script>
  </body>
</html>
