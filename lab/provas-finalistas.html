<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Finalistas do cartão de provas</title>
    <style>
      /* Hub inteiro nas proporções reais: faixa de provas em cima, calendário, agenda e lembretes embaixo. */
      .hub {
        display: grid;
        grid-template-rows: 26% minmax(0, 1fr);
        gap: var(--vao-mosaico);
        height: calc(var(--lab-w) * 0.5625px);
      }
      .bloco {
        min-width: 0;
        min-height: 0;
        padding: var(--bloco-pad-y) var(--bloco-pad-x);
        border-radius: var(--raio-bloco);
        background: var(--cor-cartao);
        overflow: hidden;
      }
      .bloco h3 {
        margin-bottom: var(--e3);
        color: var(--cor-texto-2);
        font: var(--ui-rotulo);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .baixo {
        display: grid;
        grid-template-columns: 30fr 40fr 30fr;
        gap: var(--vao-mosaico);
        min-height: 0;
      }
      .cal {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: var(--e2) 0;
        justify-items: center;
        font: var(--ui-botao);
      }
      .cal span.p {
        border-radius: 50%;
        background: var(--cor-cartao-2);
        width: 30px;
        text-align: center;
      }
      .cal span.h {
        border-radius: 50%;
        background: var(--cor-botao);
        color: var(--cor-sobre-botao);
        width: 30px;
        text-align: center;
      }
      .linha {
        display: flex;
        justify-content: space-between;
        padding: var(--e2) 0;
        font: var(--voz-mini);
      }
      .linha small {
        color: var(--cor-texto-2);
        font: var(--ui-apoio);
      }
      .lembra {
        padding: var(--e2) 0;
        font: var(--ui-item);
      }

      /* Faixa de provas: colunas com largura mínima; passam do limite, rola na horizontal */
      .provas {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(220px, 1fr);
        gap: var(--vao-mosaico);
        min-height: 0;
        overflow-x: auto;
      }
      .prova {
        display: grid;
        min-width: 0;
        min-height: 0;
        border-radius: var(--raio-bloco);
        overflow: hidden;
      }
      .preenche {
        min-width: 0;
        min-height: 0;
        padding: var(--bloco-pad-y) var(--bloco-pad-x);
        background: var(--cor-cartao);
        color: var(--cor-texto);
      }
      /* Dia mais próximo em destaque, como a aula "agora" da Agenda; siglas invertidas */
      .prova:first-child .preenche {
        background: var(--cor-destaque);
        color: var(--cor-tinta);
      }
      .prova:first-child .pilula {
        background: var(--cor-tinta);
        color: var(--cor-sobre-tinta);
      }
      .rotulo {
        font: var(--ui-rotulo);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .falta {
        color: var(--cor-texto-2);
        font: var(--ui-apoio);
      }
      .prova:first-child .falta {
        color: color-mix(in srgb, var(--cor-tinta) 70%, transparent);
      }
      .pilula {
        padding: 4px 11px;
        border-radius: var(--raio-pilula);
        background: var(--cor-materia);
        color: var(--cor-tinta);
        font: var(--ui-sigla);
      }
      /* Fila de 4 vagas iguais: com 1 ou 4 provas, as siglas ficam no mesmo lugar */
      .fila {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: var(--e1);
      }
      .fila .pilula {
        padding: 4px 0;
        text-align: center;
      }

      /* F1: cabeçalho escuro com semana e mês; corpo com o dia grande, "em X d" na mesma linha de base,
         e a fila de 4 vagas de sigla no pé (vaga vazia = fantasma). Mesmo respiro de 16px nos lados. */

          [data-v='f1'],
          [data-v='f2'],
          [data-v='k2'],
          [data-v='k3'],
          [data-v='k4'],
          [data-v='m1'],
          [data-v='r1'],
          [data-v='r2'],
          [data-v='r3'],
          [data-v='t1'],
          [data-v='t2'],
          [data-v='t3'],
          [data-v='u1'],
          [data-v='u2'],
          [data-v='u3'],
          [data-v='x1'],
          [data-v='x2'],
          [data-v='x3'],
          [data-v='x4'],
          [data-v='y1'],
          [data-v='y2'],
          [data-v='y3'],
          [data-v='y4'],
          [data-v='z1'],
          [data-v='z2'],
          [data-v='l1'],
          [data-v='l2'],
          [data-v='n1'],
          [data-v='n2']
        )
        .preenche {
        --inset: var(--e4);
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        padding: 0;
      }
      :is(
          [data-v='f1'],
          [data-v='f2'],
          [data-v='k2'],
          [data-v='k3'],
          [data-v='k4'],
          [data-v='m1'],
          [data-v='r1'],
          [data-v='r2'],
          [data-v='r3'],

          [data-v='n2']

        .cab {
        display: flex;
        align-items: center;

        padding: 0 var(--inset);
        padding-bottom: 1px;
        background: var(--cab-bg, var(--cor-tinta));
        color: var(--cab-fg, var(--cor-sobre-tinta));

        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      }
      :is(

          [data-v='f2'],
          [data-v='k2'],
          [data-v='k3'],
          [data-v='k4'],
          [data-v='m1'],

      :is(

        .num {

        letter-spacing: -0.03em;
        font-variant-numeric: tabular-nums;
        text-box: trim-both cap alphabetic;
      }
      /* Cada dígito tem um respiro de lado diferente na fonte: o puxão compensa para que a tinta do

      :is(
          [data-v='f1'],
          [data-v='f2'],

          [data-v='m1'],

      :is(

      /* O espaçamento entre letras também vai depois da última: tira para a tinta do mês encostar em 16px */

          [data-v='z2'],
          [data-v='l1'],

          [data-v='n1'],
          [data-v='n2']
        )
        .cab
        > :last-child {
        margin-right: -0.06em;
      }
      :is(
          [data-v='f1'],
          [data-v='f2'],
          [data-v='k2'],
          [data-v='k3'],
          [data-v='k4'],

        )
        .falta {

      :is(

      /* F2: a faixa escura diz o TIPO do que está marcado (prova, trabalho, apresentação) à esquerda;
         semana e mês, mais discretos, à direita. Dia com mais de um tipo mostra o primeiro e "+N". */

        gap: var(--e3);
        font-size: 12px;
        letter-spacing: 0.04em;
      }

        gap: var(--e3);
        font-size: 12px;
        letter-spacing: 0.04em;

        margin-right: -0.04em;

      }

        display: flex;
        align-items: center;
        gap: var(--e3);
      }
      :is([data-v='k2'], [data-v='k3'], [data-v='k4'], [data-v='m1']) .tp {

        align-items: center;
        gap: 7px;
        white-space: nowrap;
      }
      :is([data-v='k2'], [data-v='k3'], [data-v='k4'], [data-v='m1']) .tp b {
        font-weight: 700;
        text-box: trim-both cap alphabetic;
      }
      :is([data-v='m1']) .tp svg {
        flex: none;
        height: 22px;
        width: auto;
        fill: currentColor;
      }
      /* K2: letra numa pastilha clara redonda, como um selo */
      [data-v='k2'] .tp {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: var(--raio-pilula);
        background: var(--cab-chip-bg, var(--cor-sobre-tinta));
        color: var(--cab-chip-fg, var(--cor-tinta));
      }
      [data-v='k2'] .tp b {
        font: 800 15px/1 var(--fonte-voz);
        letter-spacing: 0;
        text-box: trim-both cap alphabetic;
      }
      [data-v='k2'] .tipos {
        gap: 6px;
      }
      /* K3: letra num quadrado arredondado só de contorno */
      [data-v='k3'] .tp {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 9px;
        box-shadow: inset 0 0 0 2px var(--cab-fg, var(--cor-sobre-tinta));
      }
      [data-v='k3'] .tp b {
        font: 800 15px/1 var(--fonte-voz);
        letter-spacing: 0;
        text-box: trim-both cap alphabetic;
      }
      [data-v='k3'] .tipos {
        gap: 6px;
      }
      /* Tema escuro: a faixa de --cor-tinta (preto esverdeado) some e destoa do cartão azul-escuro.
         Três saídas, escolhidas no seletor "Faixa no escuro" da barra (só valem no tema escuro). */
      :root[data-tema='escuro'][data-faixa='a'] {
        --cab-bg: var(--cor-sobre-tinta);
        --cab-fg: var(--cor-tinta);
        --cab-chip-bg: var(--cor-tinta);
        --cab-chip-fg: var(--cor-sobre-tinta);
      }
      :root[data-tema='escuro'][data-faixa='b'] {
        --cab-bg: var(--cor-cartao-2);
        --cab-fg: var(--cor-texto);
        --cab-chip-bg: var(--cor-texto);
        --cab-chip-fg: var(--cor-cartao);
      }
      :root[data-tema='escuro'][data-faixa='c'] {
        --cab-bg: color-mix(in srgb, var(--cor-destaque) 30%, var(--cor-cartao));
        --cab-fg: var(--cor-texto);
        --cab-chip-bg: var(--cor-texto);
        --cab-chip-fg: var(--cor-cartao);
      }
      /* Refinos da combinação escolhida: paleta B no escuro + faixa C (violeta suave). Só valem no escuro. */
      /* R1: o dia mais próximo mantém a faixa escura (como no claro) sobre o corpo violeta; os demais, faixa C */
      :root[data-tema='escuro'][data-faixa='r1'] {
        --cab-bg: color-mix(in srgb, var(--cor-destaque) 30%, var(--cor-cartao));
        --cab-fg: var(--cor-texto);
        --cab-chip-bg: var(--cor-texto);
        --cab-chip-fg: var(--cor-cartao);
      }
      :root[data-tema='escuro'][data-faixa='r1'] .prova:first-child .cab {
        --cab-bg: var(--cor-tinta);
        --cab-fg: var(--cor-sobre-tinta);
        --cab-chip-bg: var(--cor-sobre-tinta);
        --cab-chip-fg: var(--cor-tinta);
      }
      /* R2: faixa tonal calma, um sopro de violeta sobre o tom elevado do cartão; o mais próximo, um pouco mais forte */
      :root[data-tema='escuro'][data-faixa='r2'] {
        --cab-bg: color-mix(in srgb, var(--cor-destaque) 14%, var(--cor-cartao-2));
        --cab-fg: var(--cor-texto);
        --cab-chip-bg: var(--cor-texto);
        --cab-chip-fg: var(--cor-cartao);
      }
      :root[data-tema='escuro'][data-faixa='r2'] .prova:first-child .cab {
        --cab-bg: color-mix(in srgb, var(--cor-tinta) 82%, var(--cor-destaque));
      }
      /* R3: tudo em violeta: faixa C, marcas em violeta claro e o mais próximo todo no mesmo violeta */
      :root[data-tema='escuro'][data-faixa='r3'] {
        --cab-bg: color-mix(in srgb, var(--cor-destaque) 30%, var(--cor-cartao));
        --cab-fg: color-mix(in srgb, var(--cor-destaque) 35%, var(--cor-texto));
        --cab-chip-bg: var(--cor-destaque);
        --cab-chip-fg: var(--cor-tinta);
      }
      :root[data-tema='escuro'][data-faixa='r3'] .prova:first-child .cab {
        --cab-bg: var(--cor-destaque-forte);
        --cab-fg: var(--cor-tinta);
        --cab-chip-bg: var(--cor-tinta);
        --cab-chip-fg: var(--cor-sobre-tinta);
      }
      /* R1 a R3: a combinação escolhida (paleta A + faixa C) refinada. A faixa vem de variáveis por tema:
         claro = tinta; escuro = violeta/azul de destaque a 30% sobre o cartão. Vagas vazias mais visíveis no escuro. */
      :root {
        --r-bg: var(--cor-tinta);
        --r-fg: var(--cor-sobre-tinta);
        --r-chip-bg: var(--cor-sobre-tinta);
        --r-chip-fg: var(--cor-tinta);
      }
      :root[data-tema='escuro'] {
        --r-bg: color-mix(in srgb, var(--cor-destaque) 30%, var(--cor-cartao));
        --r-fg: var(--cor-texto);
        --r-chip-bg: var(--cor-texto);
        --r-chip-fg: var(--cor-cartao);
      }
      :is([data-v='r1'], [data-v='r2'], [data-v='r3']) .cab {
        gap: var(--e3);
        font-size: 12px;
        letter-spacing: 0.04em;
        background: var(--r-bg);
        color: var(--r-fg);
      }
      :is([data-v='r1'], [data-v='r2'], [data-v='r3']) .cab > :last-child {
        white-space: nowrap;
        margin-right: -0.04em;
        color: color-mix(in srgb, var(--r-fg) 80%, transparent);
      }
      :is([data-v='r1'], [data-v='r2'], [data-v='r3']) .tipos {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      :is([data-v='r1'], [data-v='r2'], [data-v='r3']) .tp {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
      }
      :is([data-v='r1'], [data-v='r2'], [data-v='r3']) .tp b {
        font: 800 15px/1 var(--fonte-voz);
        letter-spacing: 0;
        text-box: trim-both cap alphabetic;
      }
      :root[data-tema='escuro'] :is([data-v='r1'], [data-v='r2'], [data-v='r3']) .vaga {
        background: color-mix(in srgb, var(--cor-texto) 11%, var(--cor-cartao));
      }
      :root[data-tema='escuro']
        :is([data-v='r1'], [data-v='r2'], [data-v='r3'])
        .prova:first-child
        .vaga {
        background: color-mix(in srgb, var(--cor-tinta) 14%, transparent);
      }

      /* R1: letra numa pastilha clara; o dia mais próximo troca a faixa pela tinta (faixa escura sobre o corpo
         claro), então ele se destaca também pelo contraste da faixa, não só pela cor do corpo */
      [data-v='r1'] .tp {
        border-radius: var(--raio-pilula);
        background: var(--r-chip-bg);
        color: var(--r-chip-fg);
      }
      :root[data-tema='escuro'] [data-v='r1'] .prova:first-child .cab {
        --r-bg: var(--cor-tinta);
        --r-fg: var(--cor-sobre-tinta);
        --r-chip-bg: var(--cor-sobre-tinta);
        --r-chip-fg: var(--cor-tinta);
      }

      /* R2: ícone Phosphor; a faixa fica mais intensa quanto mais perto é o dia (22% a 52% de destaque),
         um relógio sem texto. Cor do texto da data sobe para 90% para manter o contraste AA nas faixas fortes. */
      [data-v='r2'] .tp {
        width: auto;
        height: 22px;
        color: var(--r-fg);
      }
      [data-v='r2'] .tp svg {
        flex: none;
        height: 22px;
        width: auto;
        fill: currentColor;
      }
      [data-v='r2'] .cab > :last-child {
        color: color-mix(in srgb, var(--r-fg) 90%, transparent);
      }
      :root[data-tema='escuro'] [data-v='r2'] .cab {
        background: color-mix(in srgb, var(--cor-destaque) var(--mix, 30%), var(--cor-cartao));
      }
      [data-v='r2'] .prova:nth-child(1) .cab {
        --mix: 50%;
      }
      [data-v='r2'] .prova:nth-child(2) .cab {
        --mix: 40%;
      }
      [data-v='r2'] .prova:nth-child(3) .cab {
        --mix: 34%;
      }
      [data-v='r2'] .prova:nth-child(4) .cab {
        --mix: 29%;
      }
      [data-v='r2'] .prova:nth-child(5) .cab {
        --mix: 25%;
      }
      [data-v='r2'] .prova:nth-child(6) .cab {
        --mix: 22%;
      }

      /* R3: a faixa vira uma pílula interna arredondada (8px de recuo), com a letra num quadrado de contorno.
         Os 16px das bordas continuam valendo: 8px do recuo + 8px de respiro dentro da faixa. */
      [data-v='r3'] .preenche {
        padding: 8px;
      }
      [data-v='r3'] .cab {
        padding: 0 8px 1px;
        border-radius: calc(var(--raio-bloco) - 8px);
      }
      [data-v='r3'] .corpo {
        padding: var(--inset) 8px 8px;
      }
      [data-v='r3'] .tp {
        border-radius: 9px;
        box-shadow: inset 0 0 0 2px var(--r-fg);
      }
      /* K4: o quadrado arredondado do K3, mas cheio e claro (fundo branco, letra escura): sólido e calmo,
         sem o contorno fino que se perde sobre a faixa colorida */
      [data-v='k4'] .tp {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 9px;
        background: var(--cab-chip-bg, var(--cor-sobre-tinta));
        color: var(--cab-chip-fg, var(--cor-tinta));
      }
      [data-v='k4'] .tp b {
        font: 800 15px/1 var(--fonte-voz);
        letter-spacing: 0;
        text-box: trim-both cap alphabetic;
      }
      [data-v='k4'] .tipos {
        gap: 6px;
      }
      /* T1 a T3: o tipo escrito da F2 em três doses, para quando o bloco tiver mais que provas.
         Regra comum do dia com dois tipos: vale o mais importante (prova, apresentação, trabalho)
         e um "+1" mais apagado; o nome completo fica no nome acessível. */
      :is([data-v='t1'], [data-v='t2'], [data-v='t3']) .cab {
        gap: var(--e2);
        font-size: 12px;
        letter-spacing: 0.04em;
      }
      :is([data-v='t1'], [data-v='t2'], [data-v='t3']) .cab > * {
        white-space: nowrap;
      }
      :is([data-v='t1'], [data-v='t2'], [data-v='t3']) .cab > :last-child {
        margin-right: -0.04em;
      }
      :is([data-v='t1'], [data-v='t2']) .cab > :last-child,
      [data-v='t3'] .cab .data {
        color: color-mix(in srgb, var(--cab-fg, var(--cor-sobre-tinta)) 72%, transparent);
      }
      :is([data-v='t1'], [data-v='t2'], [data-v='t3']) .mais {
        margin-left: 0.4em;
        opacity: 0.72;
      }
      /* T2: o tipo numa etiqueta tonal, com a mesma fonte e forma da sigla do pé do cartão */
      [data-v='t2'] .tipo {
        padding: 4px 8px;
        margin-left: -1px;
        border-radius: var(--raio-pilula);
        background: color-mix(in srgb, var(--cab-fg, var(--cor-sobre-tinta)) 16%, transparent);
        font: var(--ui-sigla);
        letter-spacing: 0.04em;
      }
      [data-v='t2'] .tipo .mais {
        font-weight: 600;
      }
      /* U1 a U3: a faixa da F1 fica intacta. U1 e U3 levam o tipo para o lado do número, acima do "em X d",
         formando uma frase curta ("prova, em 7 d"); U2 inverte a F2: data primeiro, tipo apagado à direita. */
      :is([data-v='u1'], [data-v='u3'], [data-v='x1'], [data-v='x2'], [data-v='x3'], [data-v='x4'], [data-v='y1'], [data-v='y2'], [data-v='y3'], [data-v='y4'], [data-v='z1'], [data-v='z2'], [data-v='l1'], [data-v='l2'], [data-v='n1'], [data-v='n2']) .linhaDia {
        align-items: flex-end;
      }
      :is([data-v='u1'], [data-v='u3'], [data-v='x1'], [data-v='x2'], [data-v='x3'], [data-v='x4'], [data-v='y1'], [data-v='y2'], [data-v='y3'], [data-v='y4'], [data-v='z1'], [data-v='z2'], [data-v='l1'], [data-v='l2'], [data-v='n1'], [data-v='n2']) .lado {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: var(--e2);
        white-space: nowrap;
      }
      :is([data-v='u1'], [data-v='u3'], [data-v='x1'], [data-v='x2'], [data-v='x3'], [data-v='x4'], [data-v='y1'], [data-v='y2'], [data-v='y3'], [data-v='y4'], [data-v='z1'], [data-v='z2'], [data-v='l1'], [data-v='l2'], [data-v='n1'], [data-v='n2']) .tipoC {
        text-box: trim-both cap alphabetic;
      }
      [data-v='u1'] .tipoC {
        font: var(--ui-sigla);
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin-right: -0.04em;
      }
      :is([data-v='u3'], [data-v='x1'], [data-v='x2'], [data-v='x3'], [data-v='x4'], [data-v='y1'], [data-v='y2'], [data-v='y3'], [data-v='y4'], [data-v='z1'], [data-v='z2'], [data-v='l1'], [data-v='l2'], [data-v='n1'], [data-v='n2']) .tipoC {
        font: var(--ui-apoio);
        font-weight: 700;
      }
      :is([data-v='u1'], [data-v='u3'], [data-v='x1'], [data-v='x2'], [data-v='x3'], [data-v='x4'], [data-v='y1'], [data-v='y2'], [data-v='y3'], [data-v='y4'], [data-v='z1'], [data-v='z2'], [data-v='l1'], [data-v='l2'], [data-v='n1'], [data-v='n2']) .mais {
        margin-left: 0.3em;
        opacity: 0.6;
      }
      [data-v='u2'] .cab {
        gap: var(--e2);
        font-size: 12px;
        letter-spacing: 0.04em;
      }
      [data-v='u2'] .cab > * {
        white-space: nowrap;
      }
      [data-v='u2'] .cab > :last-child {
        margin-right: -0.04em;
        color: color-mix(in srgb, var(--cab-fg, var(--cor-sobre-tinta)) 72%, transparent);
      }
      [data-v='u2'] .mais {
        margin-left: 0.4em;
      }
      /* "+N": pílula neutra sobre a vaga fantasma, sem cor de matéria (não é uma matéria) */
      .vaga .pilula.excede,
      .prova:first-child .vaga .pilula.excede {
        background: transparent;
        color: inherit;
      }
      /* X1 a X4: quatro jeitos de dizer "há mais um tipo" depois da palavra (só o marcador muda, U3 igual) */
      .mais.x1,
      .mais.x2,
      .mais.x4 {
        display: inline-grid;
        place-items: center;
        margin-left: 6px;
        opacity: 1;
        font: 700 11px/1 var(--fonte-interface);
        letter-spacing: 0;
        text-transform: none;
      }
      .mais.x1 {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        box-shadow: inset 0 0 0 1.5px currentColor;
      }
      .mais.x2 {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--cab-fg, var(--cor-sobre-tinta));
        color: var(--cab-bg, var(--cor-tinta));
      }
      .mais.x4 {
        padding: 3px 7px;
        border-radius: var(--raio-pilula);
        background: color-mix(in srgb, var(--cab-fg, var(--cor-sobre-tinta)) 16%, transparent);
        font: var(--ui-sigla);
        color: inherit;
      }
      .mais.x3 {
        display: inline-flex;
        gap: 3px;
        margin-left: 6px;
        opacity: 1;
        vertical-align: middle;
      }
      .mais.x3 i {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: currentColor;
      }
      /* Y1 a Y4: o marcador só usa currentColor, então acompanha o claro, o escuro e o cartão destacado
         (corpo roxo com texto de tinta). As X usavam as cores da faixa dentro do corpo e sumiam no claro. */
      .tipos2 {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
      }
      .tipoC.sec {
        font-weight: 600;
        opacity: 0.68;
      }
      .tipoC.y2,
      .tipoC.y3 {
        display: flex;
        align-items: center;
        text-box: normal;
      }
      .tipoC.y2 {
        gap: 8px;
        line-height: 22px;
      }
      .mais.y2 {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        margin: 0;
        border-radius: 50%;
        background: color-mix(in srgb, currentColor 16%, transparent);
        font: 700 12px/1 var(--fonte-interface);
        letter-spacing: 0;
        opacity: 1;
      }
      .tipoC.y3 {
        gap: 6px;
        padding: 3px 10px;
        border-radius: var(--raio-pilula);
        box-shadow: inset 0 0 0 1.5px color-mix(in srgb, currentColor 50%, transparent);
        line-height: 18px;
      }
      .mais.y3 {
        margin: 0;
        opacity: 0.7;
        font-weight: 600;
      }
      .tipoC.y4 {
        max-width: 118px;
        white-space: normal;
        text-align: right;
        text-wrap: balance;
        line-height: 16px;
      }
      /* Z1: o círculo do Y2 na cor de destaque do tema (sempre com --cor-tinta por cima, como as siglas).
         No cartão do dia mais próximo o fundo já é o destaque, então o círculo inverte para tinta. */
      :is([data-v='z1'], [data-v='z2'], [data-v='l1'], [data-v='l2'], [data-v='n1'], [data-v='n2']) .mais.y2 {
        background: var(--cor-destaque);
        color: var(--cor-tinta);
      }
      :is([data-v='z1'], [data-v='z2'], [data-v='l1'], [data-v='l2'], [data-v='n1'], [data-v='n2']) .prova:first-child .mais.y2 {
        background: var(--cor-tinta);
        color: var(--cor-sobre-tinta);
      }
      /* Z2: um círculo por tipo extra, com a inicial (P, T, A); a palavra continua sendo o tipo principal */
      .bolas {
        display: flex;
        gap: 4px;
      }
      :is([data-v='z2'], [data-v='l1'], [data-v='l2'], [data-v='n1'], [data-v='n2']) .mais.y2 {
        font-weight: 800;
      }
      /* L1 e L2: revisão para tirar poluição. Prova sozinha não leva marca (é o padrão); as vagas vazias ficam
         no lugar, mas invisíveis, então as siglas seguem alinhadas sem os três fantasmas por cartão. */
      :is([data-v='l1'], [data-v='l2'], [data-v='n1'], [data-v='n2']) .vaga:empty,
      :is([data-v='l1'], [data-v='l2'], [data-v='n1'], [data-v='n2']) .prova:first-child .vaga:empty {
        background: transparent;
      }
      /* N1 e N2: a L1 repensada. O tipo deixa de competir com o número: mesma letra apagada do "em X d",
         formando um só bloco de apoio; sem cor de destaque fora do cartão mais próximo. */
      :is([data-v='n1'], [data-v='n2']) .lado {
        gap: 10px;
      }
      .tipoM {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .bola {
        display: grid;
        place-items: center;
        width: 18px;
        height: 18px;
        margin-block: -4px;
        border-radius: 50%;
        background: color-mix(in srgb, currentColor 18%, transparent);
        font: 700 10px/1 var(--fonte-interface);
        text-box: normal;
      }
      .tipoM.frase {
        display: block;
        max-width: 118px;
        white-space: normal;
        text-align: right;
        text-wrap: balance;
        line-height: 16px;
      }
    </style>

  <body>
    <script type="module">
      import { Sala } from './_sala.js';

      const DIAS = [
        { dias: 7, sem: 'sáb', dia: 14, mes: 'nov', tipos: ['prova'], provas: [['GEN', 0]] },
        {

        {

            ['FAR', 4],

        {

            ['APS', 3],

        },
        {

          ],
        },
        { dias: 31, sem: 'ter', dia: 8, mes: 'dez', tipos: ['apresentação'], provas: [['PRO', 6]] },
      ];

      const vagas = (d) =>
        `<span class="vagas">${[0, 1, 2, 3]
          .map((k) => {
            // Mais de 4 matérias: a 4ª vaga vira "+N" com as que não couberam
            if (k === 3 && d.provas.length > 4) {
              const resto = d.provas.slice(3).map((p) => p[0]);
              return `<span class="vaga"><b class="pilula excede" title="${resto.join(', ')}" aria-label="mais ${resto.length}: ${resto.join(', ')}">+${resto.length}</b></span>`;
            }
            const p = d.provas[k];
            return `<span class="vaga">${p ? `<b class="pilula" data-materia="${p[1]}">${p[0]}</b>` : ''}</span>`;
          })
          .join('')}</span>`;
      const falta = (d) => `<span class="falta">em ${d.dias} d</span>`;

      const cartaoTipo = (tipos) => (d) =>
        `<span class="cab"><span class="tipos">${tipos(d)}</span><span>${d.sem} · ${d.mes}</span></span><span class="corpo"><span class="linhaDia"><b class="num" data-d="${DD(d)[0]}">${DD(d)}</b>${falta(d)}</span>${vagas(d)}</span>`;
      const DD = (d) => String(d.dia).padStart(2, '0');

      const PH_FILL = {
        prova:
          '<svg viewBox="24 40 208 184.01" aria-hidden="true"><path d="M96,113.89,107.06,136H84.94ZM232,56V216a8,8,0,0,1-11.58,7.16L192,208.94l-28.42,14.22a8,8,0,0,1-7.16,0L128,208.94,99.58,223.16a8,8,0,0,1-7.16,0L64,208.94,35.58,223.16A8,8,0,0,1,24,216V56A16,16,0,0,1,40,40H216A16,16,0,0,1,232,56ZM135.16,156.42l-32-64a8,8,0,0,0-14.32,0l-32,64a8,8,0,0,0,14.32,7.16L76.94,152h38.12l5.78,11.58a8,8,0,1,0,14.32-7.16ZM208,128a8,8,0,0,0-8-8H184V104a8,8,0,0,0-16,0v16H152a8,8,0,0,0,0,16h16v16a8,8,0,0,0,16,0V136h16A8,8,0,0,0,208,128Z"></path></svg>',
        trabalho:
          '<svg viewBox="32 32 192 192" aria-hidden="true"><path d="M208,32H48A16,16,0,0,0,32,48V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V48A16,16,0,0,0,208,32ZM80,208H48V48H80Zm96-56H112a8,8,0,0,1,0-16h64a8,8,0,0,1,0,16Zm0-32H112a8,8,0,0,1,0-16h64a8,8,0,0,1,0,16Z"></path></svg>',
        apresentação:
          '<svg viewBox="24 16 208 216" aria-hidden="true"><path d="M216,40H136V24a8,8,0,0,0-16,0V40H40A16,16,0,0,0,24,56V176a16,16,0,0,0,16,16H79.36L57.75,219a8,8,0,0,0,12.5,10l29.59-37h56.32l29.59,37a8,8,0,1,0,12.5-10l-21.61-27H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40ZM104,144a8,8,0,0,1-16,0V120a8,8,0,0,1,16,0Zm32,0a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Zm32,0a8,8,0,0,1-16,0V88a8,8,0,0,1,16,0Z"></path></svg>',
      };

      const LETRA = { prova: 'P', trabalho: 'T', apresentação: 'A' };
      const tpLetra = (t) =>
        `<span class="tp" title="${t}" role="img" aria-label="${t}"><b data-l="${LETRA[t]}">${LETRA[t]}</b></span>`;
      const tpPh = (set, t, texto = '') =>
        `<span class="tp" title="${t}" role="img" aria-label="${t}">${set[t]}${texto ? `<b>${texto}</b>` : ''}</span>`;
      const tiposLetra = (d) => d.tipos.map(tpLetra).join('');
      const tiposFill = (d) => d.tipos.map((t) => tpPh(PH_FILL, t)).join('');

      const PESO = ['prova', 'apresentação', 'trabalho'];
      const porPeso = (d) => [...d.tipos].sort((a, b) => PESO.indexOf(a) - PESO.indexOf(b));
      const corpo = (d) =>
        `<span class="corpo"><span class="linhaDia"><b class="num" data-d="${DD(d)[0]}">${DD(d)}</b>${falta(d)}</span>${vagas(d)}</span>`;
      const tipoEscrito = (d) => {
        const [primeiro, ...resto] = porPeso(d);
        return `<span class="tipo" aria-label="${porPeso(d).join(' e ')}">${primeiro}${resto.length ? `<span class="mais">+${resto.length}</span>` : ''}</span>`;
      };
      // T3: prova é o caso comum e fica como a F1; só o que foge da regra ganha a palavra
      const cabT3 = (d) =>
        d.tipos.length === 1 && d.tipos[0] === 'prova'
          ? `<span class="cab"><span>${d.sem}</span><span>${d.mes}</span></span>`
          : `<span class="cab">${tipoEscrito(d)}<span class="data">${d.sem} · ${d.mes}</span></span>`;

      const cabF1 = (d) => `<span class="cab"><span>${d.sem}</span><span>${d.mes}</span></span>`;
      const corpoComTipo = (d) =>
        `<span class="corpo"><span class="linhaDia"><b class="num" data-d="${DD(d)[0]}">${DD(d)}</b><span class="lado">${tipoEscrito(d).replace('class="tipo"', 'class="tipoC"')}${falta(d)}</span></span>${vagas(d)}</span>`;

      const marcaMais = (resto, estilo) =>
        estilo === 'x3'
          ? `<span class="mais x3" aria-label="mais ${resto} ${resto > 1 ? 'tipos' : 'tipo'}">${'<i></i>'.repeat(resto)}</span>`
          : `<span class="mais ${estilo}" aria-label="mais ${resto}">+${resto}</span>`;
      const tipoX = (d, estilo) => {
        const [primeiro, ...resto] = porPeso(d);
        return `<span class="tipoC">${primeiro}${resto.length ? marcaMais(resto.length, estilo) : ''}</span>`;
      };
      const corpoX = (d, estilo) =>
        `<span class="corpo"><span class="linhaDia"><b class="num" data-d="${DD(d)[0]}">${DD(d)}</b><span class="lado">${tipoX(d, estilo)}${falta(d)}</span></span>${vagas(d)}</span>`;

      const lista = (t) => (t.length > 1 ? `${t.slice(0, -1).join(', ')} e ${t[t.length - 1]}` : t[0]);
      const tipoY = (d, estilo) => {
        const tipos = porPeso(d);
        const [primeiro, ...resto] = tipos;
        const nome = (t, extra = '') => `<span class="tipoC${extra}">${t}</span>`;
        if (estilo === 'y1') {
          const linhas = [nome(primeiro)];
          if (resto[0]) linhas.push(nome(resto[0] + (resto.length > 1 ? ` +${resto.length - 1}` : ''), ' sec'));
          return `<span class="tipos2" aria-label="${lista(tipos)}">${linhas.join('')}</span>`;
        }
        if (estilo === 'y4') return `<span class="tipoC y4" aria-label="${lista(tipos)}">${lista(tipos)}</span>`;
        const mais = resto.length ? `<span class="mais ${estilo}" aria-label="mais ${resto.length}">+${resto.length}</span>` : '';
        return `<span class="tipoC ${estilo}">${primeiro}${mais}</span>`;
      };
      const corpoY = (d, estilo) =>
        `<span class="corpo"><span class="linhaDia"><b class="num" data-d="${DD(d)[0]}">${DD(d)}</b><span class="lado">${tipoY(d, estilo)}${falta(d)}</span></span>${vagas(d)}</span>`;

      const INICIAL = { prova: 'P', trabalho: 'T', apresentação: 'A' };
      const tipoZ2 = (d) => {
        const [primeiro, ...resto] = porPeso(d);
        const bolas = resto.map((t) => `<span class="mais y2" title="${t}" aria-label="${t}">${INICIAL[t]}</span>`).join('');
        return `<span class="tipoC y2">${primeiro}${bolas ? `<span class="bolas">${bolas}</span>` : ''}</span>`;
      };
      const corpoZ2 = (d) =>
        `<span class="corpo"><span class="linhaDia"><b class="num" data-d="${DD(d)[0]}">${DD(d)}</b><span class="lado">${tipoZ2(d)}${falta(d)}</span></span>${vagas(d)}</span>`;

      const soProva = (d) => d.tipos.length === 1 && d.tipos[0] === 'prova';
      const bolasDe = (tipos) =>
        tipos.length
          ? `<span class="bolas">${tipos.map((t) => `<span class="mais y2" title="${t}" aria-label="${t}">${INICIAL[t]}</span>`).join('')}</span>`
          : '';
      const tipoL1 = (d) => {
        if (soProva(d)) return '';
        const [primeiro, ...resto] = porPeso(d);
        return `<span class="tipoC y2">${primeiro}${bolasDe(resto)}</span>`;
      };
      const tipoL2 = (d) => (soProva(d) ? '' : `<span class="tipoC y2">${bolasDe(porPeso(d))}</span>`);
      const corpoL = (tipo) => (d) =>
        `<span class="corpo"><span class="linhaDia"><b class="num" data-d="${DD(d)[0]}">${DD(d)}</b><span class="lado">${tipo(d)}${falta(d)}</span></span>${vagas(d)}</span>`;

      const tipoN1 = (d) => {
        if (soProva(d)) return '';
        const [primeiro, ...resto] = porPeso(d);
        const bolas = resto.map((t) => `<span class="bola" title="${t}" aria-label="${t}">${INICIAL[t]}</span>`).join('');
        return `<span class="falta tipoM">${primeiro}${bolas}</span>`;
      };
      // N2: o bloco já é de provas, então "+ trabalho" diz "também tem trabalho"; sem prova, só o nome
      const tipoN2 = (d) => {
        if (soProva(d)) return '';
        const outros = porPeso(d).filter((t) => t !== 'prova');
        const nomes = outros.length > 1 ? `${outros.length} atividades` : outros[0];
        const texto = (d.tipos.includes('prova') ? '+ ' : '') + nomes;
        return `<span class="falta tipoM frase" aria-label="${lista(porPeso(d))}">${texto}</span>`;
      };

      const CARTOES = {
        u1: (d) => `${cabF1(d)}${corpoComTipo(d)}`,
        u2: (d) =>
          `<span class="cab"><span>${d.sem} · ${d.mes}</span>${tipoEscrito(d)}</span>${corpo(d)}`,
        u3: (d) => `${cabF1(d)}${corpoComTipo(d)}`,
        x1: (d) => `${cabF1(d)}${corpoX(d, 'x1')}`,
        x2: (d) => `${cabF1(d)}${corpoX(d, 'x2')}`,
        x3: (d) => `${cabF1(d)}${corpoX(d, 'x3')}`,
        x4: (d) => `${cabF1(d)}${corpoX(d, 'x4')}`,
        y1: (d) => `${cabF1(d)}${corpoY(d, 'y1')}`,
        y2: (d) => `${cabF1(d)}${corpoY(d, 'y2')}`,
        y3: (d) => `${cabF1(d)}${corpoY(d, 'y3')}`,
        y4: (d) => `${cabF1(d)}${corpoY(d, 'y4')}`,
        z1: (d) => `${cabF1(d)}${corpoY(d, 'y2')}`,
        z2: (d) => `${cabF1(d)}${corpoZ2(d)}`,
        l1: (d) => `${cabF1(d)}${corpoL(tipoL1)(d)}`,
        l2: (d) => `${cabF1(d)}${corpoL(tipoL2)(d)}`,
        n1: (d) => `${cabF1(d)}${corpoL(tipoN1)(d)}`,
        n2: (d) => `${cabF1(d)}${corpoL(tipoN2)(d)}`,
        t1: (d) =>
          `<span class="cab">${tipoEscrito(d)}<span>${d.sem} · ${d.mes}</span></span>${corpo(d)}`,
        t2: (d) =>
          `<span class="cab">${tipoEscrito(d)}<span>${d.sem} · ${d.mes}</span></span>${corpo(d)}`,
        t3: (d) => `${cabT3(d)}${corpo(d)}`,
        f1: (d) =>
          `<span class="cab"><span>${d.sem}</span><span>${d.mes}</span></span><span class="corpo"><span class="linhaDia"><b class="num" data-d="${DD(d)[0]}">${DD(d)}</b>${falta(d)}</span>${vagas(d)}</span>`,
        f2: (d) =>
          `<span class="cab"><span>${d.tipos[0]}${d.tipos.length > 1 ? ` +${d.tipos.length - 1}` : ''}</span><span>${d.sem} · ${d.mes}</span></span><span class="corpo"><span class="linhaDia"><b class="num" data-d="${DD(d)[0]}">${DD(d)}</b>${falta(d)}</span>${vagas(d)}</span>`,
        k2: cartaoTipo(tiposLetra),
        k3: cartaoTipo(tiposLetra),
        m1: cartaoTipo(tiposFill),
        k4: cartaoTipo(tiposLetra),
        r1: cartaoTipo(tiposLetra),
        r2: cartaoTipo(tiposFill),
        r3: cartaoTipo(tiposLetra),
      };

      const dias = Array.from({ length: 35 }, (_, i) => i - 5);
      const calendario = dias
        .map((n) => {
          const dia = ((n + 29) % 30) + 1;
          const marca = n === 7 ? 'h' : [14, 18, 21, 27].includes(dia) && n > 0 ? 'p' : '';
          return `<span class="${marca}">${dia}</span>`;
        })
        .join('');

      const hub = (id, dados) => `
        <div class="hub">
          <div class="provas">${dados
            .map((d) => `<div class="prova"><span class="preenche">${CARTOES[id](d)}</span></div>`)
            .join('')}</div>
          <div class="baixo">
            <div class="bloco"><h3>Novembro 2026</h3><div class="cal">${calendario}</div></div>
            <div class="bloco"><h3>Agenda de hoje</h3>
              <div class="linha">Genética <small>08:00–09:30</small></div>
              <div class="linha">Atenção Primária <small>10:00–11:00</small></div>
              <div class="linha">Imunologia <small>13:00–15:00</small></div>
              <div class="linha">Propedêutica <small>15:10–17:00</small></div>
            </div>
            <div class="bloco"><h3>Lembretes</h3>
              <div class="lembra">Levar o jaleco para a Propedêutica.</div>
              <div class="lembra">Revisar IL-6 e TNF-α antes da prova.</div>
              <div class="lembra">Confirmar a sala de Genética.</div>
            </div>
          </div>
        </div>`;

      Sala.montar({
        titulo: 'Finalistas do cartão de provas',
        dados: DIAS,
        variantes: [
          {
            id: 'f1',
            nome: 'F1 · faixa escura com semana e mês, dia grande, 4 vagas de sigla',
            html: (d) => hub('f1', d),
          },
          {
            id: 'f2',
            nome: 'F2 · F1 com o tipo escrito (prova, trabalho, apresentação) à esquerda',
            html: (d) => hub('f2', d),
          },
          {
            id: 't1',
            nome: 'T1 · palavra: o tipo escrito forte à esquerda, semana e mês apagados à direita',
            html: (d) => hub('t1', d),
          },
          {
            id: 't2',
            nome: 'T2 · etiqueta: o tipo numa pílula tonal, igual à sigla do pé',
            html: (d) => hub('t2', d),
          },
          {
            id: 't3',
            nome: 'T3 · só a exceção: prova fica como a F1, trabalho e apresentação ganham a palavra',
            html: (d) => hub('t3', d),
          },
          {
            id: 'u1',
            nome: 'U1 · faixa da F1 intacta; o tipo em caixa-alta acima do "em X d", ao lado do número',
            html: (d) => hub('u1', d),
          },
          {
            id: 'u2',
            nome: 'U2 · F2 invertida: semana e mês à esquerda, o tipo apagado à direita',
            html: (d) => hub('u2', d),
          },
          {
            id: 'u3',
            nome: 'U3 · como a U1, com o tipo em minúsculas na fonte de voz, como uma frase',
            html: (d) => hub('u3', d),
          },
          {
            id: 'x1',
            nome: 'X1 · U3 com o "+1" num círculo de contorno',
            html: (d) => hub('x1', d),
          },
          {
            id: 'x2',
            nome: 'X2 · U3 com o "+1" num círculo cheio, invertido',
            html: (d) => hub('x2', d),
          },
          {
            id: 'x3',
            nome: 'X3 · U3 com um ponto por tipo extra, sem número',
            html: (d) => hub('x3', d),
          },
          {
            id: 'x4',
            nome: 'X4 · U3 com o "+1" numa pílula tonal, igual à sigla',
            html: (d) => hub('x4', d),
          },
          {
            id: 'y1',
            nome: 'Y1 · os tipos empilhados, o segundo apagado ("prova" / "trabalho")',
            html: (d) => hub('y1', d),
          },
          {
            id: 'y2',
            nome: 'Y2 · "+1" num círculo tonal maior (vale no claro e no escuro)',
            html: (d) => hub('y2', d),
          },
          {
            id: 'y3',
            nome: 'Y3 · o tipo todo numa pílula de contorno, "+1" dentro',
            html: (d) => hub('y3', d),
          },
          {
            id: 'y4',
            nome: 'Y4 · os tipos como frase: "prova e trabalho", quebrando em duas linhas',
            html: (d) => hub('y4', d),
          },
          {
            id: 'z1',
            nome: 'Z1 · Y2 com o círculo na cor de destaque do tema (invertido no dia mais próximo)',
            html: (d) => hub('z1', d),
          },
          {
            id: 'z2',
            nome: 'Z2 · Z1 com a inicial do tipo (P, T, A) dentro de um círculo por tipo extra',
            html: (d) => hub('z2', d),
          },
          {
            id: 'l1',
            nome: 'L1 · limpa: prova sozinha sem marca; outros tipos com a palavra e círculos; vagas vazias invisíveis',
            html: (d) => hub('l1', d),
          },
          {
            id: 'l2',
            nome: 'L2 · mais limpa: só círculos com a inicial (sem a palavra); prova sozinha sem marca',
            html: (d) => hub('l2', d),
          },
          {
            id: 'n1',
            nome: 'N1 · L1 em voz baixa: tipo na mesma letra apagada do "em X d", círculo neutro pequeno',
            html: (d) => hub('n1', d),
          },
          {
            id: 'n2',
            nome: 'N2 · só texto: "+ trabalho" quando há prova e algo mais; sem círculos',
            html: (d) => hub('n2', d),
          },
          {
            id: 'k2',
            nome: 'K2 · letra do tipo numa pastilha clara redonda',
            html: (d) => hub('k2', d),
          },
          {
            id: 'k3',
            nome: 'K3 · letra do tipo num quadrado arredondado de contorno',
            html: (d) => hub('k3', d),
          },
          {
            id: 'k4',
            nome: 'K4 · letra do tipo num quadrado arredondado de fundo branco',
            html: (d) => hub('k4', d),
          },
          { id: 'm1', nome: 'M1 · ícone Phosphor preenchido do tipo', html: (d) => hub('m1', d) },
          {
            id: 'r1',
            nome: 'R1 · letra em pastilha; no escuro o dia mais próximo ganha faixa escura',
            html: (d) => hub('r1', d),
          },
          {
            id: 'r2',
            nome: 'R2 · ícone; a faixa fica mais intensa quanto mais perto o dia',
            html: (d) => hub('r2', d),
          },
          {
            id: 'r3',
            nome: 'R3 · faixa interna arredondada, letra em quadrado de contorno',
            html: (d) => hub('r3', d),
          },
        ],
      });
      // Seletor extra da barra: como a faixa do cartão se comporta no tema escuro
      const FAIXAS = [
        ['', 'Atual (tinta)'],
        ['a', 'A · clara'],
        ['b', 'B · elevada'],
        ['c', 'C · violeta suave (escolhida)'],
        ['r1', 'R1 · mais próximo com faixa escura'],
        ['r2', 'R2 · tonal calma'],
        ['r3', 'R3 · tudo em violeta'],
      ];
      const faixaUrl = new URLSearchParams(location.search).get('faixa');
      let faixa = faixaUrl ?? 'c';
      if (faixaUrl === null) {
        try {
          faixa = localStorage.getItem('ohara2-lab-faixa-v2') ?? 'c';
        } catch {
          /* sem armazenamento */
        }
      }
      const aplicarFaixa = (valor) => {
        if (valor) document.documentElement.dataset.faixa = valor;
        else delete document.documentElement.dataset.faixa;
        try {
          localStorage.setItem('ohara2-lab-faixa-v2', valor);
        } catch {
          /* sem armazenamento */
        }
      };
      aplicarFaixa(faixa);
      const seletorFaixa = document.createElement('label');
      seletorFaixa.append('Faixa no escuro');
      const caixa = document.createElement('select');
      for (const [valor, texto] of FAIXAS)
        caixa.add(new Option(texto, valor, false, valor === faixa));
      caixa.onchange = () => aplicarFaixa(caixa.value);
      seletorFaixa.append(caixa);
      document.querySelector('.sala-barra .sala-grupo:not(.sala-slides)')?.append(seletorFaixa);
    </script>
  </body>
</html>
