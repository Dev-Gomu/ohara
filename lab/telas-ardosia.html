<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mesa, Treino e Notas na Ardósia</title>
    <style>
/* ===== Tokens do app (nomes iguais aos de codigo-atual/tokens.css) ===== */
.stage{
  --cor-destaque:#8aa0f8;
  --cor-materia-1: #8aa0f8; --cor-destaque-forte:#7389ea;
  --cor-materia-4:#e48ae8; --cor-materia-2:#5eb6ee; --cor-materia-0:#f27a9f; --cor-materia-3:#7fdcb0;
  --cor-tinta:#0e1428; --cor-sobre-tinta:#f3f5ff;
  --cor-materia-5:#ab94f4; --cor-materia-6:#3fd0c4; --cor-materia-7:#a3b0c4;
  --fonte-voz:'Nunito',system-ui,sans-serif; --fonte-interface:'Inter',system-ui,sans-serif; --fonte-leitura:'Source Sans 3','Inter',system-ui,sans-serif;
  --voz-numero:800 66px/54px var(--fonte-voz); --voz-numero-mini:800 48px/40px var(--fonte-voz);
  --voz-pergunta:800 32px/40px var(--fonte-voz); --voz-tela:800 30px/32px var(--fonte-voz);
  --voz-titulo:800 22px/24px var(--fonte-voz); --voz-item:800 20px/22px var(--fonte-voz); --voz-mini:800 17px/20px var(--fonte-voz);
  --ui-botao:700 15px/20px var(--fonte-interface); --ui-item:600 15px/20px var(--fonte-interface);
  --ui-apoio:500 14px/20px var(--fonte-interface); --ui-rotulo:700 13px/20px var(--fonte-interface);
  --ui-sigla:700 12.5px/16px var(--fonte-interface); --ui-tecla:600 12px/18px var(--fonte-interface);
  --leitura-texto:400 16.5px/25px var(--fonte-leitura); --leitura-compacta:400 15.5px/23px var(--fonte-leitura); --leitura-campo:400 16px/24px var(--fonte-leitura);
  --nota-t1:700 22px/28px var(--fonte-leitura); --nota-t2:700 18px/24px var(--fonte-leitura);
  --e1:4px; --e2:8px; --e3:12px; --e4:16px; --e5:24px; --e6:32px;
  --vao-mosaico:8px; --margem-tela:8px; --barra-topo:48px; --bloco-pad-y:14px; --bloco-pad-x:18px;
  --raio-bloco:24px; --raio-item:18px; --raio-botao:18px; --raio-campo:16px; --raio-minimo:8px; --raio-pilula:999px;
  --alvo:44px; --item-lista:56px; --anel-traco:3px; --anel-afastamento:3px; --borda-bloco:2px;
  --tempo-borda:200ms; --tempo-toque:120ms;
  width:1280px;height:800px;overflow:hidden;background:var(--cor-fundo);color:var(--cor-texto);
  font:var(--ui-apoio);font-variant-numeric:tabular-nums;font-synthesis:none;
}
/* Direção A · Papel Frio */
.stage[data-dir="a"][data-tema="claro"]{
  --cor-fundo:#eceff6; --cor-cartao:#ffffff; --cor-cartao-2:#e0e6f2; --cor-texto:#121830; --cor-texto-2:#525c78;
  --cor-acao:#2f47c6; --cor-sobre-acao:#ffffff; --cor-escolhido:#d3dcf9; --cor-foco:#121830; --cor-cursor:#3a52d2; --cor-nota-titulo:#121830; --cor-veu:rgb(18 24 48/40%); color-scheme:light}
.stage[data-dir="a"][data-tema="escuro"]{
  --cor-fundo:#0c1022; --cor-cartao:#141a33; --cor-cartao-2:#222b4f; --cor-texto:#eef1fb; --cor-texto-2:#a0a9c8;
  --cor-acao:#8ea4fa; --cor-sobre-acao:#0c1022; --cor-escolhido:#2a3770; --cor-foco:#eef1fb; --cor-cursor:#8ea4fa; --cor-nota-titulo:#aebcfc; --cor-veu:rgb(12 16 34/60%); color-scheme:dark}
/* Direção B · Ardósia */
.stage[data-dir="b"][data-tema="claro"]{
  --cor-fundo:#dfe4ea; --cor-cartao:#f7f9fb; --cor-cartao-2:#e6ebf0; --cor-texto:#0f1e27; --cor-texto-2:#465a68;
  --cor-acao:#14232d; --cor-sobre-acao:#f4f8fa; --cor-escolhido:#c9d3de; --cor-foco:#0f1e27; --cor-cursor:#4a62dc; --cor-nota-titulo:#0f1e27; --cor-veu:rgb(15 30 39/40%); color-scheme:light}
.stage[data-dir="b"][data-tema="escuro"]{
  --cor-fundo:#0e1519; --cor-cartao:#172026; --cor-cartao-2:#222e36; --cor-texto:#e8f0f4; --cor-texto-2:#93a7b3;
  --cor-acao:#e8f0f4; --cor-sobre-acao:#0e1519; --cor-escolhido:#2c3b46; --cor-foco:#e8f0f4; --cor-cursor:#8ea4fa; --cor-nota-titulo:#e8f0f4; --cor-veu:rgb(14 21 25/60%); color-scheme:dark}

[data-materia="0"]{--cor-materia:var(--cor-materia-0)} [data-materia="1"]{--cor-materia:var(--cor-destaque)}
[data-materia="2"]{--cor-materia:var(--cor-materia-2)}    [data-materia="3"]{--cor-materia:var(--cor-materia-3)}
[data-materia="4"]{--cor-materia:var(--cor-materia-4)}    [data-materia="5"]{--cor-materia:var(--cor-materia-5)}
[data-materia="6"]{--cor-materia:var(--cor-materia-6)}   [data-materia="7"]{--cor-materia:var(--cor-materia-7)}

/* ===== base.css (trechos que mudam por direção) ===== */
.stage *{box-sizing:border-box}
.stage h1,.stage h2,.stage h3,.stage p{margin:0}
.stage button{all:unset;box-sizing:border-box;cursor:default}
.stage svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.anel{outline:var(--anel-traco) solid var(--cor-foco);outline-offset:var(--anel-afastamento)}
.anel-i{outline:var(--anel-traco) solid var(--cor-foco);outline-offset:0}
.stage[data-dir="a"] .peca{box-shadow:0 0 0 1px var(--cor-cartao-2)}
.stage[data-dir="a"] .mono{border-radius:var(--raio-campo)}
.stage[data-dir="b"] .mono{border-radius:var(--raio-pilula)}

/* ===== Estrutura das telas ===== */
.tela{position:absolute;inset:0;padding:var(--margem-tela);display:flex;flex-direction:column;gap:var(--vao-mosaico)}
.barra{height:var(--barra-topo);display:flex;align-items:center;gap:var(--e2);flex:none}
.barra .tit{font:var(--voz-tela);margin-left:var(--e2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.barra .fim{margin-left:auto;display:flex;gap:var(--e2);align-items:center;flex:none}
.num{width:var(--alvo);height:var(--alvo);border-radius:var(--raio-pilula);display:grid;place-items:center;font:var(--ui-botao);background:var(--cor-cartao);color:var(--cor-texto-2);flex:none}
.num.at{background:var(--cor-acao);color:var(--cor-sobre-acao)}
.pil{height:var(--alvo);padding:0 var(--e4);border-radius:var(--raio-pilula);display:inline-flex;align-items:center;gap:var(--e2);background:var(--cor-cartao);font:var(--ui-botao);color:var(--cor-texto-2);flex:none;white-space:nowrap}
.pil.on{background:var(--cor-escolhido);color:var(--cor-texto)}
.pil.redondo{width:var(--alvo);padding:0;justify-content:center}
.pil .tecla{margin-left:2px}
.peca{background:var(--cor-cartao);border-radius:var(--raio-bloco)}
.bloco{border:var(--borda-bloco) solid transparent;padding:var(--bloco-pad-y) var(--bloco-pad-x);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;position:relative}
.bloco.ativo{border-color:var(--cor-cursor)}
.cab-b{display:flex;align-items:center;gap:var(--e2);height:28px;flex:none;margin-bottom:var(--e2)}
.rot{font:var(--ui-rotulo);letter-spacing:.06em;text-transform:uppercase;color:var(--cor-texto-2)}
.rot b{font-weight:700;color:var(--cor-texto);margin-left:6px;letter-spacing:0}
.tecla{display:inline-flex;align-items:center;height:22px;padding:0 var(--e2);border-radius:var(--raio-pilula);background:var(--cor-cartao-2);color:var(--cor-texto-2);font:var(--ui-tecla);white-space:nowrap}
.pil.on .tecla,.sel .tecla{background:var(--cor-cartao);}
.dots{margin-left:auto;color:var(--cor-texto-2);display:grid;place-items:center;width:28px;height:28px}
.cab-b .tecla{margin-left:auto}
.cab-b .tecla + .dots{margin-left:0}
.btn{height:52px;border-radius:var(--raio-botao);display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:0 var(--e5);font:var(--ui-botao);background:var(--cor-acao);color:var(--cor-sobre-acao);white-space:nowrap}
.btn .tecla{background:transparent;color:inherit;opacity:.75;padding:0}
.btn.sec{background:var(--cor-cartao-2);color:var(--cor-texto)}
.btn.sec .tecla{background:transparent;color:var(--cor-texto-2);opacity:1}
.btn.m{height:var(--alvo);border-radius:var(--raio-pilula)}
/* monograma: a cor da matéria vive só aqui */
.mono{display:grid;place-items:center;background:var(--cor-materia);color:var(--cor-tinta);font:var(--ui-sigla);flex:none}
.mono.g{width:48px;height:48px;font-size:14px;letter-spacing:.02em}
.mono.m{width:40px;height:40px}
.sig{display:inline-grid;place-items:center;height:26px;min-width:46px;padding:0 10px;border-radius:var(--raio-pilula);background:var(--cor-materia);color:var(--cor-tinta);font:var(--ui-sigla);flex:none}
.dot{width:10px;height:10px;border-radius:var(--raio-pilula);background:var(--cor-materia);flex:none}
.sel{background:var(--cor-escolhido)}
.vazio{border:2px dashed var(--cor-texto-2);background:transparent !important}
.stage[data-dir="a"] .vazio{box-shadow:none}
.scroll-fim{flex:1}

/* Hub */
.provas{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--vao-mosaico);height:184px;flex:none}
.prova{padding:var(--bloco-pad-y) var(--bloco-pad-x) 16px;display:flex;flex-direction:column;justify-content:space-between;border-radius:var(--raio-bloco);background:var(--cor-cartao);min-width:0}
.prova .topo{display:flex;align-items:center;justify-content:space-between;gap:8px}
.prova .quando{font:var(--ui-apoio);color:var(--cor-texto-2)}
.prova .n{font:var(--voz-numero);color:var(--cor-texto);display:flex;align-items:baseline;gap:8px}
.prova .n small{font:var(--ui-botao);color:var(--cor-texto-2)}
.prova .nome{margin-top:8px;font:var(--voz-titulo);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage[data-dir="a"] .prova.prox .n{color:var(--cor-cursor)}
.prova .prox-tag{display:none}
.stage[data-dir="b"] .prova.prox .prox-tag{display:inline-flex;background:var(--cor-acao);color:var(--cor-sobre-acao);height:22px;padding:0 10px;border-radius:var(--raio-pilula);font:var(--ui-tecla);align-items:center}
.prova .quando{white-space:nowrap}.prova .prox-tag{margin-left:auto;align-self:center}
.hub-baixo{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1.31fr 1fr;gap:var(--vao-mosaico)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:50px;row-gap:2px;margin-top:2px}
.cal .dw{font:var(--ui-rotulo);color:var(--cor-texto-2);display:grid;place-items:center;height:28px}
.cal .d{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 15px/18px var(--fonte-interface);color:var(--cor-texto)}
.cal .d.fora{color:var(--cor-texto-2);font-weight:500}
.cal .d.prv{font-weight:800}
.cal .d .dot{width:8px;height:8px}
.cal .d .dot.nada{background:transparent}
.cal .d.hoje span{width:44px;height:44px;border-radius:var(--raio-pilula);display:grid;place-items:center;background:var(--cor-acao);color:var(--cor-sobre-acao);font-weight:700}
.cal .d.hoje{gap:0}
.linhas{display:flex;flex-direction:column;gap:4px;min-height:0;overflow:hidden}
.aula{height:64px;border-radius:var(--raio-item);display:grid;grid-template-columns:100px 1fr auto;align-items:center;gap:8px;padding:0 12px 0 12px;flex:none}
.aula .h{font:var(--ui-apoio);color:var(--cor-texto-2)}
.aula .m{font:var(--voz-item);text-transform:uppercase;white-space:nowrap}
.aula .s{font:var(--ui-apoio);color:var(--cor-texto-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aula .dir{display:flex;gap:8px;align-items:center}
.agora{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:var(--raio-pilula);background:var(--cor-destaque);color:var(--cor-tinta);font:var(--ui-tecla);letter-spacing:.04em;text-transform:uppercase}
.lemb{display:flex;gap:12px;align-items:flex-start;padding:10px 0;font:var(--leitura-texto)}
.lemb .ck{width:28px;height:28px;border-radius:var(--raio-pilula);border:2px solid var(--cor-texto-2);flex:none;margin-top:-1px}

/* Mesa */
.mesa{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:418px 1fr;gap:var(--vao-mosaico)}
.mesa .anot{grid-row:1/3;grid-column:2}
.vazio-c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font:var(--ui-item);color:var(--cor-texto-2)}
.nota h3.t1{font:var(--nota-t1);color:var(--cor-nota-titulo);margin:4px 0 8px}
.nota h3.t2{font:var(--nota-t2);margin:12px 0 6px}
.nota p{font:var(--leitura-texto);margin-bottom:8px}
.nota ul{margin:0 0 8px;padding-left:22px;font:var(--leitura-texto)}
.nota li{margin-bottom:6px}
.mk{background:var(--cor-escolhido);font-style:italic;border-radius:6px;padding:0 4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.abas{display:inline-flex;gap:4px;background:var(--cor-cartao-2);border-radius:var(--raio-pilula);padding:4px;height:44px;margin-left:auto}
.abas span{display:inline-flex;align-items:center;padding:0 16px;border-radius:var(--raio-pilula);font:var(--ui-botao);color:var(--cor-texto-2)}
.abas span.on{background:var(--cor-cartao);color:var(--cor-texto)}
.cartoes-corpo{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.editor{background:var(--cor-cartao-2);border-radius:var(--raio-item);padding:12px 14px;font:var(--leitura-campo);white-space:pre-line;color:var(--cor-texto)}
.previa-vazia{font:var(--leitura-campo);color:var(--cor-texto-2);padding:12px 0}
.rodape-c{display:flex;align-items:center;gap:16px;margin-top:8px;flex:none}
.rodape-c .dica-c{flex:1;min-width:0;font:var(--leitura-compacta);color:var(--cor-texto-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Acervo */
.regua{display:flex;gap:8px;align-items:stretch;height:76px;flex:none}
.regua .faixa{flex:1;min-width:0;display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:var(--raio-bloco)}
.chip{height:56px;border-radius:var(--raio-item);padding:0 16px;display:flex;flex-direction:column;justify-content:center;background:var(--cor-cartao-2);color:var(--cor-texto);flex:none}
.chip b{font:var(--voz-mini)}
.chip small{font:var(--ui-apoio);font-size:12.5px;color:var(--cor-texto-2);line-height:16px}
.chip.on{background:var(--cor-acao);color:var(--cor-sobre-acao)}
.chip.on small{color:var(--cor-sobre-acao);opacity:.85}
.chip.novo{border:2px dashed var(--cor-texto-2);background:transparent;font:var(--ui-botao);color:var(--cor-texto-2);flex-direction:row;align-items:center;gap:6px}
.busca{width:380px;border-radius:var(--raio-bloco);display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:var(--cor-texto-2);font:var(--ui-item);flex:none}
.grade{flex:1;min-height:0;border:var(--borda-bloco) solid transparent;border-radius:var(--raio-bloco);padding:6px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;gap:var(--vao-mosaico)}
.grade.ativo{border-color:var(--cor-cursor)}
.mat{border-radius:var(--raio-bloco);background:var(--cor-cartao);padding:18px 20px 18px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;min-height:0;overflow:hidden}
.mat .topo{display:flex;justify-content:space-between;align-items:flex-start}
.mat .n{font:var(--voz-numero);display:flex;align-items:baseline;gap:8px;margin-top:auto}
.mat .n small{font:var(--ui-botao);color:var(--cor-texto-2)}
.mat .nome{font:var(--voz-titulo);text-transform:uppercase;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mat .ult{font:var(--ui-apoio);color:var(--cor-texto-2);margin-top:4px}

/* Treino */
.treino-chips{display:flex;gap:8px;padding:8px 10px;overflow:hidden;flex:none;border-radius:var(--raio-bloco)}
.treino-chips .chip{width:128px;flex:none;padding:0 14px}
.treino-chips .chip .l{display:flex;align-items:center;gap:8px}
.treino{flex:1;min-height:0;display:grid;grid-template-columns:1fr 420px;gap:var(--vao-mosaico)}
.lin{height:60px;display:flex;align-items:center;gap:14px;padding:0 14px;border-radius:var(--raio-item);flex:none}
.lin .t{font:var(--voz-mini);flex:1}
.lin .c{font:var(--ui-apoio);color:var(--cor-texto-2)}
.cx{width:28px;height:28px;border-radius:8px;border:2px solid var(--cor-texto-2);display:grid;place-items:center;flex:none}
.cx.on{background:var(--cor-acao);border-color:var(--cor-acao);color:var(--cor-sobre-acao)}
.cx svg.i{width:18px;height:18px;stroke-width:3}

/* Agenda */
.ag-barra{height:76px;flex:none;border-radius:var(--raio-bloco);display:flex;align-items:center;gap:8px;padding:0 10px}
.ag-barra .esp{flex:1}
.ag-corpo{flex:1;min-height:0;display:grid;grid-template-columns:1fr 340px;gap:var(--vao-mosaico)}
.semana{padding:12px 12px 8px 8px}
.sem-grade{flex:1;min-height:0;display:grid;grid-template-columns:44px repeat(7,1fr);column-gap:6px}
.sem-dia{display:flex;flex-direction:column;min-width:0}
.sem-dia .cabd{height:56px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font:var(--ui-rotulo);letter-spacing:.06em;color:var(--cor-texto-2);gap:2px}
.sem-dia .cabd b{font:var(--voz-mini);letter-spacing:0;color:var(--cor-texto);min-width:34px;height:26px;display:grid;place-items:center;border-radius:var(--raio-pilula)}
.sem-dia .cabd b.hj{background:var(--cor-acao);color:var(--cor-sobre-acao)}
.sem-col{position:relative;flex:1;background:var(--cor-cartao-2);border-radius:var(--raio-item)}
.horas{position:relative}
.horas span{position:absolute;right:4px;transform:translateY(-50%);font:var(--ui-rotulo);color:var(--cor-texto-2)}
.ev{position:absolute;left:4px;right:4px;border-radius:14px;background:var(--cor-cartao);padding:3px 8px;overflow:hidden;display:flex;flex-direction:column;gap:1px}
.ev .l1{display:flex;align-items:center;gap:6px;font:700 13px/22px var(--fonte-interface)}
.ev .l2{font:var(--ui-apoio);color:var(--cor-texto-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;line-height:16px}
.ev .sig{height:22px;min-width:0;padding:0 8px;font-size:12px}
.ev.sel{background:var(--cor-escolhido)}
.ev.sel .l2{color:var(--cor-texto)}
.ag-dir{display:flex;flex-direction:column;gap:var(--vao-mosaico);min-height:0}
.prev h2{font:800 28px/32px var(--fonte-voz);margin:10px 0 6px}
.prev .meta{font:var(--ui-apoio);color:var(--cor-texto-2);line-height:22px}
.prev .btn{margin-top:auto;align-self:flex-start}
.fil{display:flex;flex-wrap:wrap;gap:8px}
.fil .pil{height:44px;padding:0 14px;background:var(--cor-cartao-2);color:var(--cor-texto)}
.fil .pil.on{background:var(--cor-acao);color:var(--cor-sobre-acao)}
.compl{display:flex;align-items:center;gap:10px;height:56px;padding:0 4px;font:var(--ui-botao)}
.compl .f{margin-left:auto;font:var(--ui-apoio);color:var(--cor-texto-2)}

/* Faltas */
.falt{flex:1;min-height:0;display:grid;grid-template-columns:292px 1fr 340px;gap:var(--vao-mosaico)}
.fm{height:56px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:var(--raio-item);flex:none}
.fm .s{font:var(--ui-sigla);width:34px;color:var(--cor-texto)}

function barra(at,titulo,opts){
  opts=opts||{};

  return `<div class="barra">${nums}<h1 class="tit">${titulo}</h1>${opts.meio||''}<div class="fim">${opts.antes||''}${voltar}<span class="pil">Faltas</span><span class="pil">Notas</span><span class="pil redondo" aria-label="Ajuda">?</span></div></div>`;
}


T.hub = ()=>{
  const prov=[['GEN','7','14 nov, 08:00'],['IMU','11','18 nov, 10:00'],['PRO','14','21 nov, 13:00'],['APS','20','27 nov, 08:00'],['FAR','25','02 dez, 14:00']];
  const cards=prov.map((p,i)=>`<div class="prova peca ${i===0?'prox':''}" data-materia="${MAT[p[0]].m}">
    <div class="topo">${mono(p[0])}<span class="quando">${p[2]}</span></div>
    <div><div class="n">${p[1]}<small>dias</small>${i===0?'<span class="prox-tag">Próxima</span>':''}</div><div class="nome">${MAT[p[0]].n}</div></div></div>`).join('');
  const dias=[];const pf={14:'GEN',18:'IMU',21:'PRO',27:'APS'};
  const grid=[...Array(30)].map((_,i)=>i+1);
  let cal='';['D','S','T','Q','Q','S','S'].forEach(x=>cal+=`<span class="dw">${x}</span>`);
  grid.forEach(d=>{
    if(d===7){cal+=`<span class="d hoje"><span>7</span></span>`;return}
    cal+=`<span class="d ${pf[d]?'prv':''}">${d}${pf[d]?dot(pf[d]).replace('class="dot"','class="dot"'):''}</span>`;
  });
  cal+=`<span class="d fora">1</span><span class="d fora prv" style="color:var(--cor-texto)">2${dot('FAR')}</span><span class="d fora">3</span><span class="d fora">4</span><span class="d fora">5</span>`;
  // corrige: dots com data-materia
  const ag=[['08:00–09:30','GEN','Expressão gênica'],['10:00–11:00','APS','Territorialização'],['13:00–15:00','IMU','Resposta inflamatória aguda',1],['15:10–17:00','PRO','Exame do abdome']];
  const aulas=ag.map(a=>`<div class="aula ${a[3]?'sel anel-i':''}" data-materia="${MAT[a[1]].m}">
    <span class="h">${a[0]}</span><div><div class="m">${MAT[a[1]].n}</div><div class="s">${a[2]}</div></div>
    <span class="dir">${a[3]?'<span class="agora">Agora</span>':''}${sig(a[1])}</span></div>`).join('');
  const lembs=['Levar o jaleco para a Propedêutica.','Revisar IL-6 e TNF-α antes da prova de Imunologia.','Confirmar a sala do laboratório de Genética.'].map(t=>`<div class="lemb"><span class="ck"></span><span>${t}</span></div>`).join('');
  return `<div class="tela">${barra(1,'Sábado, 7 de novembro')}
  <div class="provas">${cards}</div>
  <div class="hub-baixo">
    <div class="bloco peca"><div class="cab-b"><span class="rot">Novembro<b>2026</b></span>${dots}</div><div class="cal">${cal}</div></div>
    <div class="bloco peca ativo"><div class="cab-b"><span class="rot">Agenda de hoje</span>${tec('Enter abre')}${dots}</div><div class="linhas">${aulas}</div></div>
    <div class="bloco peca"><div class="cab-b"><span class="rot">Lembretes</span>${tec('Alt I')}${dots}</div><div class="linhas" style="flex:1">${lembs}</div><span class="btn" style="width:100%">Novo lembrete</span></div>
  </div></div>`;
};

T.agenda = ()=>{
  const H=48, T0=7;

MAT.MIC={n:'Microbiologia',m:7};MAT.PSI={n:'Psicologia',m:6};
const NT={tab:'disc',sel:'PRO',lock:false,meta:7,v:{}};
const MX=[3,7,3,7];
const AVS=[['Prova teórica',4],['Prova prática',2],['Seminário',1]];
const ND=[
 {s:'GEN',b:[2.5,5.4,2.3],a:[null,null,null]},
 {s:'IMU',b:[2.0,4.6,1.9],a:[null,null,null]},
 {s:'PRO',b:[2.4,4.9,1.8],a:[3.2,null,null]},
 {s:'APS',b:[2.3,5.69,1.92],a:[null,null,null]},
 {s:'MIC',b:[2.4,5.6,2.4],a:[3.6,null,null]},
 {s:'PSI',b:[null,null,null],a:[null,null,null]}];
const fm=n=>n==null?'—':(Math.round(n*100+1e-9)/100).toFixed(2).replace(/0$/,'').replace('.',',');
const fm1=n=>n==null?'—':(Math.round(n*10+1e-9)/10).toFixed(1).replace('.',',');
const av=(d,i)=>{const k=d.s+':'+i;return k in NT.v?NT.v[k]:d.a[i]};
function nc(d){
  const M=NT.meta,b=d.b.slice(),L=AVS.map((_,i)=>av(d,i));
  const parcial=L.reduce((x,n)=>x+(n||0),0),nL=L.filter(n=>n!=null).length;
  b[3]=nL===AVS.length?parcial:null;
  const S1=b[0]!=null&&b[1]!=null?b[0]+b[1]:null, S2=b[2]!=null&&b[3]!=null?b[2]+b[3]:null;
  const ano=S1!=null&&S2!=null?(S1+S2)/2:null;
  const proj=(i,j)=>{let o=0,m=0;[i,j].forEach(k=>{if(b[k]!=null){o+=b[k];m+=MX[k]}});return m?o/m*10:null};
  const ps=[proj(0,1),proj(2,3)].filter(x=>x!=null);
  const media=ps.length?ps.reduce((x,y)=>x+y,0)/ps.length:null;
  const r={b,L,S1,S2,ano,media,parcial,nL,M,st:'sem'};
  const tem=b.some(x=>x!=null)||nL>0;
  if(!tem)return r;
  if(ano!=null){r.st=ano>=M?'fech':'abaixo';return r}
  if(b[3]==null&&b[2]!=null){
    r.n2=Math.round((M-b[2])*100)/100;
    if(S1!=null)r.nA=Math.round((2*M-S1-b[2])*100)/100;
  }
  const n=r.nA;
  if(n==null)r.st='ritmo';else if(n<=0)r.st='ok';else if(n>MX[3])r.st='fora';else r.st=n/MX[3]>=0.6?'atencao':'ritmo';
  return r;
}

const cel=(l,sb,v,cls)=>`<div class="c ${cls||''}"><span class="l">${l}</span><span class="sb">${sb}</span><b class="vl">${v}</b></div>`;

   <div class="g"><span class="rot">2º semestre</span><div class="row">${cel('3º bim','de 3',fm(b[2]),b[2]==null?'nada':'')}${cel('4º bim','de 7',b[3]!=null?fm(b[3]):'—',b[3]!=null?'':'aberto')}${cel('Total','de 10',fm(c.S2),'tot'+(c.S2==null?' nada':''))}</div></div>

  const linhas=AVS.map((x,i)=>{const n=c.L[i];return `<div class="tab-r nb-t"><span class="n">${x[0]}</span><span class="c r">${fm(x[1])}</span><span class="r"><input class="inp ${n==null?'pend':''}" data-ni="${d.s}:${i}" data-max="${x[1]}" inputmode="decimal" value="${n==null?'':fm(n)}" placeholder="lançar" aria-label="Nota de ${x[0]}"></span></div>`}).join('');
  const f4=c.b[3]!=null;

      const NOMES = [['mesa','Mesa'],['treino','Treino'],['notas','Notas']];
      function build() {
        const telas = st.tela === 'todas' ? NOMES.map((n) => n[0]) : [st.tela];
        document.getElementById('palcos').innerHTML = telas
          .map((t) => `<div class="cena"><div class="stage" data-dir="${st.dir}" data-tema="${st.tema}">${T[t]()}</div></div>`)
          .join('');
        document.documentElement.dataset.tema = st.tema;
        fit();
        const bl = document.getElementById('bl');
        const mk = (k, v, r) => `<button data-k="${k}" data-v="${v}" aria-pressed="${st[k] === v}">${r}</button>`;
        bl.innerHTML = mk('dir','a','Papel Frio') + mk('dir','b','Ardósia') + ' | ' + mk('tema','claro','Claro') + mk('tema','escuro','Escuro') + ' | ' + NOMES.map((n) => mk('tela', n[0], n[1])).join('');
      }
      function fit() {
        document.querySelectorAll('.cena').forEach((c) => {
          const s = c.clientWidth / 1280;
          c.firstElementChild.style.transform = `scale(${s})`;
          c.style.height = 800 * s + 'px';
        });
      }
      document.getElementById('bl').addEventListener('click', (e) => {
        const b = e.target.closest('button');
        if (!b) return;
        st[b.dataset.k] = b.dataset.v;
        build();
      });
      addEventListener('resize', fit);
      new MutationObserver(() => {
        const t = document.documentElement.dataset.tema;
        if (t && t !== st.tema) {
          st.tema = t;
          build();
        }
      }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-tema'] });
      build();
    </script>
