<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agenda na identidade Giz A</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Nunito:wght@700;800&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="giz-a.css" />
    <style>
      /* Agenda: semana. Foco: ?foco=aula|grade|previa|nenhum */
      .btn {
        height: 44px;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 0 20px;
        background: var(--acao);
        color: var(--sobre-acao);
        font: 700 14px/20px var(--ui);
        white-space: nowrap;
      }
      .btn .k {
        font-weight: 600;
        opacity: 0.7;
      }
      .regua {
        display: flex;
        flex-direction: row;
        gap: 8px;
        align-items: center;
        height: 68px;
        flex: none;
        padding: 0 12px;
      }
      .chip {
        height: 44px;
        border-radius: 999px;
        padding: 0 18px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--cartao2);
        color: var(--texto);
        font: 600 14px/20px var(--ui);
        flex: none;
      }
      .chip small {
        color: var(--texto2);
        font: 500 12.5px/16px var(--ui);
      }
      .chip.on {
        background: var(--texto);
        color: var(--fundo);
      }
      .chip.on small {
        color: inherit;
        opacity: 0.75;
      }
      .sp {
        flex: 1;
      }
      .intervalo {
        font: 800 17px/20px var(--voz);
        margin: 0 6px;
      }
      .corpo {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 1fr 340px;
        gap: 8px;
      }
      .grade {
        padding: 10px 12px 8px 8px;
        display: grid;
        grid-template-columns: 40px repeat(7, 1fr);
        column-gap: 6px;
      }
      .eixo {
        position: relative;
        margin-top: 60px;
      }
      .eixo span {
        position: absolute;
        right: 2px;
        transform: translateY(-50%);
        font: 600 12px/16px var(--ui);
        color: var(--texto2);
      }
      .col {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .dh {
        height: 56px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        font: 700 12px/16px var(--ui);
        letter-spacing: 0.06em;
        color: var(--texto2);
      }
      .dh b {
        font: 800 17px/22px var(--voz);
        letter-spacing: 0;
        color: var(--texto);
        min-width: 36px;
        height: 28px;
        display: grid;
        place-items: center;
        border-radius: 999px;
      }
      .dh.hoje b {
        background: var(--texto);
        color: var(--fundo);
      }
      .lane {
        position: relative;
        flex: 1;
        background: var(--cartao2);
        border-radius: 10px;
      }
      .ev {
        position: absolute;
        left: 3px;
        right: 3px;
        border-radius: 8px;
        background: var(--cartao);
        padding: 4px 7px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 2px;
        border: 1px solid var(--linha);
      }
      .ev .l1 {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .ev .tag {
        font-size: 11.5px;
        line-height: 16px;
        padding: 0 6px;
      }
      .ev .h {
        font: 600 11.5px/16px var(--ui);
        color: var(--texto2);
      }
      .ev .s {
        font: 600 12.5px/16px var(--ui);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .ev.agora {
        background: var(--tinta);
        color: var(--sobre-tinta);
        border-color: var(--tinta);
      }
      .ev.agora .h {
        color: #bdbdbd;
      }
      .ev.foco {
        box-shadow: inset 0 0 0 3px var(--foco);
      }
      .linha-agora {
        position: absolute;
        left: 0;
        right: 0;
        height: 3px;
        border-radius: 999px;
        background: var(--acao);
        z-index: 2;
      }
      .grade.foco-bloco {
        box-shadow: inset 0 0 0 4px var(--foco);
      }
      .lat {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-height: 0;
      }
      .previa {
        padding: 16px;
      }
      .previa.foco-bloco {
        box-shadow: inset 0 0 0 4px var(--foco);
      }
      .previa h2 {
        font: 800 22px/26px var(--voz);
        margin: 8px 0 2px;
      }
      .apoio {
        font: 400 15.5px/22px var(--leitura);
        color: var(--texto2);
      }
      .cm {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .cm .chip {
        height: 32px;
        padding: 0 12px;
        font-size: 13px;
      }
      .compl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 10px;
        align-items: center;
        padding: 8px 10px;
        border-radius: 10px;
        background: var(--cartao2);
        margin-bottom: 4px;
      }
      .compl .t {
        font: 700 14px/20px var(--ui);
      }
      .compl .d {
        grid-column: 2;
        font: 500 12.5px/16px var(--ui);
        color: var(--texto2);
      }
    </style>
  <link rel="stylesheet" href="giz-a-suave.css">
</head>
  <body>
    <div class="stage" id="s"></div>
    <script>
      const P = new URLSearchParams(location.search);
      const foco = P.get('foco') ?? 'aula';
      if (!document.documentElement.dataset.tema)
        document.documentElement.dataset.tema = P.get('tema') ?? 'claro';
      const tag = (k) => `<span class="tag m-${k}">${k}</span>`;
      const barra = (at, t) =>
        `<div class="barra">${[1, 2, 3, 4, 5, 6].map((n) => `<span class="num ${n === at ? 'at' : ''}">${n}</span>`).join('')}<h1>${t}</h1><div class="fim"><span class="pil">Faltas</span><span class="pil">Notas</span><span class="pil" style="padding:0;width:44px;justify-content:center">?</span></div></div>`;
      const util = [
        [8, 1.5, 'FAR', 'Teoria', '08:00'],
        [10.25, 1.5, 'FIS', 'Teoria', '10:15'],
        [14, 2, 'PAT', 'Prática', '14:00'],
      ];
      const dom = [
        [8, 1.5, 'GEN', 'Expressão gênica', '08:00'],
        [10, 1, 'APS', 'Territorialização', '10:00'],
        [13, 2, 'IMU', 'Resposta inflamatória', '13:00', 1],
        [15 + 1 / 6, 1 + 5 / 6, 'PRO', 'Exame do abdome', '15:10'],
      ];
      const DIAS = [
        ['SEG', 2],
        ['TER', 3],
        ['QUA', 4],
        ['QUI', 5],
        ['SEX', 6],
        ['SÁB', 7],
        ['DOM', 8],
      ];
      const AGORA = 13 + 35 / 60,
        H0 = 8,
        N = 11;
      const ev = (a) =>
        `<div class="ev ${a[5] ? 'agora' : ''} ${a[5] && foco === 'aula' ? 'foco' : ''}" style="top:calc(100%/${N}*${a[0] - H0});height:calc(100%/${N}*${a[1]} - 2px)"><div class="l1">${tag(a[2])}</div><span class="h">${a[4]}</span><span class="s">${a[3]}</span></div>`;
      const eixo = Array.from(
        { length: N + 1 },
        (_, i) => `<span style="top:calc(100%/${N}*${i})">${H0 + i}h</span>`,
      ).join('');
      const cols = DIAS.map((d, i) => {
        const l = i === 6 ? dom : i === 5 ? [] : util,
          h = i === 6;
        return `<div class="col"><div class="dh ${h ? 'hoje' : ''}"><span>${d[0]}</span><b>${d[1]}</b></div><div class="lane">${l.map(ev).join('')}${h ? `<i class="linha-agora" style="top:calc(100%/${N}*${AGORA - H0})"></i>` : ''}</div></div>`;
      }).join('');
      const mats = ['PRO', 'GEN', 'IMU', 'APS', 'FAR', 'FIS', 'PAT', 'BIO']
        .map((k) => `<span class="chip">${tag(k)}</span>`)
        .join('');
      document.getElementById('s').innerHTML = `${barra(5, 'Agenda')}
<div class="regua peca"><span class="chip on">Semana <small>dias e horas</small></span><span class="chip">Mês <small>novembro</small></span><span class="chip">Lista <small>21 dias</small></span><span class="chip">Grade <small>horário fixo</small></span>
 <span class="sp"></span><span class="chip" style="width:44px;padding:0;justify-content:center">‹</span><span class="chip">Hoje</span><span class="chip" style="width:44px;padding:0;justify-content:center">›</span><span class="intervalo">02 nov – 08 nov</span><span class="btn">+ Novo <span class="k">Alt N</span></span></div>
<div class="corpo"><div class="peca grade ${foco === 'grade' ? 'foco-bloco' : ''}"><div class="eixo">${eixo}</div>${cols}</div>
 <div class="lat">
  <div class="peca previa ${foco === 'previa' ? 'foco-bloco' : ''}"><div class="cab">${tag('IMU')}<span class="rot" style="margin-left:6px">Aula</span></div><h2>Imunologia</h2><p class="apoio">domingo, 8 de novembro · 13:00 – 15:00</p><p class="apoio">Resposta inflamatória aguda</p>
   <span class="btn" style="margin-top:14px;justify-content:center">Abrir na Mesa <span class="k">Enter</span></span></div>
  <div class="peca"><div class="cab"><span class="rot">Matérias</span></div><div class="cm"><span class="chip on">Todas</span>${mats}</div></div>
  <div class="peca" style="flex:1"><div class="cab"><span class="rot">A completar<b>2</b></span></div>
   <div class="compl">${tag('FAR')}<span class="t">Prova</span><span class="d">falta data e hora</span></div>
   <div class="compl">${tag('GEN')}<span class="t">Prova</span><span class="d">falta data e hora</span></div></div>
 </div></div>`;
    </script>
  </body>
</html>
