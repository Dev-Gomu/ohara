<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acervo 4: lista de aulas</title>
    <style>
      .bloco { width: 460px; padding: var(--e3); border-radius: var(--raio-bloco); background: var(--cor-cartao); display: flex; flex-direction: column; gap: var(--e1); }
      .titulo { padding: 0 var(--e2) var(--e2); color: var(--cor-texto-2); font: var(--ui-rotulo); letter-spacing: .06em; text-transform: uppercase; }
      .aula { display: grid; grid-template-columns: 1fr auto; align-items: center; min-height: var(--item-lista); padding: 6px var(--e3); border-radius: var(--raio-item); font: var(--ui-item); }
      .aula small { grid-column: 1; color: var(--cor-texto-2); font: var(--ui-apoio); }
      .aula .c { grid-row: 1 / 3; grid-column: 2; font: var(--ui-apoio); color: var(--cor-texto-2); }
      .foco { outline: 4px solid var(--cor-contorno-foco); outline-offset: -4px; }
      /* Hoje: selecionada com fundo azul forte */
      .v-atual .sel { background: var(--cor-marca); }
      /* A: seleção suave (fundo marca) e foco por contorno, sem fundo forte */
      .v-a .sel { background: color-mix(in srgb, var(--cor-marca) 55%, var(--cor-cartao)); }
      /* B: selecionada = bolinha da cor da matéria à esquerda + título forte; sem fundo */
      .v-b .aula { grid-template-columns: 14px 1fr auto; column-gap: var(--e3); }
      .v-b .aula::before { content: ''; grid-row: 1 / 3; width: 8px; height: 8px; border-radius: 50%; background: transparent; }
      .v-b .sel::before { background: var(--cor-bloco-ativo); }
      .v-b .aula small { grid-column: 2; }
      .v-b .aula .c { grid-column: 3; }
      .v-b .sel { font-weight: 700; }
      /* C: A + foco por fundo do cartão (sobe) */
      .v-c .sel { background: var(--cor-marca); }
      .v-c .foco { outline: 2px solid var(--cor-contorno-foco); outline-offset: -2px; background: var(--cor-cartao); }
      .v-c .foco.sel { background: var(--cor-marca); }
      .par { display: flex; gap: var(--e5); flex-wrap: wrap; }
      .legenda { color: var(--cor-texto-2); font: var(--ui-apoio); margin-bottom: var(--e2); }
    </style>
  </head>
  <body>
    <script type="module">
      import { Sala } from './_sala.js';
      const lista = (itens) => `<div class="bloco"><div class="titulo">Aulas · 4</div>${itens.map(([t, d, c, cls]) =>
        `<div class="aula ${cls}"><span>${t}</span><span class="c">${c} cartões</span><small>${d}</small></div>`).join('')}</div>`;
      const A = [['Mutações e reparo do DNA', '27 out · 2º bimestre', 0, 'sel'], ['Expressão gênica', '08 nov · 2º bimestre', 9, ''], ['Herança mendeliana', '02 nov · 1º bimestre', 4, ''], ['Citogenética', '18 out · 1º bimestre', 2, '']];
      const B = [['Mutações e reparo do DNA', '27 out · 2º bimestre', 0, ''], ['Expressão gênica', '08 nov · 2º bimestre', 9, 'foco'], ['Herança mendeliana', '02 nov · 1º bimestre', 4, ''], ['Citogenética', '18 out · 1º bimestre', 2, '']];
      const C = [['Mutações e reparo do DNA', '27 out · 2º bimestre', 0, 'sel foco'], ['Expressão gênica', '08 nov · 2º bimestre', 9, ''], ['Herança mendeliana', '02 nov · 1º bimestre', 4, ''], ['Citogenética', '18 out · 1º bimestre', 2, '']];
      const v = (id, nome) => ({ id, nome, html: () => `<div class="v-${id}"><div class="par">
        <div><div class="legenda">Selecionada, sem foco</div>${lista(A)}</div>
        <div><div class="legenda">Só foco (outra aula)</div>${lista(B)}</div>
        <div><div class="legenda">Selecionada e em foco</div>${lista(C)}</div></div></div>` });
      Sala.montar({
        titulo: 'Acervo 4: seleção e foco na lista de aulas',
        dados: {},
        variantes: [v('atual', 'Hoje (fundo forte)'), v('a', 'A. Seleção suave + contorno 4px'), v('b', 'B. Seleção por bolinha e título forte'), v('c', 'C. Seleção suave + foco fino 2px')],
      });
    </script>
  </body>
</html>
