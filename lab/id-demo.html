<!doctype html>
<html lang="pt-BR" data-paleta="c" data-tema="claro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Identidade: a luz segue o teclado</title>
    <style>
      /* Demo de docs/plano/identidade-reformulacao.md. Só tokens do app; os três de baixo são os novos. */
      :root {
        --sup-recuada: color-mix(in srgb, var(--cor-cartao) 50%, var(--cor-fundo));
        --sup-tecla: color-mix(in srgb, var(--cor-texto) 9%, transparent);
        --cor-rastro: color-mix(in srgb, var(--cor-cursor) 32%, var(--cor-cartao));
      }
      body {
        margin: 0;
        background: var(--cor-fundo);
      }
      .tela {
        width: 1280px;
        height: 800px;
        box-sizing: border-box;
        padding: var(--margem-tela);
        display: grid;
        grid-template: var(--barra-topo) auto 1fr / 400px 1fr;
        gap: var(--vao-mosaico);
        color: var(--cor-texto);
        font: var(--ui-apoio);
        font-variant-numeric: tabular-nums;
        user-select: none;
      }
      .tecla {
        font: var(--ui-tecla);
        color: var(--cor-texto-2);
        background: var(--sup-tecla);
        border-radius: var(--raio-minimo);
        padding: 1px 7px;
        white-space: nowrap;
      }
      .cursor {
        box-shadow: inset 0 0 0 2px var(--cor-cursor);
      }

      /* Barra em ilhas */
      .barra {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: var(--e3);
      }
      .ilha {
        height: 44px;
        display: flex;
        align-items: center;
        gap: var(--e1);
        padding: 0 6px;
        background: var(--sup-recuada);
        border-radius: var(--raio-pilula);
      }
      .aba {
        min-width: 40px;
        height: 32px;
        padding: 0 12px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--e2);
        border-radius: var(--raio-pilula);
        font: var(--ui-botao);
        color: var(--cor-texto-2);
      }
      .aba.sel {
        background: var(--cor-escolhido);
        color: var(--cor-texto);
      }
      .contexto {
        display: flex;
        align-items: center;
        gap: var(--e3);
        flex: 1;
        min-width: 0;
      }
      .contexto h1 {
        margin: 0;
        font: var(--voz-titulo);
      }
      .m2 {
        font: var(--ui-sigla);
        color: var(--cor-tinta);
        background: var(--cor-materia-4);
        border-radius: var(--raio-pilula);
        padding: 3px 10px;
        letter-spacing: 0.04em;
      }
      .modulo {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 10px;
        font: var(--ui-item);
        color: var(--cor-texto-2);
      }
      .nivel {
        gap: var(--e2);
        padding: 0 14px;
        color: var(--cor-texto-2);
      }
      .nivel b {
        font: var(--ui-rotulo);
        letter-spacing: 0.06em;
        color: var(--cor-texto);
        min-width: 52px;
      }

      /* Blocos */
      .bloco {
        background: var(--sup-recuada);
        border-radius: var(--raio-bloco);
        padding: var(--bloco-pad-y) var(--bloco-pad-x);
        display: flex;
        flex-direction: column;
        gap: var(--e3);
        min-height: 0;
        transition:
          background var(--tempo-borda),
          box-shadow var(--tempo-borda);
      }
      .bloco.ativo {
        background: var(--cor-cartao);
        box-shadow: inset 0 0 0 2px var(--cor-rastro);
      }
      .bloco.ativo.cursor {
        box-shadow: inset 0 0 0 3px var(--cor-cursor);
      }
      .rotulo {
        display: flex;
        align-items: center;
        gap: var(--e2);
        font: var(--ui-rotulo);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--cor-texto-2);
      }
      .bloco.ativo .rotulo {
        color: var(--cor-cursor);
      }
      .rotulo .tecla {
        margin-left: auto;
        text-transform: none;
        letter-spacing: 0;
      }

      /* Régua */
      .regua {
        grid-column: 1 / -1;
        flex-direction: row;
        align-items: center;
        gap: var(--e1);
        padding: 10px 12px;
      }
      .pasta {
        height: var(--alvo);
        padding: 0 18px;
        display: flex;
        align-items: center;
        gap: var(--e2);
        border-radius: var(--raio-pilula);
        font: var(--ui-item);
        color: var(--cor-texto-2);
      }
      .pasta.sel {
        background: var(--cor-escolhido);
        color: var(--cor-texto);
        font-weight: 700;
      }
      .regua .tecla {
        margin-left: auto;
        margin-right: 6px;
      }

      /* Lista */
      .lista {
        display: flex;
        flex-direction: column;
        gap: var(--e1);
        margin: 0 -8px;
      }
      .aula {
        min-height: var(--item-lista);
        box-sizing: border-box;
        padding: 8px 14px;
        border-radius: var(--raio-item);
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        column-gap: var(--e3);
      }
      .aula.sel {
        background: var(--cor-escolhido);
      }
      .aula strong {
        font: var(--voz-mini);
      }
      .aula small {
        grid-column: 1;
        font: var(--ui-apoio);
        color: var(--cor-texto-2);
      }
      .aula span {
        grid-row: 1 / span 2;
        grid-column: 2;
        font: var(--ui-apoio);
        color: var(--cor-texto-2);
      }

      /* Prévia */
      .capa {
        flex: 1;
        min-height: 0;
        border-radius: var(--raio-item);
        background: var(--sup-tecla);
        display: grid;
        place-items: center;
        color: var(--cor-texto-2);
        position: relative;
      }
      .capa .m2 {
        position: absolute;
        top: 14px;
        left: 14px;
      }
      .previa h2 {
        margin: 0;
        font: var(--voz-titulo);
      }
      .previa p {
        margin: -6px 0 0;
        color: var(--cor-texto-2);
      }
      .principal {
        height: 48px;
        border-radius: var(--raio-botao);
        background: var(--cor-acao);
        color: var(--cor-sobre-acao);
        font: var(--ui-botao);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--e3);
      }
      .principal .tecla {
        color: inherit;
        background: color-mix(in srgb, var(--cor-sobre-acao) 16%, transparent);
      }
      .principal.cursor {
        box-shadow:
          inset 0 0 0 2px var(--cor-cursor),
          inset 0 0 0 4px var(--cor-cartao);
      }
    </style>
  </head>
  <body>
    <div class="tela">
      <header class="barra">
        <nav class="ilha" id="abas"></nav>
        <div class="contexto">
          <h1>Genética</h1>
          <span class="m2">GEN</span>
        </div>
        <div class="ilha nivel" id="nivel"></div>
        <div class="ilha">
          <span class="modulo">Cartões <span class="tecla">Alt C</span></span>
          <span class="modulo">Faltas</span>
          <span class="modulo">Notas</span>
          <span class="modulo">?</span>
        </div>
      </header>

      <section class="bloco regua" data-bloco="regua"></section>

      <section class="bloco" data-bloco="aulas">
        <div class="rotulo">Aulas · 4 <span class="tecla">Alt N nova</span></div>
        <div class="lista" id="lista"></div>
      </section>

      <section class="bloco previa" data-bloco="previa">
        <div class="rotulo">Prévia</div>
        <div class="capa">
          <span class="m2">GEN</span>
          <svg
            width="40"
            height="40"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="4" width="18" height="12" rx="2.5" />
            <path d="M9 20h6M12 16v4" />
          </svg>
        </div>
        <h2 id="titulo"></h2>
        <p id="dados"></p>
        <div class="principal" id="abrir">Abrir na Mesa <span class="tecla">Enter</span></div>
      </section>
    </div>

    <script type="module">
      import '../src/ui/styles/fonts.css';
      import '../src/ui/styles/tokens.css';
      import '../src/ui/styles/paletas.css';

      const TELAS = ['Hub', 'Mesa', 'Acervo', 'Treino', 'Agenda', 'Configs'];
      const PASTAS = ['Todas', '1º bimestre', '2º bimestre', '3º bimestre', 'Sem bimestre'];
      const AULAS = [
        ['Mutações e reparo do DNA', '28 out', 'sem cartões'],
        ['Expressão gênica', '09 nov', '9 cartões'],
        ['Regulação da transcrição', '12 nov', '4 cartões'],
        ['Herança mitocondrial', '16 nov', 'sem cartões'],
      ];
      const DICAS = {
        menu: ['Menu', '↓ desce'],
        bloco: ['Bloco', 'Enter entra', 'Esc sobe'],
        campo: ['Campo', 'setas andam', 'Esc sobe'],
      };
      // Vizinhos declarados pela tela (diretrizes 4.1).
      const VIZINHOS = {
        regua: { ArrowDown: 'aulas' },
        aulas: { ArrowUp: 'regua', ArrowRight: 'previa' },
        previa: { ArrowLeft: 'aulas', ArrowUp: 'regua' },
      };
      const url = new URLSearchParams(location.search);
      const estado = {
        nivel: url.get('n') ?? 'bloco',
        bloco: url.get('b') ?? 'aulas',
        pasta: 2,
        aula: 1,
      };
      const pega = (seletor) => document.querySelector(seletor);

      function desenhar() {
        const { nivel, bloco, pasta, aula } = estado;
        const noCampo = (id) => nivel === 'campo' && bloco === id;
        pega('#abas').innerHTML = TELAS.map((nome, i) =>
          i === 2
            ? `<span class="aba sel ${nivel === 'menu' ? 'cursor' : ''}">3 <span>${nome}</span></span>`
            : `<span class="aba">${i + 1}</span>`,
        ).join('');
        const [nome, ...teclas] = DICAS[nivel];
        pega('#nivel').innerHTML =
          `<b>${nome.toUpperCase()}</b>${teclas.map((t) => `<span class="tecla">${t}</span>`).join('')}`;
        pega('[data-bloco=regua]').innerHTML =
          PASTAS.map(
            (p, i) =>
              `<span class="pasta ${i === pasta ? 'sel' : ''} ${noCampo('regua') && i === pasta ? 'cursor' : ''}" data-pasta="${i}">${p}</span>`,
          ).join('') +
          `<span class="pasta">+ Nova pasta</span><span class="tecla">Alt F busca</span>`;
        pega('#lista').innerHTML = AULAS.map(
          ([t, dia, cartoes], i) =>
            `<div class="aula ${i === aula ? 'sel' : ''} ${noCampo('aulas') && i === aula ? 'cursor' : ''}" data-aula="${i}"><strong>${t}</strong><small>${dia} · ${PASTAS[pasta === 0 ? 2 : pasta]}</small><span>${cartoes}</span></div>`,
        ).join('');
        pega('#titulo').textContent = AULAS[aula][0];
        pega('#dados').textContent = `${AULAS[aula][1]} · ${AULAS[aula][2]}`;
        pega('#abrir').classList.toggle('cursor', noCampo('previa'));
        for (const el of document.querySelectorAll('[data-bloco]')) {
          const aqui = nivel !== 'menu' && el.dataset.bloco === bloco;
          el.classList.toggle('ativo', aqui);
          el.classList.toggle('cursor', aqui && nivel === 'bloco');
        }
      }

      function andar(tecla) {
        const { nivel, bloco } = estado;
        if (
          nivel === 'campo' &&
          bloco === 'regua' &&
          (tecla === 'ArrowLeft' || tecla === 'ArrowRight')
        ) {
          estado.pasta = Math.max(
            0,
            Math.min(PASTAS.length - 1, estado.pasta + (tecla === 'ArrowRight' ? 1 : -1)),
          );
          return;
        }
        if (
          nivel === 'campo' &&
          bloco === 'aulas' &&
          (tecla === 'ArrowUp' || tecla === 'ArrowDown')
        ) {
          const novo = estado.aula + (tecla === 'ArrowDown' ? 1 : -1);
          if (novo >= 0) {
            estado.aula = Math.min(AULAS.length - 1, novo);
            return;
          }
        }
        estado.bloco = VIZINHOS[bloco][tecla] ?? bloco;
      }

      document.addEventListener('keydown', (e) => {
        if (e.key === 't' || e.key === 'T') {
          const raiz = document.documentElement;
          raiz.dataset.tema = raiz.dataset.tema === 'escuro' ? 'claro' : 'escuro';
          return;
        }
        if (e.key === 'Escape') estado.nivel = estado.nivel === 'campo' ? 'bloco' : 'menu';
        else if (estado.nivel === 'menu' && (e.key === 'ArrowDown' || e.key === 'Enter'))
          estado.nivel = 'bloco';
        else if (e.key === 'Enter' && estado.nivel === 'bloco') estado.nivel = 'campo';
        else if (e.key.startsWith('Arrow') && estado.nivel !== 'menu') andar(e.key);
        else return;
        e.preventDefault();
        desenhar();
      });

      document.addEventListener('click', (e) => {
        const bloco = e.target.closest('[data-bloco]');
        if (!bloco) return;
        estado.bloco = bloco.dataset.bloco;
        const item = e.target.closest('[data-pasta],[data-aula]');
        estado.nivel = item || estado.bloco === 'previa' ? 'campo' : 'bloco';
        if (item?.dataset.pasta) estado.pasta = Number(item.dataset.pasta);
        if (item?.dataset.aula) estado.aula = Number(item.dataset.aula);
        desenhar();
      });

      desenhar();
    </script>
  </body>
</html>
