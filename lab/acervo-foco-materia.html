<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acervo: foco do cartão de matéria</title>
    <style>
      /* Cartão como no app: cor cheia no claro, cor mais funda e texto claro no escuro */
      .grade {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-auto-rows: 200px;
        gap: var(--vao-mosaico);
        padding: 8px;
      }
      .materia {
        display: grid;
        border-radius: var(--raio-bloco);
      }
      .corpo {
        display: flex;
        flex-direction: column;
        min-width: 0;
        padding: var(--bloco-pad-y) var(--bloco-pad-x);
        border-radius: var(--raio-bloco);
        background: var(--cor-materia);
        color: var(--cor-tinta);
        text-align: left;
      }
      :root[data-tema='escuro'] .corpo {
        background: color-mix(in srgb, var(--cor-materia) 62%, var(--cor-tinta));
        color: var(--cor-sobre-tinta);
      }
      .sigla {
        font: var(--voz-numero);
        font-size: 64px;
        line-height: 1;
        font-weight: 300;
        letter-spacing: -0.02em;
      }
      .nome {
        margin-top: var(--e1);
        font: var(--ui-rotulo);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .rodape {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--e2);
        margin-top: auto;
        font: var(--ui-item);
      }
      .prova {
        padding: 1px 9px;
        border-radius: var(--raio-pilula);
        background: color-mix(in srgb, currentColor 16%, transparent);
        font: var(--ui-sigla);
        white-space: nowrap;
      }

      /* Tom do foco: da própria cor da matéria, nunca preto. Mais fundo no claro, mais vivo no escuro. */
      .materia {
        --tom: color-mix(in srgb, var(--cor-materia) 45%, var(--cor-tinta));
      }
      :root[data-tema='escuro'] .materia {
        --tom: var(--cor-materia);
      }

      /* A: anel por dentro, 4px, no tom da matéria */
      .v-a .foco .corpo {
        box-shadow: inset 0 0 0 4px var(--tom);
      }

      /* B: o cartão troca de tom (claro: fica fundo com texto claro; escuro: fica vivo com tinta) */
      .v-b .foco .corpo {
        background: color-mix(in srgb, var(--cor-materia) 55%, var(--cor-tinta));
        color: var(--cor-sobre-tinta);
      }
      :root[data-tema='escuro'] .v-b .foco .corpo {
        background: var(--cor-materia);
        color: var(--cor-tinta);
      }

      /* C: anel por fora, 3px, afastado 3px, no tom da matéria */
      .v-c .foco {
        outline: 3px solid var(--tom);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import { Sala } from './_sala.js';
      const D = [
        ['GEN', 'Genética', 3, 'prova 1 d'],
        ['IMU', 'Imunologia', 9, 'prova 36 d'],
        ['PRO', 'Propedêutica', 2, 'prova 15 d'],
        ['APS', 'Atenção primária', 1, 'prova 15 d'],
        ['FAR', 'Farmacologia', 2, 'prova 8 d'],
        ['FIS', 'Fisiologia', 42, 'prova 8 d'],
        ['PAT', 'Patologia geral e bases moleculares', 1, 'prova 22 d'],
        ['BIO', 'Bioética', 0, 'prova 15 d'],
      ];
      const cor = [1, 2, 3, 0, 4, 5, 6, 7];
      const v = (id, nome, foco) => ({
        id,
        nome,
        html: () =>
          `<div class="grade v-${id}">${D.map(
            ([s, n, q, p], i) =>
              `<div class="materia ${i === foco ? 'foco' : ''}" data-materia="${cor[i]}"><span class="corpo"><b class="sigla">${s}</b><span class="nome">${n}</span><span class="rodape"><span>${q} aulas</span><span class="prova">${p}</span></span></span></div>`,
          ).join('')}</div>`,
      });
      Sala.montar({
        titulo: 'Acervo: foco do cartão de matéria (2º cartão em foco)',
        dados: {},
        variantes: [
          v('a', 'A. Anel por dentro, no tom da matéria', 1),
          v('b', 'B. O cartão troca de tom', 1),
          v('c', 'C. Anel por fora, afastado', 1),
        ],
      });
    </script>
  </body>
</html>
