<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hub na identidade Giz A</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Nunito:wght@700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Hub redesenhado do zero na identidade A. ?foco=agora|agenda|provas|nenhum. Tema: html[data-tema] */
:root{--voz:'Nunito',system-ui,sans-serif;--ui:'Inter',system-ui,sans-serif;--leitura:'Source Sans 3','Inter',system-ui,sans-serif}
html[data-tema="claro"]{--fundo:#f4f4f1;--cartao:#fff;--cartao2:#ecece8;--texto:#000;--texto2:#5c5c5c;--linha:#dcdcd8;
 --tinta:#000;--sobre-tinta:#fff;--acao:#00e58b;--sobre-acao:#000;--foco:#00a566;--alerta:#d93025;--alerta-na-tinta:#ff8a80;
 --m-azul:#a9d5fb;--m-verde:#b3f5dd;--m-rosa:#fcc5c5;--m-lilas:#dcc9fb;--m-amarelo:#fde9a8;--m-cinza:#e3e3e3;--m-texto:#000;color-scheme:light}
html[data-tema="escuro"]{--fundo:#121212;--cartao:#1e1e1e;--cartao2:#2a2a2a;--texto:#fff;--texto2:#a3a3a3;--linha:#333;
 --tinta:#000;--sobre-tinta:#fff;--acao:#00e58b;--sobre-acao:#000;--foco:#00e58b;--alerta:#ff8a80;--alerta-na-tinta:#ff8a80;
 --m-azul:#254a6b;--m-verde:#1f5a47;--m-rosa:#6b2c2c;--m-lilas:#47336b;--m-amarelo:#5e4f1d;--m-cinza:#333;--m-texto:#fff;color-scheme:dark}
*{box-sizing:border-box} body{margin:0;background:var(--fundo)}
h1,h2,h3,p{margin:0}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.stage{width:1280px;height:800px;overflow:hidden;background:var(--fundo);color:var(--texto);padding:8px;display:flex;flex-direction:column;gap:8px;font:500 14px/20px var(--ui);font-variant-numeric:tabular-nums}

/* barra */
.barra{height:48px;display:flex;align-items:center;gap:8px;flex:none}
.num{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;background:var(--cartao);color:var(--texto2);font:700 15px/20px var(--ui)}
.num.at{background:var(--texto);color:var(--fundo)}
.barra h1{font:800 26px/30px var(--voz);margin-left:8px}
.barra .fim{margin-left:auto;display:flex;gap:8px}
.pil{height:44px;padding:0 18px;border-radius:999px;background:var(--cartao);display:inline-flex;align-items:center;font:700 14px/20px var(--ui);color:var(--texto2)}

/* peça e rótulo de bloco */
.peca{background:var(--cartao);border:1px solid var(--linha);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.cab{display:flex;align-items:center;gap:8px;height:28px;margin-bottom:8px;flex:none}
.rot{font:700 12.5px/20px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--texto2)}
.rot b{color:var(--texto);margin-left:6px;letter-spacing:0}
.tecla{margin-left:auto;height:22px;padding:0 9px;border-radius:999px;background:var(--cartao2);color:var(--texto2);font:600 12px/22px var(--ui)}

/* etiqueta de matéria (A): retângulo pastel, sigla em caixa-alta */
.tag{display:inline-block;background:var(--cor);color:var(--m-texto);border-radius:4px;padding:1px 7px;font:500 12px/18px var(--ui);letter-spacing:.2px;text-transform:uppercase;flex:none}
.m-GEN{--cor:var(--m-verde)}.m-APS{--cor:var(--m-amarelo)}.m-IMU{--cor:var(--m-rosa)}.m-PRO{--cor:var(--m-azul)}
.m-FAR{--cor:var(--m-lilas)}.m-PAT{--cor:var(--m-verde)}.m-FIS{--cor:var(--m-azul)}.m-BIO{--cor:var(--m-cinza)}

/* provas: bloco de contagem. A mais próxima é preta (tinta), as outras brancas */
.provas{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;height:168px;flex:none}
.prova{border-radius:14px;background:var(--cartao);border:1px solid var(--linha);padding:12px 16px 14px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.prova .l1{display:flex;align-items:center;justify-content:space-between;font:700 12.5px/20px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--texto2)}
.prova .n{font:800 60px/56px var(--voz);letter-spacing:-.03em;display:flex;align-items:center;gap:10px}
.prova .tp{font:600 12px/22px var(--ui);height:22px;padding:0 9px;border-radius:999px;background:var(--cartao2);color:var(--texto2);letter-spacing:.06em}
.prova .tags{display:flex;gap:5px;min-height:20px}
.prova.prox{background:var(--tinta);color:var(--sobre-tinta);border-color:var(--tinta)}
.prova.prox .l1{color:#bdbdbd} .prova.prox .n{color:var(--acao)} .prova.prox .tp{background:#2a2a2a;color:#ddd}
/* aviso de prazo (A): pílula discreta, sem ícone nem vermelho */
.selo{display:inline-flex;align-items:center;border-radius:999px;padding:0 10px;font:600 12px/22px var(--ui);letter-spacing:0;text-transform:none;background:var(--cartao2);color:var(--texto2)}
.prova.prox .selo{background:#2a2a2a;color:#fff}

.baixo{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:8px}

/* calendário com marcador de matéria (NOVO) */
.cal{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:46px;margin-top:2px}
.cal .dw{display:grid;place-items:center;height:28px;font:700 12.5px/20px var(--ui);color:var(--texto2)}
.cal .d{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 15px/18px var(--ui)}
.cal .d.fora{color:var(--texto2);font-weight:500}
.cal .d.prv{font-weight:800}
.marc{width:22px;height:8px;border-radius:999px;background:var(--cor)}
.marc.vz{background:transparent}
.cal .d.hoje span{width:50px;height:34px;border-radius:999px;display:grid;place-items:center;background:var(--texto);color:var(--fundo);font-weight:700}

/* agenda de hoje: cartão Agora (NOVO) + linhas */
.agora{border-radius:14px;background:var(--tinta);color:var(--sobre-tinta);padding:16px 18px;display:flex;flex-direction:column;gap:10px;flex:none}
.agora .l1{display:flex;align-items:center;gap:8px}
.agora .ao{font:700 12px/22px var(--ui);height:22px;padding:0 10px;border-radius:999px;background:var(--acao);color:var(--sobre-acao);letter-spacing:.06em;text-transform:uppercase}
.agora .hora{margin-left:auto;font:600 14px/20px var(--ui);color:#bdbdbd}
.agora h2{font:800 28px/32px var(--voz)}
.agora .sub{font:400 15.5px/22px var(--leitura);color:#bdbdbd}
.prog{height:8px;border-radius:999px;background:#2a2a2a;overflow:hidden}
.prog i{display:block;height:100%;width:30%;border-radius:999px;background:var(--acao)}
.agora .rod{display:flex;align-items:center;justify-content:space-between;color:#bdbdbd;font:500 13px/20px var(--ui)}
.btn{height:44px;border-radius:8px;display:inline-flex;align-items:center;gap:10px;padding:0 20px;background:var(--acao);color:var(--sobre-acao);font:700 14px/20px var(--ui);white-space:nowrap}
.btn .k{font-weight:600;opacity:.7}
.sec-rot{margin:12px 0 6px;font:700 12px/16px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--texto2)}
.linha{height:56px;border-radius:10px;background:var(--cartao2);display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:10px;padding:0 14px;margin-bottom:4px}
.linha .h{color:var(--texto2);font:500 13.5px/20px var(--ui)}
.linha .t{display:flex;align-items:center;gap:8px;min-width:0;font:800 16px/20px var(--voz);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linha.passou .t{color:var(--texto2)}
.linha .st{display:inline-flex;align-items:center;gap:4px;color:var(--texto2);font:600 12.5px/20px var(--ui)}

/* lembretes */
.lemb{display:flex;gap:12px;align-items:flex-start;padding:10px 0;font:400 16.5px/24px var(--leitura)}
.ck{width:36px;height:22px;border-radius:999px;border:2px solid var(--texto2);flex:none;margin-top:1px}
.lemb.feito{color:var(--texto2);text-decoration:line-through} .lemb.feito .ck{background:var(--texto);border-color:var(--texto)}
.fill{flex:1}

/* foco: um só anel forte, 4px por dentro (D105) */
.foco-bloco{box-shadow:inset 0 0 0 4px var(--foco)}
.foco-item{box-shadow:inset 0 0 0 4px var(--foco)}
.provas.foco-bloco{box-shadow:none}
.provas.foco-bloco .prova{box-shadow:inset 0 0 0 4px var(--foco)}
</style>
<link rel="stylesheet" href="giz-a-suave.css">
</head>
<body>
<div class="stage" id="s"></div>
<script>
const P=new URLSearchParams(location.search);const foco=P.get('foco')??'agora';
if(!document.documentElement.dataset.tema)document.documentElement.dataset.tema=P.get('tema')??'claro';
const I={alerta:'<svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9 2.4 17.5A2 2 0 0 0 4.1 20.5h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
 check:'<svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>'};
const tag=(k)=>`<span class="tag m-${k}">${k}</span>`;
const PROVAS=[['DOM · NOV','15',7,['GEN'],''],['QUI · NOV','19',11,['IMU','PRO'],'T'],['DOM · NOV','22',14,['FAR','APS','PAT'],'A'],['SÁB · NOV','28',20,['APS','FAR','PRO','+4'],''],['QUI · DEZ','03',25,['FAR','GEN'],'T A']];
const prova=(p,i)=>`<div class="prova ${i===0?'prox':''}"><div class="l1"><span>${p[0]}</span>${i===0?`<span class="selo">em ${p[2]} dias</span>`:`<span style="letter-spacing:0;text-transform:none">em ${p[2]} d</span>`}</div>
 <div class="n">${p[1]}${p[4]?`<span class="tp">${p[4]}</span>`:''}</div><div class="tags">${p[3].map(k=>k.startsWith('+')?`<span class="tag" style="--cor:var(--cartao2);color:var(--texto2)">${k}</span>`:tag(k)).join('')}</div></div>`;
let cal='';['D','S','T','Q','Q','S','S'].forEach(x=>cal+=`<span class="dw">${x}</span>`);
const pf={15:'GEN',19:'IMU',22:'PRO',28:'APS'};
for(let d=1;d<=30;d++){cal+=d===8?`<span class="d hoje"><span>8</span></span>`:`<span class="d ${pf[d]?'prv':''}">${d}${pf[d]?`<i class="marc m-${pf[d]}"></i>`:'<i class="marc vz"></i>'}</span>`}
cal+=`<span class="d fora">1</span><span class="d fora">2</span><span class="d fora prv">3<i class="marc m-FAR"></i></span><span class="d fora">4</span><span class="d fora">5</span>`;
const lemb=(t,f)=>`<div class="lemb ${f?'feito':''}"><span class="ck"></span><span>${t}</span></div>`;
document.getElementById('s').innerHTML=`
<div class="barra">${[1,2,3,4,5,6].map(n=>`<span class="num ${n===1?'at':''}">${n}</span>`).join('')}<h1>Domingo, 8 de novembro</h1><div class="fim"><span class="pil">Faltas</span><span class="pil">Notas</span><span class="pil" style="padding:0;width:44px;justify-content:center">?</span></div></div>
<div class="provas ${foco==='provas'?'foco-bloco':''}">${PROVAS.map(prova).join('')}</div>
<div class="baixo">
 <div class="peca"><div class="cab"><span class="rot">Novembro<b>2026</b></span></div><div class="cal">${cal}</div></div>
 <div class="peca ${foco==='agenda'?'foco-bloco':''}"><div class="cab"><span class="rot">Agenda de hoje<b>4 aulas</b></span><span class="tecla">Alt A</span></div>
  <div class="agora ${foco==='agora'?'foco-item':''}">
   <div class="l1"><span class="ao">Agora</span>${tag('IMU')}<span class="hora">13:00–15:00</span></div>
   <h2>Resposta inflamatória aguda</h2><p class="sub">Imunologia · 2 de 4 tópicos nas anotações</p>
   <div class="prog"><i></i></div>
   <div class="rod"><span>Termina em 1 h 25 min</span><span class="btn">Abrir na Mesa <span class="k">Enter</span></span></div></div>
  <div class="sec-rot">Mais tarde</div>
  <div class="linha"><span class="h">15:10–17:00</span><span class="t">${tag('PRO')}Exame do abdome</span><span class="st">Depois</span></div>
  <div class="sec-rot">Já passaram</div>
  <div class="linha passou"><span class="h">08:00–09:30</span><span class="t">${tag('GEN')}Expressão gênica</span><span class="st">${I.check}Encerrada</span></div>
  <div class="linha passou"><span class="h">10:00–11:00</span><span class="t">${tag('APS')}Territorialização</span><span class="st">${I.check}Encerrada</span></div>
 </div>
 <div class="peca"><div class="cab"><span class="rot">Lembretes</span><span class="tecla">Alt I</span></div>
  ${lemb('Levar o jaleco para a Propedêutica.')}${lemb('Revisar IL-6 e TNF-α antes da prova de Imunologia.')}${lemb('Confirmar a sala do laboratório de Genética.')}${lemb('Devolver o livro de Histologia.',1)}
  <div class="fill"></div><span class="btn" style="justify-content:center">Novo lembrete <span class="k">Alt N</span></span></div>
</div>`;
</script>
</body>
</html>
