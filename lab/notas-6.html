<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notas: pontos e esquema</title>
    <style>
      .tela {
        height: 752px;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        gap: var(--vao-mosaico);
        padding: var(--vao-mosaico);
        background: var(--cor-fundo);
        color: var(--cor-texto);
      }
      .barra {
        display: flex;
        align-items: center;
        gap: var(--e3);
        height: 40px;
        padding-left: var(--e1);
      }
      .barra .num {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--cor-cartao);
        font: var(--ui-botao);
        color: var(--cor-texto-2);
      }
      .barra .num[data-sel='true'] {
        background: var(--cor-destaque);
        color: var(--cor-tinta);
      }
      .barra h2 {
        margin-left: var(--e2);
        font: var(--voz-titulo);
        letter-spacing: 0.02em;
      }
      .cartao {
        background: var(--cor-cartao);
        border-radius: var(--raio-bloco);
        padding: var(--e5) var(--e6);
        min-width: 0;
        min-height: 0;
      }
      .cartao.ativo {
        border: var(--borda-bloco) solid var(--cor-bloco-ativo);
        padding: calc(var(--e5) - 2px) calc(var(--e6) - 2px);
      }
      .rotulo {
        color: var(--cor-texto-2);
        font: var(--ui-rotulo);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .apoio {
        color: var(--cor-texto-2);
        font: var(--ui-apoio);
      }
      kbd {
        font: var(--ui-tecla);
        color: var(--cor-texto-2);
      }
      .num-t {
        font-family: var(--fonte-interface);
        font-variant-numeric: tabular-nums;
      }
      .baixa {
        background: color-mix(in srgb, var(--cor-laranja) 30%, var(--cor-cartao));
      }

      /* cabeçalho de tela */
      .topo {
        display: flex;
        align-items: center;
        gap: var(--e5);
        padding: 0 var(--e2);
        height: 48px;
      }
      .abas {
        display: flex;
        gap: var(--e5);
      }
      .abas span {
        font: var(--ui-botao);
        color: var(--cor-texto-2);
        padding: var(--e2) 0;
      }
      .abas span[data-sel='true'] {
        color: var(--cor-texto);
        box-shadow: inset 0 -3px 0 var(--cor-bloco-ativo);
      }
      .topo .fim {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: var(--e4);
        font: var(--ui-apoio);
        color: var(--cor-texto-2);
      }
      .topo .ano {
        font: var(--voz-item);
        color: var(--cor-texto);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: var(--e2);
        height: 40px;
        padding: 0 var(--e4);
        border-radius: var(--raio-pilula);
        background: var(--cor-cartao);
        font: var(--ui-botao);
        color: var(--cor-texto);
      }

      .disc {
        display: flex;
        align-items: center;
        gap: var(--e3);
        min-width: 0;
      }
      .pt {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex: none;
      }
      .cod {
        width: 36px;
        color: var(--cor-texto-2);
        font: var(--ui-sigla);
        letter-spacing: 0.04em;
      }
      .nm {
        font: var(--ui-botao);
        font-weight: 600;
        white-space: nowrap;
      }
      .sit {
        display: inline-flex;
        align-items: center;
        gap: var(--e2);
        font: var(--ui-item);
        white-space: nowrap;
      }
      .sit i {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: var(--cor-tinta);
      }
      .sit i svg {
        width: 11px;
        height: 11px;
      }
      .sit.ok i {
        background: var(--cor-verde);
      }
      .sit.at i {
        background: var(--cor-laranja);
      }
      .sit.nd {
        color: var(--cor-texto-2);
      }
      .foco {
        outline: var(--contorno-foco) solid var(--cor-contorno-foco);
        outline-offset: -4px;
      }
      .sel {
        background: var(--cor-marca);
      }

      
      .grade { display: grid; gap: var(--vao-mosaico); min-height: 0; }
      .g3 { grid-template-columns: 270px minmax(0, 1fr) 290px; }
      .g2 { grid-template-columns: 270px minmax(0, 1fr); }
      .centro { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: var(--vao-mosaico); min-height: 0; }
      .lst { display: grid; align-content: start; gap: 2px; margin-top: var(--e3); }
      .lst .it { display: flex; align-items: center; gap: var(--e3); min-height: var(--item-lista); padding: 0 var(--e3); border-radius: var(--raio-item); }
      .lst .it .nm { flex: 1; min-width: 0; }
      .lst .it b { font: 700 16px/20px var(--fonte-interface); font-variant-numeric: tabular-nums; }
      .lst .it b.vz { color: var(--cor-texto-2); font-weight: 400; }
      .cab { display: flex; align-items: center; gap: var(--e4); margin-bottom: var(--e2); }
      .cab h3 { font: var(--voz-tela); }
      .cab .md { margin-left: auto; display: flex; align-items: baseline; gap: var(--e3); }
      .cab .md b { font: var(--voz-numero); font-size: 48px; line-height: 44px; }

      /* faixas, como na A1 */
      .quadro { display: flex; align-items: flex-start; }
      .grp { display: flex; flex-direction: column; flex: none; margin-left: var(--e2); padding: 0 var(--e2); border-radius: var(--raio-item); background: var(--cor-cartao-2); }
      .grp.ano { background: var(--cor-marca); }
      .gt { font: var(--ui-rotulo); letter-spacing: 0.06em; text-transform: uppercase; text-align: center; height: 32px; display: grid; place-items: center; }
      .gs, .gr { display: grid; text-align: center; }
      .gs { height: 24px; }
      .gr { height: 56px; align-items: center; }
      .v { display: grid; place-items: center; height: 56px; font: 500 20px/22px var(--fonte-interface); font-variant-numeric: tabular-nums; }
      .v .in { min-width: 52px; padding: 6px 0; text-align: center; border-radius: var(--raio-minimo); }
      .v.s { font-weight: 700; font-size: 22px; }
      .v.s .in { background: var(--cor-cartao); }
      .v.vz { color: var(--cor-texto-2); font-weight: 400; }
      .v.an { font: var(--voz-titulo); }
      .v.an.vz { color: var(--cor-texto-2); font-weight: 600; }
      .grp .gr + .gr { }
      .fecha { height: 56px; display: grid; align-content: center; justify-items: center; gap: 2px; text-align: center; }
      .fecha b { font: 700 15px/18px var(--fonte-interface); font-variant-numeric: tabular-nums; }
      .fecha small { color: var(--cor-texto-2); font: var(--ui-apoio); }
      .fecha.rot { height: 24px; }
      .sel.in, .in.sel { background: var(--cor-marca); }
      .in.foco { outline: var(--contorno-foco) solid var(--cor-contorno-foco); outline-offset: -4px; background: var(--cor-marca); }

      /* avaliações */
      .tit2 { display: flex; align-items: center; gap: var(--e4); margin-bottom: var(--e3); }
      .tit2 h4 { font: var(--voz-titulo); }
      .tit2 .btn.p { margin-left: auto; background: var(--cor-botao); color: var(--cor-sobre-botao); }
      .tit2 .btn.p kbd { color: inherit; opacity: 0.7; }
      .ava { display: grid; grid-template-columns: minmax(0, 1fr) 80px 130px; align-items: center; }
      .ava > * { min-height: 44px; display: flex; align-items: center; }
      .ava .h { min-height: 28px; }
      .ava .h.r, .ava .pe { justify-content: center; }
      .ava .pe { color: var(--cor-texto-2); font: var(--ui-item); font-variant-numeric: tabular-nums; }
      .ava .no { justify-content: center; }
      .ava .no span { width: 96px; height: 40px; display: grid; place-items: center; border-radius: var(--raio-campo); border: 2px dashed var(--cor-texto-2); color: var(--cor-texto-2); font: var(--ui-item); }
      .ava .an { font: var(--voz-mini); padding-left: var(--e3); }
      .ava .an.sel, .ava .pe.sel, .ava .no.sel { background: var(--cor-marca); }
      .ava .an.sel { border-radius: var(--raio-item) 0 0 var(--raio-item); }
      .ava .no.sel { border-radius: 0 var(--raio-item) var(--raio-item) 0; }
      .mb { margin-top: var(--e4); display: flex; align-items: center; gap: var(--e3); }
      .mb b { font: var(--voz-mini); }

      /* quanto preciso, em texto */
      .quad { display: grid; align-content: start; gap: var(--e5); }
      .quad .mt { display: flex; align-items: center; gap: var(--e3); font: var(--voz-item); }
      .quad .mt span.s { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; background: var(--cor-cartao-2); font: var(--ui-botao); }
      .quad .bx { display: grid; gap: var(--e1); }
      .quad .bx b { font: var(--voz-numero); font-size: 40px; line-height: 40px; font-variant-numeric: tabular-nums; }
      .quad .bx p { color: var(--cor-texto-2); font: var(--leitura-compacta); }

      /* pontos: cabeçalho de faixa com o valor do bimestre */
      .gs { height: 40px; align-items: start; }
      .gs span { display: grid; gap: 0; }
      .gs small { font: var(--ui-tecla); letter-spacing: 0; text-transform: none; color: var(--cor-texto-2); }
      .gs.um { height: 40px; }
      .v .mx { display: none; }
      .tit2 h4 small { font: var(--ui-apoio); color: var(--cor-texto-2); margin-left: var(--e2); }
      .ava { grid-template-columns: minmax(0, 1fr) 90px 150px; }
      .ava .no span.cheio { border: 0; background: var(--cor-cartao-2); color: var(--cor-texto); font: 700 17px/20px var(--fonte-interface); font-variant-numeric: tabular-nums; }
      .ava .no span small { color: var(--cor-texto-2); font: var(--ui-apoio); margin-left: 4px; }
      .ava .no { gap: var(--e2); }
      .quad .bx b small { font: var(--ui-botao); color: var(--cor-texto-2); margin-left: var(--e2); }

      /* janelas */
      .palco { position: relative; }
      .veu { position: absolute; inset: 0; background: var(--cor-veu); display: grid; place-items: center; border-radius: 0; }
      .janela { width: 560px; background: var(--cor-cartao); border-radius: var(--raio-bloco); padding: var(--e5) var(--e6); display: grid; gap: var(--e4); box-shadow: 0 12px 40px rgb(0 0 0 / 30%); }
      .janela h3 { font: var(--voz-titulo); }
      .janela .sub { color: var(--cor-texto-2); font: var(--ui-apoio); margin-top: 2px; }
      .sec { display: grid; gap: var(--e2); }
      .modelos { display: flex; gap: var(--e2); align-items: center; }
      .pil { display: inline-flex; align-items: center; height: 40px; padding: 0 var(--e4); border-radius: var(--raio-pilula); background: var(--cor-cartao-2); font: var(--ui-botao); }
      .pil[data-sel='true'] { background: var(--cor-marca); }
      .link { margin-left: auto; color: var(--cor-texto-2); font: var(--ui-item); }
      .semestres { display: grid; grid-template-columns: 1fr 1fr; gap: var(--e3); }
      .semc { background: var(--cor-cartao-2); border-radius: var(--raio-item); padding: var(--e3) var(--e4); display: grid; gap: var(--e2); }
      .semc .l { display: flex; align-items: center; gap: var(--e3); }
      .semc .l span:first-child { flex: 1; font: var(--ui-item); }
      .campo { min-width: 84px; height: 44px; padding: 0 var(--e3); display: flex; align-items: center; justify-content: center; border-radius: var(--raio-campo); background: var(--cor-cartao); font: 600 17px/20px var(--fonte-interface); font-variant-numeric: tabular-nums; }
      .campo.foco { outline: 2px solid var(--cor-bloco-ativo); outline-offset: -2px; }
      .campo.txt { justify-content: flex-start; font: var(--leitura-campo); width: 100%; }
      .campo.cp { color: var(--cor-texto-2); font-weight: 400; }
      .soma { display: flex; align-items: center; gap: var(--e2); font: var(--ui-item); }
      .soma i { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--cor-verde); color: var(--cor-tinta); }
      .soma i svg { width: 11px; height: 11px; }
      .lin2 { display: flex; align-items: center; gap: var(--e4); }
      .lin2 > span:first-child { flex: 1; font: var(--ui-item); }
      .dica { padding: var(--e3) var(--e4); border-radius: var(--raio-item); background: var(--cor-cartao-2); color: var(--cor-texto-2); font: var(--leitura-compacta); }
      .acoes { display: flex; align-items: center; gap: var(--e3); justify-content: flex-end; margin-top: var(--e2); }
      .acoes .btn { background: var(--cor-cartao-2); }
      .acoes .btn.p { background: var(--cor-botao); color: var(--cor-sobre-botao); }
      .acoes .btn.p kbd { color: inherit; opacity: 0.7; }
      .rot2 { display: grid; gap: var(--e2); }
      .rot2 .rotulo { }
      .dupla { display: grid; grid-template-columns: 1fr 1fr; gap: var(--e4); }
      .barraaloc { display: flex; height: 12px; gap: 3px; }
      .barraaloc span { border-radius: 6px; background: var(--cor-destaque); }
      .barraaloc span:nth-child(2) { opacity: 0.7; }
      .barraaloc span:nth-child(3) { opacity: 0.45; }

    </style>
  </head>
  <body>
    <script type="module">
      import { Sala } from './_sala.js';
      const META = 7;
      const D = [
        ['Genética', 'rosa', '7,8'], ['Imunologia', 'destaque', '6,5'], ['Propedêutica', 'azul', '6,7'],
        ['Atenção primária', 'verde', '7,2'], ['Microbiologia', 'ciano', '8,0'], ['Psicologia', 'laranja', null],
      ];
      const ICO = {
        at: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><path d="M12 5v9M12 19v.01"/></svg>',
        ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>',
      };
      const sit = (k, t) => `<span class="sit ${k}"><i>${ICO[k]}</i>${t}</span>`;
      const pt = (c) => `<span class="pt" style="background:var(--cor-${c})"></span>`;
      const barra = `<div class="barra">${[1, 2, 3, 4, 5, 6].map((n) => `<span class="num" ${n === 5 ? 'data-sel="true"' : ''}>${n}</span>`).join('')}<h2>NOTAS</h2></div>`;
      const topo = `<div class="topo"><div class="abas"><span>Boletim geral</span><span data-sel="true">Por disciplina</span></div>
        <div class="fim"><span class="apoio">‹</span><span class="ano">2026</span><span class="apoio">›</span><span>Aberto</span><span class="btn">‹ Agenda <kbd>Esc</kbd></span></div></div>`;
      const moldura = (corpo, janela = '') => `<div class="tela palco">${barra}<div style="display:grid;grid-template-rows:auto minmax(0,1fr);gap:var(--vao-mosaico);min-height:0">${topo}${corpo}</div>${janela ? `<div class="veu">${janela}</div>` : ''}</div>`;

      const lista = `<div class="cartao"><span class="rotulo">Disciplinas</span><div class="lst">${D.map((d, i) => `<div class="it${i === 2 ? ' sel' : ''}">${pt(d[1])}<span class="nm">${d[0]}</span><b${d[2] === null ? ' class="vz"' : ''}>${d[2] ?? '—'}</b></div>`).join('')}</div></div>`;

      const cabeca = `<div class="cab">${pt('azul')}<h3>Propedêutica</h3>${sit('at', 'Atenção')}<span class="md"><span class="apoio">Média atual</span><b>6,7</b></span><span class="btn">Configurar</span></div>`;

      // Valores em pontos; o laranja olha a fração (2,4 de 3,0 = 80%), nunca o número cru.
      const cel = (txt, frac, sel) => `<span class="v${txt === '—' ? ' vz' : ''}"><span class="in${frac !== null && frac < 0.7 ? ' baixa' : ''}${sel ? ' foco' : ''}">${txt}</span></span>`;
      const sem = (txt, frac) => `<span class="v s${txt === '—' ? ' vz' : ''}"><span class="in${frac !== null && frac < 0.7 ? ' baixa' : ''}">${txt}</span></span>`;
      const grp = (cls, titulo, subs, linha, fecho) => {
        const n = subs.length;
        const gtc = `repeat(${n}, ${n === 1 ? 96 : 76}px)`;
        return `<div class="grp ${cls}"><div class="gt">${titulo}</div>
          <div class="gs rotulo" style="grid-template-columns:${gtc}">${subs.map(([a, b]) => `<span>${a}${b ? `<small>${b}</small>` : ''}</span>`).join('')}</div>
          <div class="gr" style="grid-template-columns:${gtc}">${linha}</div>${fecho ?? ''}</div>`;
      };
      const faixas = `<div class="quadro" style="margin-left:calc(var(--e2) * -1)">
        ${grp('s', '1º semestre', [['1º bim', 'de 3'], ['2º bim', 'de 7'], ['Total', 'de 10']], `${cel('2,4', 0.8)}${cel('4,9', 0.7)}${sem('7,3', 0.73)}`)}
        ${grp('s', '2º semestre', [['3º bim', 'de 3'], ['4º bim', 'de 7'], ['Total', 'de 10']], `${cel('1,8', 0.6)}${cel('—', null, true)}${sem('—', null)}`)}
        ${grp('ano', 'Ano', [['Média', 'de 10']], `<span class="v an vz">—</span>`)}
      </div>`;

      const lan = (nome, vale, nota, sel) => `<span class="an${sel ? ' sel' : ''}">${nome}</span><span class="pe${sel ? ' sel' : ''}">${vale}</span><span class="no${sel ? ' sel' : ''}">${nota ? `<span class="cheio">${nota}</span>` : `<span>lançar</span>`}</span>`;
      const avaliacoes = `<div class="cartao ativo">
        <div class="tit2"><h4>4º bimestre</h4><span class="btn p">+ Nova avaliação <kbd>Alt N</kbd></span></div>
        <div class="ava">
          <span class="h rotulo">Avaliação</span><span class="h r rotulo">Vale</span><span class="h r rotulo">Nota</span>
          ${lan('Prova teórica', '4,0', '3,2')}${lan('Prova prática', '2,0', null, true)}${lan('Seminário', '1,0', null)}
        </div>
        <div class="mb"><span>No bimestre</span><b>3,2</b><span class="apoio">de 7,0</span></div>
      </div>`;

      const quad = `<div class="cartao quad">
        <span class="rotulo">Quanto preciso tirar</span>
        <div class="mt"><span class="rotulo">Meta</span><span class="s">‹</span>7,0<span class="s">›</span></div>
        <div class="bx"><span class="apoio">Fechar o 1º semestre</span><b>7,3</b></div>
        <div class="bx"><span class="apoio">Fechar o 2º semestre</span><b>5,2<small>de 7,0 no 4º bim</small></b></div>
        <div class="bx"><span class="apoio">Fechar o ano</span><b>4,9<small>de 7,0 no 4º bim</small></b></div>
      </div>`;

      // A. tela por disciplina, em pontos
      const A = () => moldura(`<div class="grade g3">${lista}<div class="centro"><div class="cartao">${cabeca}${faixas}</div>${avaliacoes}</div>${quad}</div>`);

      const fundo = `<div class="grade g3">${lista}<div class="centro"><div class="cartao">${cabeca}${faixas}</div>${avaliacoes}</div>${quad}</div>`;

      // B. janela: esquema de cálculo
      const cp = (v, foco) => `<span class="campo${foco ? ' foco' : ''}">${v}</span>`;
      const semc = (t, a, b, va, vb) => `<div class="semc"><span class="rotulo">${t}</span>
        <div class="l"><span>${a}</span>${cp(va, t.startsWith('1'))}</div><div class="l"><span>${b}</span>${cp(vb)}</div></div>`;
      const esquema = `<div class="janela">
        <div><h3>Esquema de cálculo</h3><div class="sub">Propedêutica · 2026</div></div>
        <div class="modelos"><span class="pil">5 + 5</span><span class="pil" data-sel="true">3 + 7</span><span class="pil">Outro</span></div>
        <div class="semestres">${semc('1º semestre', '1º bimestre', '2º bimestre', '3,0', '7,0')}${semc('2º semestre', '3º bimestre', '4º bimestre', '3,0', '7,0')}</div>
        <div class="acoes"><span class="link" style="margin:0 auto 0 0">Mais opções ›</span><span class="btn">Cancelar <kbd>Esc</kbd></span><span class="btn p">Salvar <kbd>Enter</kbd></span></div></div>`;
      const B = () => moldura(fundo, esquema);

      // C. janela: nova avaliação com nota máxima
      const aval = `<div class="janela">
        <div><h3>Nova avaliação</h3><div class="sub">Propedêutica · 4º bimestre</div></div>
        <div class="rot2"><span class="rotulo">Nome</span><span class="campo txt foco">Prova prática</span></div>
        <div class="dupla">
          <div class="rot2"><span class="rotulo">Vale</span>${cp('2,0')}</div>
          <div class="rot2"><span class="rotulo">Nota tirada</span><span class="campo cp">opcional</span></div>
        </div>
        <div class="acoes"><span class="link" style="margin:0 auto 0 0">Mais opções ›</span><span class="btn">Cancelar <kbd>Esc</kbd></span><span class="btn p">Salvar <kbd>Enter</kbd></span></div></div>`;
      const C = () => moldura(fundo, aval);

      Sala.montar({
        titulo: 'Notas: pontos e esquema',
