<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acervo: foco do cartão, refinando o C</title>
    <style>
      .grade {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-auto-rows: 200px;
        gap: var(--vao-mosaico);
        padding: 14px;
      }
      .materia {
        position: relative;
        display: grid;
        border-radius: var(--raio-bloco);
        transition: transform 180ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .corpo {
        display: flex;
        flex-direction: column;
        min-width: 0;
        padding: var(--bloco-pad-y) var(--bloco-pad-x);
        border-radius: var(--raio-bloco);
        background: var(--cor-materia);
        color: var(--cor-tinta);
        text-align: left;
        transition: box-shadow 180ms;
      }
      :root[data-tema='escuro'] .corpo {
        background: color-mix(in srgb, var(--cor-materia) 62%, var(--cor-tinta));
        color: var(--cor-sobre-tinta);
      }
      .sigla {
        font: var(--voz-numero);
        font-size: 64px;
        line-height: 1;
        font-weight: 300;
        letter-spacing: -0.02em;
      }
      .nome {
        margin-top: var(--e1);
        font: var(--ui-rotulo);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .rodape {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--e2);
        margin-top: auto;
        font: var(--ui-item);
      }
      .prova {
        padding: 1px 9px;
        border-radius: var(--raio-pilula);
        background: color-mix(in srgb, currentColor 16%, transparent);
        font: var(--ui-sigla);
        white-space: nowrap;
      }

      .corpo {
        --tom: color-mix(in srgb, var(--cor-materia) 68%, var(--cor-tinta));
      }
      :root[data-tema='escuro'] .corpo {
        --tom: var(--cor-materia);
      }

      /* Hoje (o que está no app): anel 3px + gap 3px + faixa de 4px a 25%, sobe 2px */
      .v-a .foco {
        z-index: 2;
        transform: translateY(-2px);
      }
      .v-a .foco .corpo {
        box-shadow:
          0 0 0 3px var(--cor-fundo),
          0 0 0 6px var(--tom),
          0 0 0 10px color-mix(in srgb, var(--tom) 25%, transparent);
      }

      /* 1. Fino e limpo: anel de 2px, vão de 4px, sem faixa; no lugar dela, um brilho difuso
            embaixo (como a sombra de um cartão que se ergue) */
      .v-b .foco {
        z-index: 2;
        transform: translateY(-3px);
      }
      .v-b .foco .corpo {
        box-shadow:
          0 0 0 4px var(--cor-fundo),
          0 0 0 6px var(--tom),
          0 14px 26px -10px color-mix(in srgb, var(--tom) 55%, transparent);
      }

      /* 2. Halo difuso: anel de 2.5px mais translúcido e um halo largo e macio, sem faixa dura */
      .v-c .foco {
        z-index: 2;
      }
      .v-c .foco .corpo {
        box-shadow:
          0 0 0 3px var(--cor-fundo),
          0 0 0 5.5px color-mix(in srgb, var(--tom) 85%, transparent),
          0 0 24px 6px color-mix(in srgb, var(--tom) 38%, transparent);
      }

      /* 3. Duplo: filete claro encostado no cartão (cartão do app) e anel de 3px por fora; sobe 2px */
      .v-d .foco {
        z-index: 2;
        transform: translateY(-2px);
      }
      .v-d .foco .corpo {
        box-shadow:
          0 0 0 2px var(--cor-cartao),
          0 0 0 5px var(--tom),
          0 12px 22px -12px color-mix(in srgb, var(--tom) 45%, transparent);
      }

      @media (prefers-reduced-motion: reduce) {
        .materia,
        .corpo {
          transition: none;
        }
        .foco {
          transform: none !important;
        }
      }
    </style>
  </head>
  <body>
    <script type="module">
      import { Sala } from './_sala.js';
      const D = [
        ['GEN', 'Genética', 3, 'prova 1 d'],
        ['IMU', 'Imunologia', 9, 'prova 36 d'],
        ['PRO', 'Propedêutica', 2, 'prova 15 d'],
        ['APS', 'Atenção primária', 1, 'prova 15 d'],
        ['FAR', 'Farmacologia', 2, 'prova 8 d'],
        ['FIS', 'Fisiologia', 42, 'prova 8 d'],
        ['PAT', 'Patologia geral e bases moleculares', 1, 'prova 22 d'],
        ['BIO', 'Bioética', 0, 'prova 15 d'],
      ];
      const cor = [1, 2, 3, 0, 4, 5, 6, 7];
      const v = (id, nome) => ({
        id,
        nome,
        html: () =>
          `<div class="grade v-${id}">${D.map(
            ([s, n, q, p], i) =>
              `<div class="materia ${i === 1 ? 'foco' : ''}" data-materia="${cor[i]}"><span class="corpo"><b class="sigla">${s}</b><span class="nome">${n}</span><span class="rodape"><span>${q} aulas</span><span class="prova">${p}</span></span></span></div>`,
          ).join('')}</div>`,
      });
      Sala.montar({
        titulo: 'Acervo: refinando o foco C (IMU em foco)',
        dados: {},
        variantes: [
          v('a', 'Hoje: anel com faixa de 4px'),
          v('b', '1. Fino e limpo, com brilho embaixo'),
          v('c', '2. Halo difuso e macio'),
          v('d', '3. Duplo: filete claro e anel'),
        ],
      });
    </script>
  </body>
</html>
