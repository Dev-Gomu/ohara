<!doctype html>
<html lang="pt-BR" data-id="anil" data-tema="claro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ardósia refinada: cores de matéria</title>
    <style>
      /* Bancada das 8 cores de matéria (pendência 1 da Ardósia refinada). Tecla T troca o tema. */
      html[data-id='anil'] {
        --cor-materia-4: #e48ae8;
        --cor-materia-2: #5eb6ee;
        --cor-materia-0: #f27a9f;
        --cor-materia-3: #7fdcb0;
        --cor-materia-5: #ab94f4;
        --cor-materia-6: #3fd0c4;
        --cor-violeta: #8aa0f8;
        --cor-materia-1: #8aa0f8;
        --cor-materia-7: #a3b0c4;
        --cor-lima: #b9d86b;
        --cor-damasco: #f2b872;
        --cor-tinta: #0e1428;
        --raio-bloco: 22px;
        --raio-item: 14px;
        --sup-recuada: color-mix(in srgb, var(--cor-cartao) 55%, var(--cor-fundo));
      }
      html[data-id='anil'][data-tema='claro'] {
        color-scheme: light;
        --cor-fundo: #dfe4ea;
        --cor-cartao: #f7f9fb;
        --cor-cartao-2: #e6ebf0;
        --cor-texto: #0f1e27;
        --cor-texto-2: #465a68;
      }
      html[data-id='anil'][data-tema='escuro'] {
        color-scheme: dark;
        --cor-fundo: #0e1519;
        --cor-cartao: #172026;
        --cor-cartao-2: #222e36;
        --cor-texto: #e8f0f4;
        --cor-texto-2: #93a7b3;
      }
      body {
        margin: 0;
        background: var(--cor-fundo);
      }
      .lib {
        width: 1280px;
        box-sizing: border-box;
        padding: 8px;
        display: grid;
        gap: 8px;
        color: var(--cor-texto);
        font: var(--ui-apoio);
      }
      .ficha {
        background: var(--cor-cartao);
        border-radius: var(--raio-bloco);
        padding: 14px 18px 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .titulo {
        font: var(--ui-item);
        font-weight: 700;
      }
      .rotulo {
        font: var(--ui-rotulo);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--cor-texto-2);
      }
      .linha {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .recuada {
        background: var(--sup-recuada);
        border-radius: var(--raio-item);
        padding: 10px 12px;
      }
      .m2 {
        font: var(--ui-sigla);
        letter-spacing: 0.04em;
        color: var(--cor-tinta);
        border-radius: 999px;
        padding: 4px 11px;
      }
      .materia {
        flex: 1;
        height: 104px;
        box-sizing: border-box;
        border-radius: var(--raio-item);
        padding: 12px 14px;
        color: var(--cor-tinta);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .materia b {
        font: 800 30px/32px var(--fonte-voz);
      }
    </style>
  </head>
  <body>
    <main class="lib" id="lib"></main>

    <script type="module">
      import '../src/ui/styles/fonts.css';
      import '../src/ui/styles/tokens.css';

      const SIGLAS = ['GEN', 'IMU', 'PRO', 'APS', 'FAR', 'PAT', 'HIS', 'OPT'];
      // Os nomes antigos viraram posições (--cor-materia-N); lima, damasco e violeta seguem definidos acima.
      const NOMES = { rosa: 'materia-4', azul: 'materia-2', laranja: 'materia-0', verde: 'materia-3', amarelo: 'materia-5', ciano: 'materia-6', 'cinza-lavanda': 'materia-7' };
      const VERSOES = [
        {
          nome: 'A · Hoje (com rosa magenta e cinza)',
          cores: [
            'rosa',
            'azul',
            'laranja',
            'verde',
            'amarelo',
            'ciano',
            'violeta',
            'cinza-lavanda',
          ],
        },
        {
          nome: 'B · Proposta (lima no lugar do magenta, damasco no lugar do cinza)',
          cores: ['lima', 'azul', 'laranja', 'verde', 'amarelo', 'ciano', 'violeta', 'damasco'],
        },
      ];
      const pilulas = (cores) =>
        cores
          .map((c, i) => `<span class="m2" style="background: var(--cor-${NOMES[c] ?? c})">${SIGLAS[i]}</span>`)
          .join('');
      document.getElementById('lib').innerHTML = VERSOES.map(
        (v) => `
        <section class="ficha">
          <div class="titulo">${v.nome}</div>
          <div class="linha">
            <span class="rotulo">No cartão</span>${pilulas(v.cores)}
            <span class="linha recuada"><span class="rotulo">No bloco recuado</span>${pilulas(v.cores)}</span>
          </div>
          <div class="linha">${v.cores
            .map(
              (c, i) =>
                `<div class="materia" style="background: var(--cor-${NOMES[c] ?? c})"><b>${SIGLAS[i]}</b><small>12 aulas</small></div>`,
            )
            .join('')}</div>
        </section>`,
      ).join('');

      const raiz = document.documentElement;
      const tema = new URLSearchParams(location.search).get('tema');
      if (tema) raiz.dataset.tema = tema;
      document.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 't')
          raiz.dataset.tema = raiz.dataset.tema === 'escuro' ? 'claro' : 'escuro';
      });
    </script>
  </body>
</html>
