<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Foco no bloco de provas</title>
    <style>
      .par { display: grid; gap: var(--e3); margin-bottom: var(--e5); }
      .par small { color: var(--cor-texto-2); font: var(--ui-apoio); }
      .bloco { padding: 0; height: 150px; border-radius: var(--raio-bloco); background: transparent; display: flex; }
      .provas { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--vao-mosaico); }
      .prova { display: grid; border-radius: var(--raio-bloco); }
      .cartao { display: grid; grid-template-rows: 40px 1fr; overflow: hidden; border-radius: var(--raio-bloco); background: var(--cor-cartao); color: var(--cor-texto); }
      .faixa { display: flex; align-items: center; justify-content: space-between; padding: 0 var(--e4); font: var(--ui-rotulo); letter-spacing: .06em; text-transform: uppercase;
        background: color-mix(in srgb, var(--cor-destaque) var(--mistura-faixa), var(--cor-cartao)); transition: none; }
      .corpo { padding: var(--e4); font: var(--voz-numero); font-size: 48px; }
      .prova:first-child .faixa { background: var(--cor-destaque); color: var(--cor-tinta); }

      /* Hoje: contorno do bloco + anel escuro do cartão */
      .a.nivel-bloco .bloco { outline: 4px solid var(--cor-contorno-foco); outline-offset: -4px; }
      .a.nivel-dentro .bloco { box-shadow: inset 0 0 0 2px var(--cor-cursor); }
      .a .foco { outline: 3px solid var(--cor-foco); outline-offset: 3px; }

      /* B: sem contorno no bloco; cartão em foco só ganha faixa forte */
      .b .prova.foco .faixa { background: var(--cor-cursor); color: var(--cor-sobre-acao); }
      .b.nivel-bloco .faixa { }
      /* No nível bloco o cursor ainda aparece no primeiro cartão, mas sem o resto */

      /* C: contorno fino de 2px por dentro, só no cartão; bloco sem contorno */
      .c .prova.foco .cartao { outline: 2px solid var(--cor-cursor); outline-offset: -2px; }

      /* D: faixa forte + contorno fino */
      .d .prova.foco .faixa { background: var(--cor-cursor); color: var(--cor-sobre-acao); }
      .d .prova.foco .cartao { outline: 2px solid var(--cor-cursor); outline-offset: -2px; }

      /* E: por nível. Bloco: todas as faixas na cor ativa (o bloco "acende"). Dentro: só o cartão em foco acende, com contorno fino */
      .e.nivel-bloco .faixa { background: var(--cor-cursor); color: var(--cor-sobre-acao); }
      .e.nivel-dentro .prova.foco .faixa { background: var(--cor-cursor); color: var(--cor-sobre-acao); }
      .e.nivel-dentro .prova.foco .cartao { outline: 2px solid var(--cor-cursor); outline-offset: -2px; }
    </style>
  </head>
  <body>
    <script type="module">
      import { Sala } from './_sala.js';
      const cartoes = (foco) => [['seg · nov', 'hoje', '08'], ['ter · nov', 'em 1 d', '09'], ['qui · nov', 'em 3 d', '11'], ['sex · nov', 'em 4 d', '12']]
        .map(([q, p, d], i) => `<div class="prova ${i === foco ? 'foco' : ''}"><span class="cartao"><span class="faixa"><span>${q}</span><span>${p}</span></span><span class="corpo">${d}</span></span></div>`).join('');
      const par = (cls, foco) => `<div class="par ${cls}">
          <small>Nível bloco (Alt+tecla)</small><div class="nivel-bloco ${cls}"><div class="bloco"><div class="provas">${cartoes(foco)}</div></div></div>
          <small>Dentro do bloco (Enter), 2º cartão</small><div class="nivel-dentro ${cls}"><div class="bloco"><div class="provas">${cartoes(1)}</div></div></div></div>`;
      const v = (id, nome, cls) => ({ id, nome, html: () => `<div class="${cls}">${par(cls, -1).replaceAll('class="par ' + cls, 'class="par')}</div>` });
      Sala.montar({
        titulo: 'Foco no bloco de provas',
        dados: {},
        variantes: [
          v('a', 'A. Hoje (conflito)', 'a'),
          v('b', 'B. Só faixa forte', 'b'),
          v('c', 'C. Só contorno fino 2px', 'c'),
          v('d', 'D. Faixa forte + contorno fino', 'd'),
          v('e', 'E. Por nível: bloco acende as faixas; dentro, cartão com faixa + fio', 'e'),
        ],
      });
    </script>
  </body>
</html>
