<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acervo 2: cartão de matéria</title>
    <style>
      /* Foco usado em todas: E da etapa 1 (4px de cor de foco por dentro), no 2º cartão */
      .grade { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--vao-mosaico); padding: 8px; }
      .materia { display: grid; height: 200px; border-radius: var(--raio-bloco); }
      .foco .corpo { box-shadow: inset 0 0 0 4px var(--cor-foco); }
      .corpo { display: flex; flex-direction: column; min-width: 0; padding: var(--bloco-pad-y) var(--bloco-pad-x); border-radius: var(--raio-bloco);
        background: var(--cor-materia); color: var(--cor-tinta); text-align: left; }
      .pil { padding: 2px 10px; border-radius: var(--raio-pilula); background: var(--cor-tinta); color: var(--cor-sobre-tinta); font: var(--ui-sigla); white-space: nowrap; }
      .corpo > .pil { align-self: flex-start; }
      .pil.leve { background: color-mix(in srgb, var(--cor-tinta) 16%, transparent); color: var(--cor-tinta); }
      .nome { font: var(--voz-titulo); text-transform: uppercase; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .mini { font: var(--ui-item); }
      .rodape { display: flex; align-items: center; justify-content: space-between; gap: var(--e2); font: var(--ui-item); }
      .grande { font: var(--voz-numero); font-size: 64px; line-height: 1; letter-spacing: -0.02em; font-weight: 300; }
      .vao { flex: 1; }

      /* A: sigla em pílula + nome grande; contagem some do centro e vira linha pequena */
      /* B: legado, sigla enorme e fina, nome pequeno, rodapé com fundo mais escuro */
      .v-b .corpo { padding: 0; justify-content: space-between; overflow: hidden; }
      .v-b .topo { padding: var(--bloco-pad-y) var(--bloco-pad-x) 0; display: grid; gap: var(--e1); }
      .v-b .nome { font: var(--ui-rotulo); letter-spacing: .08em; }
      .v-b .rodape { padding: var(--e3) var(--bloco-pad-x); background: color-mix(in srgb, var(--cor-tinta) 22%, transparent); }
      /* C: sigla grande e fina; rodapé sem fundo (sem tarja) com horário e prova */
      .v-c .topo { display: grid; gap: var(--e1); }
      .v-c .nome { font: var(--ui-rotulo); letter-spacing: .08em; }
      /* D: tom mais fundo (mistura com tinta), texto claro, sigla grande */
      .v-d .corpo { background: color-mix(in srgb, var(--cor-materia) 62%, var(--cor-tinta)); color: var(--cor-sobre-tinta); }
      .v-d .pil { background: var(--cor-materia); color: var(--cor-tinta); }
      .v-d .pil.leve { background: color-mix(in srgb, var(--cor-sobre-tinta) 18%, transparent); color: var(--cor-sobre-tinta); }
      .v-d .foco .corpo { box-shadow: inset 0 0 0 4px var(--cor-sobre-tinta); }
      .v-d .topo { display: grid; gap: var(--e1); }
      .v-d .nome { font: var(--ui-rotulo); letter-spacing: .08em; }
      /* E: composição da C; claro com a cor cheia, escuro com a cor mais funda e texto claro (pastel cheio ofusca no escuro) */
      .v-e .topo { display: grid; gap: var(--e1); }
      .v-e .nome { font: var(--ui-rotulo); letter-spacing: .08em; }
      :root[data-tema='escuro'] .v-e .corpo { background: color-mix(in srgb, var(--cor-materia) 62%, var(--cor-tinta)); color: var(--cor-sobre-tinta); }
      :root[data-tema='escuro'] .v-e .pil.leve { background: color-mix(in srgb, var(--cor-sobre-tinta) 18%, transparent); color: var(--cor-sobre-tinta); }
    </style>
  </head>
  <body>
    <script type="module">
      import { Sala } from './_sala.js';
      const D = [
        ['GEN', 'Genética', 3, 'Seg · 10:00', 'prova em 1 d'],
        ['IMU', 'Imunologia', 9, 'Seg · 14:00', 'prova em 36 d'],
        ['PRO', 'Propedêutica', 2, 'Qui · 13:00', 'prova em 15 d'],
        ['APS', 'Atenção primária', 1, 'Sex · 14:00', 'prova em 15 d'],
        ['FAR', 'Farmacologia', 2, 'Ter · 10:00', 'prova em 8 d'],
        ['FIS', 'Fisiologia', 42, 'Sex · 10:00', 'prova em 8 d'],
        ['PAT', 'Patologia geral e bases moleculares', 1, 'Qui · 15:00', 'prova em 22 d'],
        ['BIO', 'Bioética', 0, 'Sex · 08:00', 'prova em 15 d'],
      ];
      const aulas = (n) => `${n} ${n === 1 ? 'aula' : 'aulas'}`;
      const miolo = {
        a: ([s, n, q, h, p]) => `<span class="pil">${s}</span><span class="vao"></span><b class="nome">${n}</b><span class="mini">${aulas(q)} · ${h}</span><span class="mini">${p}</span>`,
        b: ([s, n, q, h, p]) => `<span class="topo"><span class="grande">${s}</span><b class="nome">${n}</b></span><span class="rodape"><span>${h}</span><span class="pil leve">${p}</span></span>`,
        c: ([s, n, q, h, p]) => `<span class="topo"><span class="grande">${s}</span><b class="nome">${n}</b></span><span class="vao"></span><span class="rodape"><span>${aulas(q)} · ${h}</span><span class="pil leve">${p.replace('prova em ', '')}</span></span>`,
        e: ([s, n, q, h, p]) => `<span class="topo"><span class="grande">${s}</span><b class="nome">${n}</b></span><span class="vao"></span><span class="rodape"><span>${aulas(q)} · ${h}</span><span class="pil leve">${p.replace('prova em ', '')}</span></span>`,
        d: ([s, n, q, h, p]) => `<span class="topo"><span class="grande">${s}</span><b class="nome">${n}</b></span><span class="vao"></span><span class="rodape"><span>${aulas(q)} · ${h}</span><span class="pil leve">${p.replace('prova em ', '')}</span></span>`,
      };
      const v = (id, nome) => ({ id, nome, html: () => `<div class="grade v-${id}">${D.map((d, i) =>
        `<div class="materia ${i === 1 ? 'foco' : ''}"><span class="corpo" data-materia="${i}">${miolo[id](d)}</span></div>`).join('')}</div>` });
      Sala.montar({
        titulo: 'Acervo 2: cartão de matéria (2º cartão em foco)',
        dados: {},
        variantes: [v('a', 'A. Sigla em pílula, nome grande'), v('b', 'B. Legado: sigla enorme, rodapé tonal'), v('c', 'C. Sigla enorme, rodapé sem fundo'), v('d', 'D. Cor mais funda, texto claro'), v('e', 'E. C no claro, cor funda no escuro')],
      });
    </script>
  </body>
</html>
