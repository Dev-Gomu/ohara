<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Acervo na identidade Giz A</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Nunito:wght@700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="giz-a.css">
<style>
/* ?v=inicio (anos + matérias) | ?v=materia (pastas + aulas + prévia). Foco: ?foco=grade|regua|lista|previa */
.btn{height:44px;border-radius:8px;display:inline-flex;align-items:center;gap:10px;padding:0 20px;background:var(--acao);color:var(--sobre-acao);font:700 14px/20px var(--ui);white-space:nowrap}
.btn .k{font-weight:600;opacity:.7}
.regua{display:flex;gap:8px;height:68px;flex:none}
.faixa{flex:1;display:flex;flex-direction:row;gap:8px;align-items:center;padding:0 12px;overflow:hidden}
.chip{height:44px;border-radius:999px;padding:0 18px;display:inline-flex;align-items:center;gap:8px;background:var(--cartao2);color:var(--texto);font:600 14px/20px var(--ui);flex:none}
.chip small{color:var(--texto2);font:500 12.5px/16px var(--ui)}
.chip.on{background:var(--texto);color:var(--fundo)} .chip.on small{color:inherit;opacity:.75}
.chip.novo{background:transparent;border:2px dashed var(--texto2);color:var(--texto2)}
.busca{width:380px;display:flex;flex-direction:row;align-items:center;justify-content:space-between;padding:0 18px;color:var(--texto2);font:500 15px/20px var(--ui);flex:none}
.busca .tecla{margin-left:0}

/* início: grade de matérias */
.grade{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;gap:8px}
.mat{background:var(--cartao);border:1px solid var(--linha);border-radius:14px;padding:16px 18px 18px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;overflow:hidden}
.mat .topo{display:flex;align-items:center;justify-content:space-between}
.mat .tag{font-size:13px;line-height:22px;padding:1px 10px}
.mat .n{font:800 56px/52px var(--voz);letter-spacing:-.03em;display:flex;align-items:baseline;gap:8px}
.mat .n small{font:600 14px/20px var(--ui);color:var(--texto2);letter-spacing:0}
.mat .nome{font:800 19px/23px var(--voz);margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prazo{height:22px;padding:0 10px;border-radius:999px;background:var(--cartao2);color:var(--texto2);font:600 12px/22px var(--ui)}
.mat.vazio{background:transparent;border:2px dashed var(--texto2)}
.mat.vazio .n{color:var(--texto2)}
.mat.foco{box-shadow:inset 0 0 0 4px var(--foco)}

/* matéria aberta */
.corpo{flex:1;min-height:0;display:grid;grid-template-columns:1.25fr 1fr;gap:8px}
.lista{overflow:hidden}
.aula{height:60px;border-radius:10px;display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:0 14px;flex:none;margin-bottom:4px;background:var(--cartao2)}
.aula .nn{font:700 13px/20px var(--ui);color:var(--texto2)}
.aula .tt{font:800 16px/20px var(--voz);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aula .dd{font:500 13px/20px var(--ui);color:var(--texto2)}
.aula.sel{background:var(--marca)}
.aula.sel .dd,.aula.sel .nn{color:var(--texto)}
.aula.foco{box-shadow:inset 0 0 0 4px var(--foco)}
.previa{padding:16px}
.capa{height:210px;border-radius:10px;background:var(--cartao2);display:flex;flex-direction:column;justify-content:flex-end;padding:16px;gap:6px;flex:none}
.capa .tag{align-self:flex-start}.capa b{font:800 22px/26px var(--voz)} .capa span{font:400 15.5px/22px var(--leitura);color:var(--texto2)}
.dados{display:flex;gap:8px;margin:12px 0}
.dado{flex:1;border-radius:10px;background:var(--cartao2);padding:10px 12px}
.dado b{display:block;font:800 24px/26px var(--voz)} .dado small{font:500 12.5px/16px var(--ui);color:var(--texto2)}
.foco-bloco{box-shadow:inset 0 0 0 4px var(--foco)}
.faixa.foco-bloco,.peca.foco-bloco{box-shadow:inset 0 0 0 4px var(--foco)}
</style>
<link rel="stylesheet" href="giz-a-suave.css">
</head>
<body>
<div class="stage" id="s"></div>
<script>
const P=new URLSearchParams(location.search);const v=P.get('v')??'inicio';const foco=P.get('foco')??(v==='inicio'?'grade':'lista');
if(!document.documentElement.dataset.tema)document.documentElement.dataset.tema=P.get('tema')??'claro';
const MAT={GEN:'Genética',IMU:'Imunologia',PRO:'Propedêutica',APS:'Atenção Primária',FAR:'Farmacologia',FIS:'Fisiologia',PAT:'Patologia Geral e Bases Moleculares da Doença',BIO:'Bioética'};
const tag=k=>`<span class="tag m-${k}">${k}</span>`;
const barra=(at,t,extra='')=>`<div class="barra">${[1,2,3,4,5,6].map(n=>`<span class="num ${n===at?'at':''}">${n}</span>`).join('')}<h1>${t}</h1><div class="fim">${extra}<span class="pil">Faltas</span><span class="pil">Notas</span><span class="pil" style="padding:0;width:44px;justify-content:center">?</span></div></div>`;
const MATS=[['GEN',3,7],['IMU',8,11],['PRO',2,11],['APS',1,20],['FAR',2,25],['FIS',42,null],['PAT',1,null],['BIO',0,null]];
const card=(m,i)=>`<div class="mat ${m[1]===0?'vazio':''} ${foco==='grade'&&i===1?'foco':''}"><div class="topo">${tag(m[0])}${m[2]?`<span class="prazo">prova em ${m[2]} d</span>`:''}</div>
 <div><div class="n">${m[1]}<small>${m[1]===1?'aula':'aulas'}</small></div><div class="nome">${MAT[m[0]]}</div></div></div>`;
const inicio=()=>`${barra(3,'Acervo')}
 <div class="regua"><div class="faixa peca ${foco==='regua'?'foco-bloco':''}"><span class="chip"><span>1º ano</span><small>arquivado</small></span><span class="chip on">2º ano</span><span class="chip">3º ano</span><span class="chip novo">+</span></div>
  <div class="busca peca"><span>Buscar matéria, aula ou cartão</span><span class="tecla">Alt F</span></div></div>
 <div class="grade">${MATS.map(card).join('')}</div>`;
const AULAS=[['Resposta inflamatória aguda','08 nov','2º bim'],['Imunidade inata','05 nov','2º bim'],['Sistema complemento','01 nov','2º bim'],['Citocinas e quimiocinas','29 out','2º bim'],['Complexo de histocompatibilidade','25 out','1º bim'],['Linfócitos T','22 out','1º bim'],['Linfócitos B e anticorpos','18 out','1º bim'],['Hipersensibilidade','15 out','1º bim']];
const aula=(a,i)=>`<div class="aula ${i===0?'sel':''} ${foco==='lista'&&i===0?'foco':''}"><span class="nn">Aula ${8-i}</span><span class="tt">${a[0]}</span><span class="dd">${a[1]}</span></div>`;
const materia=()=>`${barra(3,'Imunologia','<span class="pil">Acervo <span class="tecla" style="margin-left:6px">Esc</span></span>')}
 <div class="regua"><div class="faixa peca ${foco==='regua'?'foco-bloco':''}"><span class="chip on">Todas <small>8</small></span><span class="chip">1º bim <small>4</small></span><span class="chip">2º bim <small>4</small></span><span class="chip">Sem bimestre</span><span class="chip novo">+ Nova pasta</span></div>
  <div class="busca peca" style="width:200px;justify-content:center;gap:8px"><b style="font:800 16px var(--voz);color:var(--texto)">Aulas</b><span>Cartões</span></div></div>
 <div class="corpo"><div class="peca lista"><div class="cab"><span class="rot">Aulas<b>8</b></span><span class="tecla">Alt N novo</span></div>${AULAS.map(aula).join('')}</div>
  <div class="peca previa ${foco==='previa'?'foco-bloco':''}"><div class="cab"><span class="rot">Prévia</span></div>
   <div class="capa">${tag('IMU')}<b>Resposta inflamatória aguda</b><span>08 de novembro · 2º bimestre</span></div>
   <div class="dados"><div class="dado"><b>12</b><small>slides</small></div><div class="dado"><b>3</b><small>anotações</small></div><div class="dado"><b>24</b><small>cartões</small></div></div>
   <span class="btn" style="margin-top:auto;justify-content:center">Abrir na Mesa <span class="k">Enter</span></span></div></div>`;
document.getElementById('s').innerHTML=v==='inicio'?inicio():materia();
</script>
</body>
</html>
