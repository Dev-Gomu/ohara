<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Treino: grade refinada</title>
    <style>
      .tela {
        display: grid;
        place-items: start center;
        padding-top: var(--e2);
      }
      .cartao {
        width: min(760px, 100%);
        padding: var(--e5) var(--e6) var(--e5);
        border-radius: var(--raio-bloco);
        background: var(--cor-cartao);
        border: 2px solid var(--cor-bloco-ativo);
        display: grid;
        justify-items: center;
        gap: var(--e1);
      }
      .rotulo {
        color: var(--cor-texto-2);
        font: var(--ui-rotulo);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .numero {
        font: var(--voz-numero);
        font-size: 88px;
        line-height: 80px;
        margin-top: var(--e1);
      }
      .legenda {
        color: var(--cor-texto-2);
        font: var(--leitura-texto);
      }
      .recorte {
        font: var(--voz-item);
        margin-top: var(--e2);
      }
      .infos {
        display: flex;
        gap: var(--e2);
        margin: var(--e2) 0 var(--e3);
      }
      .info {
        padding: 0 var(--e4);
        height: 36px;
        display: grid;
        align-content: center;
        border-radius: var(--raio-pilula);
        background: var(--cor-cartao-2);
        font: var(--ui-item);
      }
      .iniciar {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 52px;
        padding: 0 var(--e6);
        border-radius: var(--raio-botao);
        background: var(--cor-botao);
        color: var(--cor-sobre-botao);
        font: var(--ui-botao);
      }
      .iniciar kbd {
        font: var(--ui-tecla);
        opacity: 0.75;
      }
      .ajustar {
        padding: var(--e2) var(--e4);
        font: var(--ui-item);
      }
      .bloco {
        width: 100%;
        display: grid;
        gap: var(--e2);
        margin-top: var(--e2);
      }
      .topo {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 32px;
      }
      .regua {
        display: flex;
        padding: var(--e1);
        border-radius: var(--raio-pilula);
        background: var(--cor-cartao-2);
      }
      .regua span {
        flex: 1;
        text-align: center;
        height: 40px;
        display: grid;
        align-content: center;
        border-radius: var(--raio-pilula);
        font: var(--ui-item);
      }
      .regua span[data-sel='true'] {
        background: var(--cor-marca);
      }

      .sigla {
        display: inline-grid;
        align-content: center;
        height: 24px;
        padding: 0 var(--e3);
        border-radius: var(--raio-pilula);
        color: var(--cor-tinta);
        font: var(--ui-sigla);
      }
      .grade {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: var(--e2);
      }
      .cel {
        display: grid;
        justify-items: center;
        align-content: center;
        gap: 4px;
        min-height: 76px;
        padding: var(--e2) var(--e1);
        border-radius: var(--raio-item);
        background: var(--cor-cartao-2);
      }
      .cel b {
        font: var(--voz-mini);
      }
      .cel small {
        color: var(--cor-texto-2);
        font: var(--ui-apoio);
      }
      .cel.dia {
        min-height: 64px;
      }
      .cel[data-sel='true'] {
        background: var(--cor-marca);
      }
      .cel.foco {
        outline: 4px solid var(--cor-contorno-foco);
        outline-offset: -4px;
      }
      .cel.fora:not([data-sel='true']) {
        opacity: 0.35;
      }
      .cel.todas {
        grid-column: span 1;
      }
      .grupo {
        color: var(--cor-texto-2);
        font: var(--ui-rotulo);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin-top: var(--e1);
      }

      .filtro {
        display: flex;
        align-items: center;
        gap: var(--e2);
        height: 40px;
        padding: 0 var(--e4);
        border-radius: var(--raio-pilula);
        background: var(--cor-cartao-2);
        font: var(--ui-item);
      }
      .filtro[data-vazio='true'] {
        color: var(--cor-texto-2);
        font-weight: 500;
      }
      .filtro .cursor {
        width: 2px;
        height: 18px;
        background: var(--cor-texto);
      }
      .filtro kbd {
        margin-left: auto;
        color: var(--cor-texto-2);
        font: var(--ui-tecla);
      }
      .filtro[data-vazio='false'] {
        outline: 2px solid var(--cor-bloco-ativo);
        outline-offset: -2px;
      }
      .contagem {
        color: var(--cor-texto-2);
        font: var(--ui-apoio);
      }
      .mais {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--e2);
        height: 44px;
        border-radius: var(--raio-pilula);
        background: var(--cor-cartao-2);
        color: var(--cor-texto-2);
        font: var(--ui-item);
      }
      .dica {
        color: var(--cor-texto-2);
        font: var(--ui-apoio);
      }
      .dica kbd {
        font: var(--ui-tecla);
        padding: 0 var(--e2);
        border-radius: var(--raio-minimo);
        background: var(--cor-cartao-2);
        color: var(--cor-texto);
      }
    
      /* ajuste de altura: o cartão precisa caber em 1280 x 800 com a barra de 48 px */
      .numero { font: var(--voz-numero); margin-top: 0; }
      .infos { margin: var(--e1) 0 var(--e2); }
      .cel { min-height: 64px; gap: 2px; }
      .cel.dia { min-height: 52px; }
      .dica { display: none; }
      .cartao { padding: var(--e4) var(--e6) var(--e4); }
          .regua span { height: 36px; }
      .iniciar { min-height: 48px; }
      .ajustar { padding: var(--e1) var(--e4); }
      .bloco { margin-top: var(--e1); }
          .topo { gap: var(--e4); }
      .topo .filtro { flex: 1; }
      .filtro .contagem { margin-left: auto; }
      .filtro kbd { margin-left: var(--e3); }
    </style>
  </head>
  <body>
    <script type="module">
      import { Sala } from './_sala.js';
      const CORES = [
        'destaque',
        'laranja',
        'azul',
        'verde',
        'rosa',
        'amarelo',
        'ciano',
        'cinza-lavanda',
      ];
      const BASE = [
        ['IMU', 'Imunologia', 10],
        ['GEN', 'Genética', 4],
        ['PRO', 'Processos patológicos', 7],
        ['APS', 'Atenção primária', 0],
        ['PSI', 'Psicologia médica', 3],
        ['ANA', 'Anatomia', 12],
        ['FIS', 'Fisiologia', 5],
        ['BIO', 'Bioquímica', 0],
        ['HIS', 'Histologia', 2],
        ['EMB', 'Embriologia', 6],
        ['FAR', 'Farmacologia', 9],
        ['PAT', 'Patologia geral', 1],
        ['SEM', 'Semiologia', 8],
        ['ETI', 'Ética médica', 0],
      ];
      const EXTRA = [
        'MIC',
        'PAR',
        'EPI',
        'BIE',
        'RAD',
        'NEU',
        'CAR',
        'PNE',
        'NEF',
        'GAS',
        'END',
        'HEM',
        'DER',
        'OFT',
        'ORL',
        'URO',
      ];
      const todos = (n) =>
        [...BASE, ...EXTRA.slice(0, n).map((s, i) => [s, s, i % 4 === 0 ? 3 : 0])].map(
          ([s, nome, d], i) => ({ s, nome, d, cor: `var(--cor-${CORES[i % CORES.length]})` }),
        );
      const porUrgencia = (lista) => [...lista].sort((a, b) => b.d - a.d);
      const sigla = (m) => `<span class="sigla" style="background:${m.cor}">${m.s}</span>`;
      const cel = (m, { sel = false, foco = false, fora = false } = {}) =>
        `<span class="cel${m.d ? '' : ' dia'}${foco ? ' foco' : ''}${fora ? ' fora' : ''}" ${sel ? 'data-sel="true"' : ''}>${sigla(m)}${m.d ? `<b>${m.d}</b><small>hoje</small>` : '<small>em dia</small>'}</span>`;
      const todasCel = (sel, foco) =>
        `<span class="cel todas${foco ? ' foco' : ''}" ${sel ? 'data-sel="true"' : ''}><b>Todas</b><b>36</b><small>hoje</small></span>`;

      const cabeca = `
        <span class="rotulo">Sua sessão</span><span class="numero">10</span><span class="legenda">cartões para hoje</span>
        <span class="recorte">Imunologia · 4º bimestre</span>
        <div class="infos"><span class="info">10 de 42 no recorte</span><span class="info">Mais antigos primeiro</span></div>
        <span class="iniciar">▷ Iniciar treino <kbd>Enter</kbd></span>
        <span class="ajustar">Ajustar o que treinar ›</span>`;
      const periodo = `<div class="bloco"><span class="rotulo">Estudar</span><div class="regua"><span>Todos</span><span>Ano 2026</span><span>Semestre atual</span><span data-sel="true">Bimestre atual</span></div></div>`;
      const moldura = (disc) =>
        `<div class="tela"><div class="cartao">${cabeca}${periodo}${disc}</div></div>`;
      const filtro = (texto, total, achados) =>
        `<div class="topo"><span class="rotulo">Disciplina</span><div class="filtro" data-vazio="${texto ? 'false' : 'true'}">${texto ? `${texto}<span class="cursor"></span>` : 'Digite a sigla ou o nome'}<span class="contagem">${texto ? `${achados} de ${total}` : `${total} disciplinas`}</span><kbd>${texto ? 'Esc limpa' : '/'}</kbd></div></div>`;

      // 1. Grade por urgência: vencidas primeiro, "em dia" mais baixas no fim
      const v1 = () => {
        const l = porUrgencia(todos(0));
        const hoje = l.filter((m) => m.d),
          dia = l.filter((m) => !m.d);
        return `<div class="bloco"><div class="topo"><span class="rotulo">Disciplina</span><span class="contagem">${l.length} disciplinas</span></div>
          <div class="grade">${todasCel(false, false)}${hoje.map((m) => cel(m, { sel: m.s === 'IMU', foco: m.s === 'IMU' })).join('')}</div>
          <span class="grupo">Em dia</span>
          <div class="grade">${dia.map((m) => cel(m)).join('')}</div>
          <span class="dica"><kbd>←</kbd> <kbd>→</kbd> <kbd>↑</kbd> <kbd>↓</kbd> andam e trocam na hora · as sem cartão vencido ficam embaixo, discretas.</span></div>`;
      };
      // 2. Mesma grade com digitação que filtra ("pa" → PRO e PAT)
      const v2 = () => {
        const l = porUrgencia(todos(0));
        const casa = (m) => `${m.s} ${m.nome}`.toLowerCase().includes('pa');
        const achados = l.filter(casa);
        const hoje = l.filter((m) => m.d),
          dia = l.filter((m) => !m.d);
        const marca = (m) =>
          cel(m, { sel: m.s === 'IMU', foco: m.s === achados[0]?.s, fora: !casa(m) });
        return `<div class="bloco">${filtro('pa', l.length, achados.length)}
          <div class="grade">${todasCel(false, false).replace('cel todas', 'cel todas fora')}${hoje.map(marca).join('')}</div>
          <span class="grupo">Em dia</span><div class="grade">${dia.map(marca).join('')}</div>
          <span class="dica">As que casam ficam acesas e o foco vai para a primeira · <kbd>Enter</kbd> escolhe · <kbd>Esc</kbd> limpa. Selecionada continua marcada.</span></div>`;
      };
      // 3. Escala: 30 disciplinas, só as duas primeiras linhas por urgência e o resto atrás da digitação
      const v3 = () => {
        const l = porUrgencia(todos(16));
        const vis = l.slice(0, 13);
        const resto = l.length - vis.length;
        return `<div class="bloco">${filtro('', l.length, l.length)}
          <div class="grade">${todasCel(false, false)}${vis.map((m) => cel(m, { sel: m.s === 'IMU', foco: m.s === 'IMU' })).join('')}</div>
          <span class="mais">+ ${resto} em dia · digite para buscar</span>
          <span class="dica">Passa de 14? A grade para em duas linhas e o campo traz as outras. Nunca vira rolagem dentro da grade.</span></div>`;
      };

      Sala.montar({
        titulo: 'Treino: grade refinada',
        dados: {},
        variantes: [
          { id: 'a', nome: '1. Grade por urgência', html: () => moldura(v1()) },
          { id: 'b', nome: '2. Grade + digitação filtra', html: () => moldura(v2()) },
          { id: 'c', nome: '3. Grade com teto, 30 disciplinas', html: () => moldura(v3()) },
        ],
      });
    </script>
  </body>
</html>
