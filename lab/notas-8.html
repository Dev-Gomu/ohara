<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notas: barra de disciplinas</title>
    <style>
      .tela {
        height: auto;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        gap: var(--vao-mosaico);
        padding: var(--vao-mosaico);
        background: var(--cor-fundo);
        color: var(--cor-texto);
      }
      .barra {
        display: flex;
        align-items: center;
        gap: var(--e3);
        height: 40px;
        padding-left: var(--e1);
      }
      .barra .num {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--cor-cartao);
        font: var(--ui-botao);
        color: var(--cor-texto-2);
      }
      .barra .num[data-sel='true'] {
        background: var(--cor-destaque);
        color: var(--cor-tinta);
      }
      .barra h2 {
        margin-left: var(--e2);
        font: var(--voz-titulo);
        letter-spacing: 0.02em;
      }
      .cartao {
        background: var(--cor-cartao);
        border-radius: var(--raio-bloco);
        padding: var(--e5) var(--e6);
        min-width: 0;
        min-height: 0;
      }
      .cartao.ativo {
        border: var(--borda-bloco) solid var(--cor-bloco-ativo);
        padding: calc(var(--e5) - 2px) calc(var(--e6) - 2px);
      }
      .rotulo {
        color: var(--cor-texto-2);
        font: var(--ui-rotulo);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .apoio {
        color: var(--cor-texto-2);
        font: var(--ui-apoio);
      }
      kbd {
        font: var(--ui-tecla);
        color: var(--cor-texto-2);
      }
      .num-t {
        font-family: var(--fonte-interface);
        font-variant-numeric: tabular-nums;
      }
      .baixa {
        background: color-mix(in srgb, var(--cor-laranja) 30%, var(--cor-cartao));
      }

      /* cabeçalho de tela */
      .topo {
        display: flex;
        align-items: center;
        gap: var(--e5);
        padding: 0 var(--e2);
        height: 48px;
      }
      .abas {
        display: flex;
        gap: var(--e5);
      }
      .abas span {
        font: var(--ui-botao);
        color: var(--cor-texto-2);
        padding: var(--e2) 0;
      }
      .abas span[data-sel='true'] {
        color: var(--cor-texto);
        box-shadow: inset 0 -3px 0 var(--cor-bloco-ativo);
      }
      .topo .fim {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: var(--e4);
        font: var(--ui-apoio);
        color: var(--cor-texto-2);
      }
      .topo .ano {
        font: var(--voz-item);
        color: var(--cor-texto);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: var(--e2);
        height: 40px;
        padding: 0 var(--e4);
        border-radius: var(--raio-pilula);
        background: var(--cor-cartao);
        font: var(--ui-botao);
        color: var(--cor-texto);
      }

      .disc {
        display: flex;
        align-items: center;
        gap: var(--e3);
        min-width: 0;
      }
      .pt {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex: none;
      }
      .cod {
        width: 36px;
        color: var(--cor-texto-2);
        font: var(--ui-sigla);
        letter-spacing: 0.04em;
      }
      .nm {
        font: var(--ui-botao);
        font-weight: 600;
        white-space: nowrap;
      }
      .sit {
        display: inline-flex;
        align-items: center;
        gap: var(--e2);
        font: var(--ui-item);
        white-space: nowrap;
      }
      .sit i {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: var(--cor-tinta);
      }
      .sit i svg {
        width: 11px;
        height: 11px;
      }
      .sit.ok i {
        background: var(--cor-verde);
      }
      .sit.at i {
        background: var(--cor-laranja);
      }
      .sit.nd {
        color: var(--cor-texto-2);
      }
      .foco {
        outline: var(--contorno-foco) solid var(--cor-contorno-foco);
        outline-offset: -4px;
      }
      .sel {
        background: var(--cor-marca);
      }

      
      .quadro { display: grid; gap: var(--e5); padding: var(--e3); }
      .quadro > .rotulo { margin-bottom: calc(var(--e3) * -1); }
      .regua { display: flex; align-items: center; gap: var(--e1); padding: var(--e3) var(--e4); border-radius: var(--raio-bloco); background: var(--cor-cartao); overflow: hidden; }
      .ri { display: flex; align-items: center; gap: var(--e2); height: 48px; padding: 0 var(--e4); border-radius: var(--raio-item); font: 700 15px/20px var(--fonte-interface); white-space: nowrap; flex: none; }
      .ri .m { font-weight: 500; color: var(--cor-texto-2); font-variant-numeric: tabular-nums; }
      .ri[data-sel='true'] { background: var(--cor-marca); }
      .ri[data-sel='true'] .m { color: var(--cor-texto); }
      .ri.foco { outline: var(--contorno-foco) solid var(--cor-contorno-foco); outline-offset: -4px; }
      .ri svg { width: 20px; height: 20px; flex: none; }
      .gap { flex: none; width: var(--e4); }
      .lup { margin-left: auto; flex: none; display: flex; align-items: center; gap: var(--e2); color: var(--cor-texto-2); font: var(--ui-item); font-weight: 500; }
      .lup.pil { height: 44px; padding: 0 var(--e4); border-radius: var(--raio-pilula); background: var(--cor-cartao-2); }
      .lup.ico { width: 44px; height: 44px; justify-content: center; border-radius: 50%; background: var(--cor-cartao-2); }
      .lup kbd { margin-left: var(--e4); }
      .sg { display: inline-flex; align-items: center; height: 26px; padding: 0 var(--e3); border-radius: var(--raio-pilula); color: var(--cor-tinta); font: var(--ui-sigla); }
      .seg { display: flex; padding: 4px; gap: 4px; border-radius: var(--raio-pilula); background: var(--cor-cartao-2); flex: none; margin-right: var(--e3); }
      .seg span { height: 40px; display: flex; align-items: center; padding: 0 var(--e4); border-radius: var(--raio-pilula); font: var(--ui-botao); color: var(--cor-texto-2); white-space: nowrap; }
      .seg span[data-sel='true'] { background: var(--cor-cartao); color: var(--cor-texto); }
      .ri.s { padding: 0 var(--e3); }
    </style>
  </head>
  <body>
    <script type="module">
      import { Sala } from './_sala.js';
      const L = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>';
      const LUPA = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="m20 20-4-4"/></svg>';
      const CORES = ['rosa', 'destaque', 'azul', 'verde', 'ciano', 'laranja', 'amarelo', 'cinza-lavanda'];
      const D6 = [['GEN', '7,8'], ['IMU', '6,5'], ['PRO', '6,7'], ['APS', '7,2'], ['MIC', '8,0'], ['PSI', '—']];
      const D12 = [...D6, ['ANA', '7,4'], ['FIS', '6,9'], ['BIO', '7,7'], ['HIS', '8,1'], ['EMB', '7,0'], ['FAR', '6,6']];
      const cor = (i) => `var(--cor-${CORES[i % CORES.length]})`;
      const pt = (i) => `<span class="pt" style="background:${cor(i)}"></span>`;
      const SEL = 2;
      const foco = (i) => (i === SEL ? ' foco' : '');
      const sel = (i) => (i === SEL ? ' data-sel="true"' : '');

      // 1. Quieta: sem cor de matéria, só ponto; busca vira botão redondo
      const r1 = (D) => `<div class="regua"><span class="ri s"><span>${L}</span>Geral<span class="m">7,3</span></span><span class="gap"></span>${D.map((d, i) => `<span class="ri${foco(i)}"${sel(i)}>${pt(i)}${d[0]}<span class="m">${d[1]}</span></span>`).join('')}<span class="lup ico">${LUPA}</span></div>`;
      // 2. Siglas coloridas: a sigla é a pílula de cor da matéria
      const r2 = (D) => `<div class="regua"><span class="ri"><span>${L}</span>Boletim geral</span><span class="gap"></span>${D.map((d, i) => `<span class="ri s${foco(i)}"${sel(i)}><span class="sg" style="background:${cor(i)}">${d[0]}</span><span class="m">${d[1]}</span></span>`).join('')}<span class="lup pil">${LUPA} Buscar <kbd>/</kbd></span></div>`;
      // 3. Segmentada: escolhe a visão; a régua é só das disciplinas e só a escolhida mostra a média
      const r3 = (D) => `<div class="regua"><span class="seg"><span>Boletim geral</span><span data-sel="true">Por disciplina</span></span>${D.map((d, i) => `<span class="ri${foco(i)}"${sel(i)}>${pt(i)}${d[0]}${i === SEL ? `<span class="m">${d[1]}</span>` : ''}</span>`).join('')}<span class="lup pil">${LUPA}<kbd style="margin:0">/</kbd></span></div>`;

      const tela = (fn) => `<div class="tela"><div class="quadro"><span class="rotulo">6 disciplinas</span>${fn(D6)}<span class="rotulo">12 disciplinas: rola por dentro, o resto vem pela busca</span>${fn(D12)}</div></div>`;
      Sala.montar({
        titulo: 'Notas: barra de disciplinas',
        dados: null,
        variantes: [
          { id: 'a', nome: 'R1. Quieta: ponto de cor, média ao lado', html: () => tela(r1) },
          { id: 'b', nome: 'R2. Siglas coloridas, como pílulas', html: () => tela(r2) },
          { id: 'c', nome: 'R3. Segmentada: só a escolhida mostra a média', html: () => tela(r3) },
        ],
      });
    </script>
  </body>
</html>
