<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Foco nos blocos da Mesa</title>
    <style>
      /* Bancada do foco: uma Mesa de mentira com os três blocos reais e os níveis simulados.
         Alt + setas troca de bloco · Enter entra · Esc sobe · ↑ ↓ anda dentro · clique escolhe o bloco. */
      .mesa {
        display: grid;
        grid-template-rows: var(--barra-topo) minmax(0, 1fr);
        gap: var(--vao-mosaico);
        height: calc(var(--lab-w) * 0.625px - 2 * var(--margem-tela));
      }
      .topo {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .num {
        width: var(--alvo);
        height: var(--alvo);
        border-radius: var(--raio-pilula);
        background: var(--cor-cartao);
        color: var(--cor-texto-2);
        font: var(--ui-botao);
      }
      .num[data-sel] {
        background: var(--cor-destaque);
        color: var(--cor-tinta);
      }
      .mesa[data-nivel='menu'] .num[data-sel] {
        outline: var(--anel-traco) solid var(--cor-foco);
        outline-offset: var(--anel-afastamento);
      }
      .topo h1 {
        margin-left: var(--e3);
        font: var(--voz-titulo);
      }
      .mosaico {
        display: grid;
        grid-template: 'slides notas' 3fr 'cartoes notas' 2fr / 1fr 1fr;
        gap: var(--vao-mosaico);
        min-height: 0;
      }

      .bloco {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        border: var(--borda-bloco) solid transparent;
        border-radius: var(--raio-bloco);
        background: var(--cor-cartao);
        color: var(--cor-texto);
        cursor: pointer;
      }
      .titulo {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--bloco-pad-y) var(--bloco-pad-x) 6px;
      }
      .nome {
        color: var(--cor-texto-2);
        font: var(--ui-rotulo);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .atalho {
        padding: 2px 8px;
        border-radius: var(--raio-pilula);
        background: var(--cor-cartao-2);
        color: var(--cor-texto-2);
        font: var(--ui-sigla);
      }
      .conteudo {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: var(--e2);
        min-height: 0;
        padding: var(--e2) var(--bloco-pad-x) var(--bloco-pad-y);
        overflow: hidden;
      }

      /* Conteúdo de mentira, parecido com o real */
      .paginas {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: var(--e3);
        flex: 1;
        align-content: start;
      }
      .pagina {
        display: grid;
        place-items: end start;
        aspect-ratio: 16 / 10;
        padding: var(--e2);
        border-radius: var(--raio-item);
        background: var(--cor-cartao-2);
        color: var(--cor-texto-2);
        font: var(--ui-sigla);
      }
      .cartao {
        padding: var(--e2) var(--e3);
        border-radius: var(--raio-item);
        background: var(--cor-cartao-2);
        font: var(--ui-item);
      }
      .cartao small {
        display: block;
        color: var(--cor-texto-2);
        font: var(--ui-apoio);
      }
      .notas h4 {
        color: var(--cor-nota-titulo);
        font: var(--voz-titulo);
      }
      .notas p {
        font: var(--ui-item);
        line-height: 1.5;
      }
      .notas mark {
        padding: 0 4px;
        border-radius: 6px;
        background: color-mix(in srgb, var(--cor-destaque) 40%, transparent);
        color: inherit;
      }
      .sigla {
        padding: 2px 9px;
        border-radius: var(--raio-pilula);
        background: var(--cor-azul);
        color: var(--cor-tinta);
        font: var(--ui-sigla);
      }

      /* Dentro do bloco (igual em todas por enquanto: é a Etapa 3) */
      .bloco[data-foco='dentro'] {
        border-color: var(--cor-bloco-ativo);
      }
      .bloco[data-foco='dentro'] [data-item-foco] {
        outline: var(--anel-traco) solid var(--cor-foco);
        outline-offset: 0;
      }
      .bloco[data-foco='dentro'] .notas [data-item-foco] {
        outline: none;
      }
      .cursor {
        display: none;
        width: 2px;
        height: 1.1em;
        margin-left: 1px;
        vertical-align: text-bottom;
        background: var(--cor-texto);
        animation: piscar 1s steps(1) infinite;
      }
      .bloco[data-foco='dentro'] [data-item-foco] .cursor {
        display: inline-block;
      }
      @keyframes piscar {
        50% {
          opacity: 0;
        }
      }

      /* ===== Etapa 1: o indicador do bloco em foco (nível bloco) ===== */

      /* F1: como está hoje. Anel escuro de 3 px, afastado 3 px do bloco. */
      .f1 .bloco[data-foco='bloco'] {
        outline: var(--anel-traco) solid var(--cor-foco);
        outline-offset: var(--anel-afastamento);
      }

      /* F2: borda grossa por dentro, na cor de bloco ativo. Nada sai do bloco; o vão fica livre. */
      .f2 .bloco[data-foco='bloco'] {
        outline: 4px solid
          color-mix(in srgb, var(--cor-bloco-ativo) var(--opac-contorno, 70%), transparent);
        outline-offset: -4px;
      }

      /* F3: o bloco inteiro ganha um tom da cor ativa; sem linha nenhuma. O rótulo acompanha. */
      .f3 .bloco[data-foco='bloco'] {
        background: color-mix(in srgb, var(--cor-bloco-ativo) 20%, var(--cor-cartao));
      }
      .f3 .bloco[data-foco='bloco'] .nome {
        color: var(--cor-bloco-ativo);
      }
      .f3 .bloco[data-foco='bloco'] :is(.pagina, .cartao) {
        background: color-mix(in srgb, var(--cor-bloco-ativo) 30%, var(--cor-cartao));
      }


      .ajuda {
        position: fixed;
        right: var(--e4);
        bottom: var(--e4);
        z-index: 20;
        display: grid;
        gap: 2px;
        padding: var(--e2) var(--e3);
        border-radius: var(--raio-item);
        background: var(--cor-botao);
        color: var(--cor-sobre-botao);
        font: var(--ui-apoio);
      }
      .ajuda.opac {
        right: auto;
        left: var(--e4);
        min-width: 200px;
      }
      .ajuda.opac input {
        accent-color: var(--cor-bloco-ativo);
      }
      .ajuda b {
        font: var(--ui-sigla);
      }

      /* ===== Rótulo do bloco (R1 a R8), todas sobre a F2; o rótulo não muda com o foco ===== */
      .nome svg {
        width: 15px;
        height: 15px;
        flex: none;
      }
      :is(.r-inicial, .r-forma, .r-ponto) .nome {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin-left: 0;
        padding: 0;
        letter-spacing: 0.04em;
      }
      .r-inicial .nome {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        font: var(--ui-botao);
      }
      .r-forma .nome {
        height: 28px;
        background: var(--cor-cartao-2);
        font: var(--ui-rotulo);
        font-weight: 700;
      }
      .r-circ .nome {
        width: 28px;
        border-radius: 50%;
        font: var(--ui-botao);
      }
      .r-pil .nome {
        padding: 0 12px;
        border-radius: var(--raio-pilula);
      }
      .r-ico.r-pil .nome {
        padding-left: 10px;
      }
      .r-ponto .nome {
        width: 14px;
        height: 14px;
        margin: 7px 0;
        border-radius: 50%;
        background: var(--cor-cartao-2);
        box-shadow: inset 0 0 0 2px var(--cor-texto-2);
      }

      /* ===== Etapa 3: dentro do bloco (Enter). Base: F2 a 70% e nome inteiro em pílula ===== */
      :root {
        --contorno: color-mix(in srgb, var(--cor-bloco-ativo) var(--opac-contorno, 70%), transparent);
      }
      /* D1: como hoje. Borda de 2 px e anel escuro no item. */
      /* D2: o contorno do nível bloco continua; o anel do item usa a mesma cor, sem afastamento */
      .d2 .bloco[data-foco='dentro'] {
        border-color: transparent;
        outline: 4px solid var(--contorno);
        outline-offset: -4px;
      }
      .d2 .bloco[data-foco='dentro'] [data-item-foco] {
        outline-color: var(--cor-bloco-ativo);
      }
      /* D3: um sinal forte só. O contorno fica fraco, só para lembrar em que bloco você está. */
      .d3 .bloco[data-foco='dentro'] {
        border-color: transparent;
        outline: 2px solid color-mix(in srgb, var(--cor-bloco-ativo) 30%, transparent);
        outline-offset: -2px;
      }

      /* L1 e L2: ícone fantasma. Apagado fora de foco; aceso na cor ativa no bloco em foco ou dentro. */
      .l-fant .nome svg {
        opacity: 0.45;
      }
      .l-fant .bloco[data-foco] .nome svg {
        opacity: 1;
        color: var(--cor-bloco-ativo);
      }
      .l-solo .nome {
        display: inline-flex;
        margin: 0;
        padding: 0;
        background: none;
      }
      .l-solo .nome svg {
        width: 20px;
        height: 20px;
      }

      /* ===== Etapa 4: blocos sem foco perdem protagonismo (nos níveis bloco e dentro; no menu, todos iguais) =====
         --recuo vai de 0 a 1 pelo deslizante. Transição de 200 ms, como o legado; nada se move. */
      .ajuda.recuo {
        bottom: calc(var(--e4) + 64px);
      }
      :is(.p1, .p2, .p3) .bloco,
      :is(.p1, .p2, .p3) .conteudo {
        transition:
          filter 200ms,
          opacity 200ms,
          background-color 200ms;
      }
      /* P1: escurece. Máximo: 20% no claro, 50% no escuro (o legado usava 6% e 30%). */
      .p1:not([data-nivel='menu']) .bloco:not([data-foco]) {
        filter: brightness(calc(1 - var(--recuo, 0.5) * 0.2));
      }
      :root[data-tema='escuro'] .p1:not([data-nivel='menu']) .bloco:not([data-foco]) {
        filter: brightness(calc(1 - var(--recuo, 0.5) * 0.5));
      }
      /* P2: o conteúdo fica transparente até 30% de opacidade; o fundo do bloco não muda */
      .p2:not([data-nivel='menu']) .bloco:not([data-foco]) :is(.conteudo, .titulo) {
        opacity: calc(1 - var(--recuo, 0.5) * 0.7);
      }
      /* P3: o fundo vai para a cor da tela e as cores perdem saturação */
      .p3:not([data-nivel='menu']) .bloco:not([data-foco]) {
        background: color-mix(in srgb, var(--cor-fundo) calc(var(--recuo, 0.5) * 100%), var(--cor-cartao));
      }
      .p3:not([data-nivel='menu']) .bloco:not([data-foco]) .conteudo {
        filter: saturate(calc(1 - var(--recuo, 0.5)));
        opacity: calc(1 - var(--recuo, 0.5) * 0.35);
      }
    </style>
  </head>
  <body>
    <script type="module">
      import { Sala } from './_sala.js';

      const BLOCOS = ['slides', 'notas', 'cartoes'];
      // Vizinhos para Alt + seta (como a Mesa real: Slides em cima, Cartões embaixo, Anotações à direita)
      const VIZINHO = {
        slides: { ArrowDown: 'cartoes', ArrowRight: 'notas' },
        cartoes: { ArrowUp: 'slides', ArrowRight: 'notas' },
        notas: { ArrowLeft: 'slides' },
      };
      const estado = { nivel: 'bloco', bloco: 'notas', item: 0 };

      const ICONE = {
        slides: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8"/>',
        notas: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/>',
        cartoes: '<rect x="7" y="3" width="14" height="14" rx="2"/><path d="M3 7v11a3 3 0 0 0 3 3h11"/>',
      };
      const svg = (id) =>
        `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONE[id]}</svg>`;
      // Como o rótulo do bloco aparece; o nome inteiro sempre fica para o leitor de tela.
      const ROTULO = {
        nome: (n) => n,
        inicial: (n, l) => l,
        icone: (n, l, i) => svg(i),
        iconeInicial: (n, l, i) => `${svg(i)}${l}`,
        iconeNome: (n, l, i) => `${svg(i)}${n}`,
        circulo: () => '',
      };
      let formaRotulo = 'nome';
      const rot = (n, l, i) =>
        `<span class="nome" aria-label="${n}">${ROTULO[formaRotulo](n, l, i)}</span>`;
      const mesa = (classe, forma = 'nome') => {
        formaRotulo = forma;
        return mesaHtml(classe);
      };
      const mesaHtml = (classe) => `
        <div class="mesa ${classe}">
          <nav class="topo">
            ${[1, 2, 3, 4, 5, 6].map((n) => `<button class="num" ${n === 2 ? 'data-sel' : ''}>${n}</button>`).join('')}
            <h1>Resposta inflamatória aguda</h1>
          </nav>
          <div class="mosaico">
            <section class="bloco" data-bloco="slides" style="grid-area: slides">
              <div class="titulo">${rot('Slides', 'S', 'slides')}<span class="atalho">Alt S</span></div>
              <div class="conteudo"><div class="paginas">
                ${[1, 2, 3, 4, 5, 6].map((n) => `<div class="pagina" data-item>p. ${n}</div>`).join('')}
              </div></div>
            </section>
            <section class="bloco" data-bloco="cartoes" style="grid-area: cartoes">
              <div class="titulo">${rot('Cartões', 'C', 'cartoes')}<span class="atalho">Alt C</span></div>
              <div class="conteudo">
                <div class="cartao" data-item>Quem libera IL-6?<small>Macrófago ativado</small></div>
                <div class="cartao" data-item>Efeito da IL-6 no fígado<small>↑ PCR e fibrinogênio</small></div>
                <div class="cartao" data-item>Via do LPS<small>TLR4 → NF-κB</small></div>
              </div>
            </section>
            <section class="bloco" data-bloco="notas" style="grid-area: notas">
              <div class="titulo">${rot('Anotações', 'A', 'notas')}<span class="atalho">Alt A</span></div>
              <div class="conteudo notas">
                <h4>Resposta inflamatória aguda</h4>
                <p data-item>O macrófago reconhece o LPS pelo <mark>TLR4</mark>. A via segue por NF-κB e libera IL-1β, IL-6 e TNF-α.<span class="cursor"></span></p>
                <p data-item>IL-6 age no fígado: ↑ PCR e fibrinogênio. <span class="sigla">IMU</span><span class="cursor"></span></p>
                <p data-item>Entre 6 e 24 horas predominam neutrófilos; entre 24 e 48 horas, monócitos.<span class="cursor"></span></p>
              </div>
            </section>
          </div>
        </div>`;

      Sala.montar({
        titulo: 'Foco nos blocos da Mesa',
        dados: null,
        variantes: [
          {
            id: 'f1',
            nome: 'F1 · anel escuro por fora, afastado 3 px (como está hoje)',
            html: () => mesa('f1'),
          },
          {
            id: 'f2',
            nome: 'F2 · borda grossa por dentro, na cor de bloco ativo',
            html: () => mesa('f2'),
          },
          {
            id: 'f3',
            nome: 'F3 · o bloco inteiro ganha um tom da cor ativa, sem linha',
            html: () => mesa('f3'),
          },
          {
            id: 'r1',
            nome: 'R1 · só a inicial, sem forma',
            html: () => mesa('f2 r-inicial', 'inicial'),
          },
          {
            id: 'r2',
            nome: 'R2 · inicial em círculo',
            html: () => mesa('f2 r-forma r-circ', 'inicial'),
          },
          {
            id: 'r3',
            nome: 'R3 · inicial em pílula',
            html: () => mesa('f2 r-forma r-pil', 'inicial'),
          },
          {
            id: 'r4',
            nome: 'R4 · nome inteiro em pílula',
            html: () => mesa('f2 r-forma r-pil', 'nome'),
          },
          {
            id: 'r5',
            nome: 'R5 · só um círculo, sem texto (o atalho ao lado diz qual é o bloco)',
            html: () => mesa('f2 r-ponto', 'circulo'),
          },
          {
            id: 'r6',
            nome: 'R6 · ícone em círculo',
            html: () => mesa('f2 r-forma r-circ r-ico', 'icone'),
          },
          {
            id: 'r7',
            nome: 'R7 · ícone com a inicial, em pílula',
            html: () => mesa('f2 r-forma r-pil r-ico', 'iconeInicial'),
          },
          {
            id: 'r8',
            nome: 'R8 · ícone com o nome, em pílula',
            html: () => mesa('f2 r-forma r-pil r-ico', 'iconeNome'),
          },
          {
            id: 'd1',
            nome: 'D1 · dentro: o contorno afina para 2 px e o item ganha o anel escuro (como hoje)',
            html: () => mesa('f2 r-forma r-pil d1', 'nome'),
          },
          {
            id: 'd2',
            nome: 'D2 · dentro: o contorno fica igual e o item ganha o anel na mesma cor do contorno',
            html: () => mesa('f2 r-forma r-pil d2', 'nome'),
          },
          {
            id: 'd3',
            nome: 'D3 · dentro: o contorno se apaga e só o item tem anel forte (um sinal só)',
            html: () => mesa('f2 r-forma r-pil d3', 'nome'),
          },
          {
            id: 'l1',
            nome: 'L1 · rótulo: ícone fantasma, como no app antigo (aceso na cor ativa no bloco em foco)',
            html: () => mesa('f2 d1 l-fant l-solo', 'icone'),
          },
          {
            id: 'l2',
            nome: 'L2 · rótulo: nome inteiro em pílula com o ícone fantasma (o ícone acende no foco)',
            html: () => mesa('f2 d1 r-forma r-pil r-ico l-fant', 'iconeNome'),
          },
          {
            id: 'p1',
            nome: 'P1 · sem foco escurece (como o legado, estilo Hyprland): o bloco inteiro perde brilho',
            html: () => mesa('f2 d1 l-fant l-solo p1', 'icone'),
          },
          {
            id: 'p2',
            nome: 'P2 · sem foco esmaece: o fundo fica, só o conteúdo fica transparente',
            html: () => mesa('f2 d1 l-fant l-solo p2', 'icone'),
          },
          {
            id: 'p3',
            nome: 'P3 · sem foco afunda: o fundo do bloco vai para a cor da tela e as cores desbotam',
            html: () => mesa('f2 d1 l-fant l-solo p3', 'icone'),
          },
        ],
      });

      const ajuda = document.createElement('div');
      ajuda.className = 'ajuda';
      document.body.append(ajuda);

      // Deslizante da opacidade do contorno (F2 e tudo que se apoia nela)
      const CHAVE_OPAC = 'ohara2-lab-opac-contorno';
      let opac = 70;
      try {
        opac = Number(localStorage.getItem(CHAVE_OPAC)) || 70;
      } catch {
        /* sem armazenamento: começa em 100 */
      }
      const painel = document.createElement('label');
      painel.className = 'ajuda opac';
      painel.innerHTML = `<b>Contorno: <output>${opac}%</output></b><input type="range" min="10" max="100" step="5" value="${opac}" aria-label="Opacidade do contorno" />`;
      document.body.append(painel);
      const deslizante = painel.querySelector('input');
      const saida = painel.querySelector('output');
      const aplicarOpac = (valor) => {
        document.documentElement.style.setProperty('--opac-contorno', `${valor}%`);
        saida.textContent = `${valor}%`;
        try {
          localStorage.setItem(CHAVE_OPAC, String(valor));
        } catch {
          /* vale só nesta aba */
        }
      };
      deslizante.addEventListener('input', () => aplicarOpac(Number(deslizante.value)));
      aplicarOpac(opac);

      // Deslizante do recuo dos blocos sem foco (P1 a P3): 0 = nada, 100 = máximo de cada versão
      const CHAVE_RECUO = 'ohara2-lab-recuo';
      let recuo = 50;
      try {
        recuo = Number(localStorage.getItem(CHAVE_RECUO) ?? 50);
      } catch {
        /* sem armazenamento: começa em 50 */
      }
      const painelRecuo = document.createElement('label');
      painelRecuo.className = 'ajuda opac recuo';
      painelRecuo.innerHTML = `<b>Recuo sem foco: <output>${recuo}%</output></b><input type="range" min="0" max="100" step="5" value="${recuo}" aria-label="Recuo dos blocos sem foco" />`;
      document.body.append(painelRecuo);
      const deslizanteRecuo = painelRecuo.querySelector('input');
      const saidaRecuo = painelRecuo.querySelector('output');
      const aplicarRecuo = (valor) => {
        document.documentElement.style.setProperty('--recuo', String(valor / 100));
        saidaRecuo.textContent = `${valor}%`;
        try {
          localStorage.setItem(CHAVE_RECUO, String(valor));
        } catch {
          /* vale só nesta aba */
        }
      };
      deslizanteRecuo.addEventListener('input', () => aplicarRecuo(Number(deslizanteRecuo.value)));
      aplicarRecuo(recuo);

      function desenhar() {
        for (const m of document.querySelectorAll('.mesa')) {
          m.dataset.nivel = estado.nivel;
          for (const b of m.querySelectorAll('.bloco')) {
            const ativo = estado.nivel !== 'menu' && b.dataset.bloco === estado.bloco;
            if (ativo) b.dataset.foco = estado.nivel;
            else delete b.dataset.foco;
            b.querySelectorAll('[data-item]').forEach((item, k) => {
              if (ativo && estado.nivel === 'dentro' && k === estado.item)
                item.dataset.itemFoco = '';
              else delete item.dataset.itemFoco;
            });
          }
        }
        const nomes = { menu: 'menu', bloco: 'bloco', dentro: 'dentro do bloco' };
        ajuda.innerHTML = `<b>Nível: ${nomes[estado.nivel]}</b><span>Alt + setas: bloco · Enter: entra · Esc: sobe · ↑ ↓: dentro</span>`;
      }

      const itens = () =>
        document
          .querySelector(`.mesa .bloco[data-bloco="${estado.bloco}"]`)
          .querySelectorAll('[data-item]').length;

      // Só na sala: a regra do listener único vale para o app, não para a bancada.
      document.addEventListener(
        'keydown',
        (e) => {
          if (e.target instanceof HTMLSelectElement) return;
          // Setas no deslizante mexem só nele, não trocam a versão da sala
          if ((e.target === deslizante || e.target === deslizanteRecuo) && !e.altKey) {
            e.stopImmediatePropagation();
            return;
          }
          if (e.altKey && e.code.startsWith('Arrow')) {
            const destino = VIZINHO[estado.bloco][e.code];
            if (destino) {
              estado.bloco = destino;
              estado.item = 0;
              if (estado.nivel === 'menu') estado.nivel = 'bloco';
            }
          } else if (e.code === 'Enter') {
            estado.nivel = estado.nivel === 'menu' ? 'bloco' : 'dentro';
          } else if (e.code === 'Escape') {
            estado.nivel = estado.nivel === 'dentro' ? 'bloco' : 'menu';
          } else if (
            estado.nivel === 'dentro' &&
            (e.code === 'ArrowDown' || e.code === 'ArrowUp')
          ) {
            const passo = e.code === 'ArrowDown' ? 1 : -1;
            estado.item = Math.min(itens() - 1, Math.max(0, estado.item + passo));
          } else return;
          e.preventDefault();
          e.stopImmediatePropagation();
          desenhar();
        },
        true,
      );

      document.addEventListener('click', (e) => {
        const b = e.target.closest?.('.bloco');
        if (!b) return;
        estado.nivel =
          estado.bloco === b.dataset.bloco && estado.nivel === 'bloco' ? 'dentro' : 'bloco';
        estado.bloco = b.dataset.bloco;
        desenhar();
      });

      desenhar();
    </script>
  </body>
</html>
