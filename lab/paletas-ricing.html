<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paletas de ricing no Ohara (claro)</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Nunito:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Hub em miniatura com paletas prontas da comunidade de ricing. Só tema claro. */
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #9a9a9a;
        font:
          500 12px/16px Inter,
          system-ui,
          sans-serif;
        padding: 12px;
        width: 1304px;
      }
      h1 {
        margin: 0 0 8px;
        font: 800 18px Nunito;
        color: #fff;
      }
      .grade {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }
      .nome {
        color: #fff;
        font: 800 15px Nunito;
        margin: 0 0 5px;
      }
      .m {
        background: var(--bg);
        color: var(--tx);
        border-radius: 12px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .barra {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .n {
        width: 24px;
        height: 24px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        background: var(--card);
        color: var(--sub);
        font-weight: 700;
        font-size: 11px;
      }
      .n.at {
        background: var(--ac);
        color: var(--sobre);
      }
      .barra b {
        font: 800 14px Nunito;
        margin-left: 6px;
      }
      .provas {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }
      .pv {
        background: var(--card);
        border-radius: 10px;
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .pv small {
        color: var(--sub);
        font-size: 10px;
        letter-spacing: 0.05em;
      }
      .pv b {
        font: 800 30px/30px Nunito;
      }
      .pv.p b {
        color: var(--ac);
      }
      .tg {
        display: flex;
        gap: 3px;
        flex-wrap: wrap;
      }
      .t {
        border-radius: 999px;
        padding: 0 8px;
        font: 700 10px/16px Inter;
        background: color-mix(in srgb, var(--c) 38%, var(--card));
        color: var(--tx);
      }
      .baixo {
        display: grid;
        grid-template-columns: 1fr 1.4fr;
        gap: 6px;
      }
      .bl {
        background: var(--card);
        border-radius: 10px;
        padding: 9px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .bl .r {
        color: var(--sub);
        font: 700 10px Inter;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .ag {
        background: color-mix(in srgb, var(--ac) 22%, var(--card));
        border-radius: 8px;
        padding: 7px 9px;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .ag b {
        font: 800 13px Nunito;
      }
      .ln {
        background: var(--card2);
        border-radius: 8px;
        padding: 6px 9px;
        display: flex;
        gap: 6px;
        align-items: center;
        font-size: 11px;
      }
      .btn {
        background: var(--ac);
        color: var(--sobre);
        border-radius: 999px;
        padding: 6px 10px;
        text-align: center;
        font-weight: 700;
        font-size: 11px;
      }
      .cal {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 2px;
        text-align: center;
        font-size: 10px;
      }
      .cal i {
        font-style: normal;
      }
      .cal .h {
        background: var(--ac);
        color: var(--sobre);
        border-radius: 999px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <h1>Acentos de ricing sobre fundos frios e neutros (só claro)</h1>
    <div class="grade" id="g"></div>
    <script>
      const F=[
 ['Gelo','pinho',{bg:'#eef1f4',card:'#ffffff',card2:'#e4e8ec',tx:'#1c2530',sub:'#5b6773',ac:'#286983',sobre:'#ffffff',cs:['#d7827e','#907aa9','#56949f','#ea9d34','#b4637a','#286983','#9893a5','#d7827e']}],
 ['Névoa','aqua',{bg:'#edf0f2',card:'#fdfefe',card2:'#e2e7ea',tx:'#1a2326',sub:'#56666b',ac:'#2f8f74',sobre:'#ffffff',cs:['#f57d26','#3a94c5','#35a77c','#dfa000','#df69ba','#8da101','#939f91','#f85552']}],
 ['Neutro','malva escuro',{bg:'#f2f2f3',card:'#ffffff',card2:'#e8e8ea',tx:'#1e1e22',sub:'#66666e',ac:'#7a3fb0',sobre:'#ffffff',cs:['#fe640b','#1e66f5','#179299','#df8e1d','#ea76cb','#04a5e5','#40a02b','#7287fd']}],
 ['Aço','turquesa',{bg:'#e8edf2',card:'#f8fafc',card2:'#dbe2e9',tx:'#1b2430',sub:'#556372',ac:'#118c74',sobre:'#ffffff',cs:['#b15c00','#2e7de9','#118c74','#8c6c3e','#9854f1','#007197','#587539','#f52a65']}],
 ['Grafite claro','grafite-azulado',{bg:'#e6e9ec',card:'#f6f7f8',card2:'#d9dde1',tx:'#151a1f',sub:'#505a64',ac:'#3a4a5c',sobre:'#ffffff',cs:['#d08770','#81a1c1','#8fbcbb','#ebcb8b','#b48ead','#a3be8c','#7a8599','#bf616a']}],
 ['Branco puro','terracota',{bg:'#f7f7f8',card:'#ffffff',card2:'#ececef',tx:'#17171c',sub:'#6b6b75',ac:'#c2563a',sobre:'#ffffff',cs:['#cc6d00','#4d699b','#597b75','#77713f','#b35b79','#6f894e','#8a8980','#c84053']}]
];
const S=['GEN','IMU','PRO','APS','FAR','FIS','PAT','BIO'];
      const t=(p,k,i,x='')=>`<span class="t" style="--c:${p.cs[i]};${x}">${k}</span>`;
      const mock=(p)=>`<div class="m" style="--bg:${p.bg};--card:${p.card};--card2:${p.card2};--tx:${p.tx};--sub:${p.sub};--ac:${p.ac};--sobre:${p.sobre}">
       <div class="barra">${[1,2,3,4,5,6].map(i=>`<span class="n ${i===1?'at':''}">${i}</span>`).join('')}<b>Domingo, 8 de novembro</b></div>
       <div class="provas">${[['15',['GEN']],['19',['IMU','PRO']],['22',['FAR','APS']]].map((x,i)=>`<div class="pv ${i===0?'p':''}"><small>DOM · NOV</small><b>${x[0]}</b><div class="tg">${x[1].map(k=>t(p,k,S.indexOf(k))).join('')}</div></div>`).join('')}</div>
       <div class="baixo"><div class="bl"><span class="r">Novembro</span><div class="cal">${Array.from({length:14},(_,i)=>i===5?`<i class="h">8</i>`:`<i>${i+3}</i>`).join('')}</div></div>
       <div class="bl"><span class="r">Agenda de hoje</span><div class="ag">${t(p,'IMU',1,'align-self:flex-start')}<b>Resposta inflamatória aguda</b></div>
       <div class="ln">${t(p,'PRO',2)}Exame do abdome</div><div class="btn">Novo lembrete</div></div></div>
       <div class="tg">${S.map((k,i)=>t(p,k,i)).join('')}</div></div>`;
      document.getElementById('g').innerHTML=F.map(f=>`<div><div class="nome">${f[0]} · acento: ${f[1]}</div>${mock(f[2])}</div>`).join('');
    </script>
  </body>
</html>
