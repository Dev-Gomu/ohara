<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ardósia no cartão de provas · Cartão de provas: N1 e N2</title>
    <style>
      /* Só as duas finalistas. Base: F1 + faixa C no escuro + paleta A. Histórico em provas-finalistas.html. */
      .hub {
        display: grid;
        grid-template-rows: 26% minmax(0, 1fr);
        gap: var(--vao-mosaico);
        height: calc(var(--lab-w) * 0.5625px);
      }
      .bloco {
        min-width: 0;
        min-height: 0;
        padding: var(--bloco-pad-y) var(--bloco-pad-x);
        border-radius: var(--raio-bloco);
        background: var(--cor-cartao);
        overflow: hidden;
      }
      .bloco h3 {
        margin-bottom: var(--e3);
        color: var(--cor-texto-2);
        font: var(--ui-rotulo);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .baixo {
        display: grid;
        grid-template-columns: 30fr 40fr 30fr;
        gap: var(--vao-mosaico);
        min-height: 0;
      }
      .cal {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: var(--e2) 0;
        justify-items: center;
        font: var(--ui-botao);
      }
      .cal span.p {
        border-radius: 50%;
        background: var(--cor-cartao-2);
        width: 30px;
        text-align: center;
      }
      .cal span.h {
        border-radius: 50%;
        background: var(--cor-acao);
        color: var(--cor-sobre-acao);
        width: 30px;
        text-align: center;
      }
      .linha {
        display: flex;
        justify-content: space-between;
        padding: var(--e2) 0;
        font: var(--voz-mini);
      }
      .linha small {
        color: var(--cor-texto-2);
        font: var(--ui-apoio);
      }
      .lembra {
        padding: var(--e2) 0;
        font: var(--ui-item);
      }

      /* Faixa de cartões: largura mínima de 220px; se passar, rola na horizontal */
      .provas {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(220px, 1fr);
        gap: var(--vao-mosaico);
        min-height: 0;
        overflow-x: auto;
      }
      .prova {
        --inset: var(--e4);
        --cab-bg: var(--cor-tinta);
        --cab-fg: var(--cor-sobre-tinta);
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        min-width: 0;
        min-height: 0;
        border-radius: var(--raio-bloco);
        overflow: hidden;
        background: var(--cor-cartao);
        color: var(--cor-texto);
      }
      /* Escuro: faixa C (violeta suave), igual em todos os cartões */
      :root[data-tema='escuro'] .prova {
        --cab-bg: color-mix(in srgb, var(--cor-destaque) 30%, var(--cor-cartao));
        --cab-fg: var(--cor-texto);
      }
      /* Dia mais próximo: corpo em destaque, como a aula "agora" da Agenda */
      .prova:first-child {
        background: var(--cor-destaque);
        color: var(--cor-tinta);
      }
      .cab {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 var(--inset) 1px;
        background: var(--cab-bg);
        color: var(--cab-fg);
        font: var(--ui-rotulo);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .cab > :last-child {
        margin-right: -0.06em;
      }
      /* Toda distância é --inset, medida pela tinta (text-box); a faixa absorve a sobra de altura */
      .corpo {
        display: grid;
        row-gap: var(--inset);
        padding: var(--inset);
      }
      .linhaDia {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
      }
      .num {
        font: var(--voz-numero);
        letter-spacing: -0.03em;
        font-variant-numeric: tabular-nums;
        text-box: trim-both cap alphabetic;
      }
      /* Respiro lateral de cada dígito: a tinta do número começa a 16px, como a semana e as vagas */
      .num[data-d='0'],
      .num[data-d='3'] {
        margin-left: -0.0303em;
      }
      .num[data-d='1'] {
        margin-left: -0.0758em;
      }
      .num[data-d='2'] {
        margin-left: -0.0455em;
      }
      .lado {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 10px;
        white-space: nowrap;
      }
      .falta {
        color: var(--cor-texto-2);
        font: var(--ui-apoio);
        line-height: 1;
        text-box: trim-both cap alphabetic;
      }
      .prova:first-child .falta {
        color: color-mix(in srgb, var(--cor-tinta) 70%, transparent);
      }

      /* 4 vagas fixas; a vazia fica no lugar, mas invisível */
      .vagas {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-template-rows: 28px;
        gap: var(--e1);
      }
      .vaga {
        display: grid;
      }
      .pilula {
        display: grid;
        place-items: center;
        border-radius: var(--raio-pilula);
        background: var(--cor-materia);
        color: var(--cor-tinta);
        font: var(--ui-sigla);
      }
      .prova:first-child .pilula {
        background: var(--cor-tinta);
        color: var(--cor-sobre-tinta);
      }
      /* "+N": mais de 4 matérias; pílula neutra, sem cor de matéria */
      .pilula.excede,
      .prova:first-child .pilula.excede {
        background: var(--cor-cartao-2);
        color: inherit;
      }
      .prova:first-child .pilula.excede {
        background: color-mix(in srgb, var(--cor-tinta) 14%, transparent);
      }

      /* Marca do que não é prova (prova é o padrão do bloco e não leva marca) */
      .tipoM {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      /* N1: um círculo neutro com a inicial por tipo que não é prova */
      .bola {
        display: grid;
        place-items: center;
        width: 20px;
        height: 20px;
        margin-block: -5px;
        border-radius: 50%;
        background: color-mix(in srgb, currentColor 18%, transparent);
        color: var(--cor-texto);
        font: 700 11px/1 var(--fonte-interface);
        text-box: normal;
      }
      .prova:first-child .bola {
        color: var(--cor-tinta);
      }
      /* N2: em texto, "+ trabalho" quando o dia também tem prova */
      .tipoM.frase {
        display: block;
      }
      /* O1: a faixa deixa de ser um bloco escuro em cada cartão (seis barras pretas no claro eram o elemento
         mais forte do Hub) e fica tonal nos dois temas, como a C do escuro. O cartão mais próximo vira o único
         ponto forte. Semana e mês juntos, uma leitura só; as marcas T/A vão para o outro canto da faixa. */
      .v-o1 .prova {
        --cab-bg: color-mix(in srgb, var(--cor-destaque) 22%, var(--cor-cartao));
        --cab-fg: var(--cor-texto);
      }
      :root[data-tema='escuro'] .v-o1 .prova {
        --cab-bg: color-mix(in srgb, var(--cor-destaque) 30%, var(--cor-cartao));
      }
      :is(.v-o1, .v-o2) .quando {
        margin-right: 0;
      }
      :is(.v-o1, .v-o2) .marcas {
        display: flex;
        gap: 4px;
        margin-right: 0;
      }
      .v-o1 .cab .bola {
        margin: 0;
        color: var(--cab-fg);
      }
      :is(.v-o1, .v-o2) .linhaDia {
        align-items: baseline;
      }
      /* O2: uma peça só (diretriz 6.3). Rótulo no topo na cor de apoio; o número e as siglas descem para a base,
         com os mesmos 16px; o espaço que sobra fica entre o rótulo e o número, como respiro. */
      .v-o2 .prova {
        grid-template-rows: auto minmax(0, 1fr);
      }
      .v-o2 .topo {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 20px;
        padding: var(--inset) var(--inset) 0;
        color: var(--cor-texto-2);
        font: var(--ui-rotulo);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .v-o2 .quando {
        margin-right: -0.06em;
      }
      .v-o2 .prova:first-child .topo {
        color: color-mix(in srgb, var(--cor-tinta) 70%, transparent);
      }
      .v-o2 .topo .bola {
        margin: 0;
      }
      .v-o2 .corpo {
        align-self: end;
      }
      /* P1 a P3 (O1 retrabalhada). Faixa tonal nos dois temas, agora com data e prazo; corpo com o dia e as marcas. */
      .v-p .prova {
        --cab-bg: color-mix(in srgb, var(--cor-destaque) 22%, var(--cor-cartao));
        --cab-fg: var(--cor-texto);
      }
      :root[data-tema='escuro'] .v-p .prova {
        --cab-bg: color-mix(in srgb, var(--cor-destaque) 30%, var(--cor-cartao));
      }
      .v-p .prazo {
        text-transform: none;
        letter-spacing: 0;
        margin-right: 0;
      }
      .v-p .marcas {
        display: flex;
        gap: 4px;
      }
      .v-p .bola {
        margin: 0;
        color: inherit;
      }
      /* P2 e P3: o dia mais próximo ganha a faixa cheia de destaque; o corpo continua igual aos outros,
         então as siglas não precisam inverter e toda a fila lê do mesmo jeito. */
      :root :is(.v-p2, .v-p3) .prova:first-child {
        --cab-bg: var(--cor-destaque);
        --cab-fg: var(--cor-tinta);
        background: var(--cor-cartao);
        color: var(--cor-texto);
      }
      :is(.v-p2, .v-p3) .prova:first-child .pilula:not(.excede) {
        background: var(--cor-materia);
        color: var(--cor-tinta);
      }
      :is(.v-p2, .v-p3) .prova:first-child .pilula.excede {
        background: var(--cor-cartao-2);
      }
      /* P3: matéria como ponto de cor + sigla (cor só na bolinha, diretriz 6.1); sem 4 pílulas coloridas por cartão */
      .vagas.pontos {
        grid-template-rows: 16px;
      }
      .vagas.pontos .vaga {
        align-items: center;
      }
      .ps {
        display: flex;
        align-items: center;
        gap: 5px;
        font: var(--ui-sigla);
        text-box: trim-both cap alphabetic;
      }
      .ps i {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--cor-materia);
      }
      .ps.excede {
        color: var(--cor-texto-2);
      }
      /* Q1 e Q2: claro primeiro. A faixa a 22% (#e5ecfb) quase igualava o fundo da tela (#e9eef5): o cartão
         parecia cortado, com o corpo branco solto. A 40% ela se separa do fundo; o escuro segue nos 30%. */
      .v-q .prova {
        --cab-bg: color-mix(in srgb, var(--cor-destaque) 40%, var(--cor-cartao));
      }
      /* Os círculos T/A usam a cor da própria faixa: uma cor só por cartão, o topo e as marcas conversam */
      .v-q .bola {
        background: var(--cab-bg);
        color: var(--cab-fg);
      }
      /* Ponto de matéria: tons pastel dão menos de 3:1 com o branco; maior e com um contorno de tinta no claro */
      .v-q .ps i {
        width: 10px;
        height: 10px;
      }
      :root:not([data-tema='escuro']) .v-q .ps i {
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--cor-tinta) 22%, transparent);
      }
      /* R1 a R3: só a posição dos círculos T/A muda; o resto é a Q1 */
      .v-r1 .direita {
        display: flex;
        align-items: center;
        gap: var(--e2);
      }
      .v-r1 .cab .bola {
        background: var(--cor-cartao);
        color: var(--cor-texto);
      }
      .v-r2 .linhaDia {
        align-items: flex-start;
      }
      .v-r3 .linhaDia {
        justify-content: flex-start;
        align-items: flex-start;
        gap: var(--e2);
      }
      /* Pílula do tipo: mesma fonte e forma das siglas, na cor da faixa do cartão */
      .pil-tipo {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 22px;
        padding: 0 11px;
        border-radius: var(--raio-pilula);
        background: var(--cab-bg);
        color: var(--cab-fg);
        font: var(--ui-sigla);
      }
      /* U1 a U6: indicadores sem pílula, no canto de cima à direita do corpo */
      .ind {
        display: flex;
        align-items: center;
        gap: 5px;
        font: var(--ui-sigla);
        color: var(--cor-texto);
      }
      /* Sublinhado e marca-texto precisam de letra maior para a marca não ficar mais forte que a letra */
      :is(.ind-sub, .ind-marca) {
        gap: 6px;
        font: var(--ui-botao);
        font-weight: 700;
      }
      .ind-sub > span {
        padding-bottom: 3px;
        box-shadow: inset 0 -3px var(--cor-destaque);
        line-height: 16px;
      }
      .ind-marca > span {
        padding: 0 3px;
        box-shadow: inset 0 -0.6em color-mix(in srgb, var(--cor-destaque) 55%, transparent);
        line-height: 18px;
      }
      .ind-contorno {
        height: 22px;
        padding: 0 10px;
        border-radius: var(--raio-pilula);
        box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--cor-destaque) 80%, var(--cor-texto));
      }
      .ind-tipo {
        gap: 6px;
        color: var(--cor-texto-2);
        font: var(--voz-mini);
        text-box: trim-both cap alphabetic;
      }
      /* U5: a aba nasce colada na faixa e desce sobre o corpo, na mesma cor da faixa */
      .v-u .corpo {
        position: relative;
      }
      .ind-aba {
        position: absolute;
        top: 0;
        right: var(--inset);
        padding: 4px 8px 6px;
        border-radius: 0 0 8px 8px;
        background: var(--cab-bg);
        color: var(--cab-fg);
      }
      .ind-ponto i {
        width: 8px;
        height: 8px;
        margin-right: 1px;
        border-radius: 50%;
        background: var(--cor-destaque);
      }
    
      /* Ardósia: mesmo cartão (faixa com data e prazo, dia, até 4 siglas, pílula T/A); muda só a cor da faixa */
      :root .ard1 .prova {
        --cab-bg: color-mix(in srgb, var(--cor-texto) 13%, var(--cor-cartao));
      }
      :root[data-tema='escuro'] .ard1 .prova {
        --cab-bg: color-mix(in srgb, var(--cor-texto) 16%, var(--cor-cartao));
      }
      :root .ard1 .prova:first-child {
        --cab-bg: var(--cor-acao);
        --cab-fg: var(--cor-sobre-acao);
      }
      :root .ard2 .prova {
        --cab-bg: color-mix(in srgb, var(--cor-cursor) 24%, var(--cor-cartao));
      }
      :root[data-tema='escuro'] .ard2 .prova {
        --cab-bg: color-mix(in srgb, var(--cor-cursor) 32%, var(--cor-cartao));
      }
      :root .ard2 .prova:first-child {
        --cab-bg: var(--cor-cursor);
        --cab-fg: #fff;
      }
      :root[data-tema='escuro'] .ard2 .prova:first-child {
        --cab-fg: var(--cor-fundo);
      }
      :root .ard3 .prova,
      :root .ard3 .prova:first-child {
        --cab-bg: var(--cor-cartao-2);
        --cab-fg: var(--cor-texto);
      }
      :root .ard3 .prova:first-child .num {
        color: var(--cor-cursor);
      }
</style>
  </head>
  <body>
    <script type="module">
      import { Sala } from './_sala.js';

      const DIAS = [
        { dias: 7, sem: 'sáb', dia: 14, mes: 'nov', tipos: ['prova'], provas: [['GEN', 0]] },
        {
          dias: 11,
          sem: 'qua',
          dia: 18,
          mes: 'nov',
          tipos: ['trabalho'],
          provas: [
            ['IMU', 1],
            ['PRO', 6],
          ],
        },
        {
          dias: 14,
          sem: 'sáb',
          dia: 21,
          mes: 'nov',
          tipos: ['apresentação'],
          provas: [
            ['FAR', 4],
            ['APS', 3],
            ['PAT', 2],
          ],
        },
        {
          dias: 20,
          sem: 'sex',
          dia: 27,
          mes: 'nov',
          tipos: ['prova', 'trabalho'],
          provas: [
            ['APS', 3],
            ['FAR', 4],
            ['PRO', 6],
            ['IMU', 1],
            ['GEN', 0],
            ['PAT', 2],
          ],
        },
        {
          dias: 25,
          sem: 'qua',
          dia: 2,
          mes: 'dez',
          tipos: ['trabalho', 'apresentação', 'prova'],
          provas: [
            ['FAR', 4],
            ['GEN', 0],
          ],
        },
        { dias: 31, sem: 'ter', dia: 8, mes: 'dez', tipos: ['prova'], provas: [['PRO', 6]] },
      ];

      const PESO = ['apresentação', 'trabalho'];
      const INICIAL = { trabalho: 'T', apresentação: 'A' };
      const DD = (d) => String(d.dia).padStart(2, '0');
      const outros = (d) => PESO.filter((t) => d.tipos.includes(t));
      const lista = (t) =>
        t.length > 1 ? `${t.slice(0, -1).join(', ')} e ${t[t.length - 1]}` : t[0];

      const vagas = (d) =>
        `<span class="vagas">${[0, 1, 2, 3]
          .map((k) => {
            if (k === 3 && d.provas.length > 4) {
              const resto = d.provas.slice(3).map((p) => p[0]);
              return `<span class="vaga"><b class="pilula excede" title="${resto.join(', ')}" aria-label="mais ${resto.length}: ${resto.join(', ')}">+${resto.length}</b></span>`;
            }
            const p = d.provas[k];
            return `<span class="vaga">${p ? `<b class="pilula" data-materia="${p[1]}">${p[0]}</b>` : ''}</span>`;
          })
          .join('')}</span>`;

      const tipoN1 = (d) => {
        const o = outros(d);
        if (!o.length) return '';
        const bolas = o.map((t) => `<span class="bola" title="${t}">${INICIAL[t]}</span>`).join('');
        return `<span class="tipoM" role="img" aria-label="${lista(o)}">${bolas}</span>`;
      };
      const tipoN2 = (d) => {
        const o = outros(d);
        if (!o.length) return '';
        const nome = o.length > 1 ? `${o.length} atividades` : o[0];
        const texto = (d.tipos.includes('prova') ? '+ ' : '') + nome;
        return `<span class="falta tipoM frase" aria-label="${lista(o)}">${texto}</span>`;
      };

      const cartao = (tipo) => (d) =>
        `<div class="prova"><span class="cab"><span>${d.sem}</span><span>${d.mes}</span></span><span class="corpo"><span class="linhaDia"><b class="num" data-d="${DD(d)[0]}">${DD(d)}</b><span class="lado">${tipo(d)}<span class="falta">em ${d.dias} d</span></span></span>${vagas(d)}</span></div>`;

      // O1 e O2: cada zona com uma função só. Faixa/topo = quando (semana · mês) e o que não é prova (T, A);
      // corpo = quanto falta (número e "em X d"); pé = quais matérias.
      const marcas = (d) => {
        const o = outros(d);
        return o.length
          ? `<span class="marcas" role="img" aria-label="${lista(o)}">${o.map((t) => `<span class="bola" title="${t}">${INICIAL[t]}</span>`).join('')}</span>`
          : '';
      };
      const corpoO = (d) =>
        `<span class="corpo"><span class="linhaDia"><b class="num" data-d="${DD(d)[0]}">${DD(d)}</b><span class="falta">em ${d.dias} d</span></span>${vagas(d)}</span>`;
      const cartaoO1 = (d) => `<div class="prova"><span class="cab"><span class="quando">${d.sem} · ${d.mes}</span>${marcas(d)}</span>${corpoO(d)}</div>`;
      const cartaoO2 = (d) => `<div class="prova"><span class="topo"><span class="quando">${d.sem} · ${d.mes}</span>${marcas(d)}</span>${corpoO(d)}</div>`;

      // P1 a P3: a faixa diz QUANDO por inteiro (data e prazo, absoluto e relativo); o corpo fica só com o dia
      // e as marcas do que não é prova; o pé, só as matérias.
      const vagasPontos = (d) =>
        `<span class="vagas pontos">${[0, 1, 2, 3]
          .map((k) => {
            if (k === 3 && d.provas.length > 4) {
              const resto = d.provas.slice(3).map((p) => p[0]);
              return `<span class="vaga"><span class="ps excede" title="${resto.join(', ')}" aria-label="mais ${resto.length}: ${resto.join(', ')}">+${resto.length}</span></span>`;
            }
            const p = d.provas[k];
            return `<span class="vaga">${p ? `<span class="ps" data-materia="${p[1]}"><i></i>${p[0]}</span>` : ''}</span>`;
          })
          .join('')}</span>`;
      const cartaoP = (pe) => (d) =>
        `<div class="prova"><span class="cab"><span class="quando">${d.sem} · ${d.mes}</span><span class="prazo">em ${d.dias} d</span></span><span class="corpo"><span class="linhaDia"><b class="num" data-d="${DD(d)[0]}">${DD(d)}</b>${marcas(d)}</span>${pe(d)}</span></div>`;

      // R1: as marcas vão para a faixa, coladas no prazo
      const cartaoR1 = (d) =>
        `<div class="prova"><span class="cab"><span class="quando">${d.sem} · ${d.mes}</span><span class="direita">${marcas(d)}<span class="prazo">em ${d.dias} d</span></span></span><span class="corpo"><span class="linhaDia"><b class="num" data-d="${DD(d)[0]}">${DD(d)}</b></span>${vagas(d)}</span></div>`;

      // S1 a S4: as marcas viram pílulas (a mesma forma das siglas), uma por tipo ou uma só com as iniciais
      const marcasPil = (unica) => (d) => {
        const o = outros(d);
        if (!o.length) return '';
        const letras = o.map((t) => `<span title="${t}">${INICIAL[t]}</span>`);
        const pilulas = unica ? [`<span class="pil-tipo">${letras.join('')}</span>`] : letras.map((l) => `<span class="pil-tipo">${l}</span>`);
        return `<span class="marcas" role="img" aria-label="${lista(o)}">${pilulas.join('')}</span>`;
      };
      const cartaoS = (fn) => (d) =>
        `<div class="prova"><span class="cab"><span class="quando">${d.sem} · ${d.mes}</span><span class="prazo">em ${d.dias} d</span></span><span class="corpo"><span class="linhaDia"><b class="num" data-d="${DD(d)[0]}">${DD(d)}</b>${fn(d)}</span>${vagas(d)}</span></div>`;

      // U1 a U6: mesmo lugar da S2 (canto de cima à direita), trocando a pílula por outro indicador
      const marcasInd = (estilo) => (d) => {
        const o = outros(d);
        if (!o.length) return '';
        const letras = o.map((t) => `<span title="${t}">${INICIAL[t]}</span>`).join('');
        return `<span class="marcas ind ind-${estilo}" role="img" aria-label="${lista(o)}">${estilo === 'ponto' ? '<i></i>' : ''}${letras}</span>`;
      };

      const calendario = Array.from({ length: 35 }, (_, i) => i - 5)
        .map((n) => {
          const dia = ((n + 29) % 30) + 1;
          const marca = n === 7 ? 'h' : [14, 18, 21, 27].includes(dia) && n > 0 ? 'p' : '';
          return `<span class="${marca}">${dia}</span>`;
        })
        .join('');

      const hub = (fazCartao, dados, classe = '') => `
        <div class="hub ${classe}">
          <div class="provas">${dados.map(fazCartao).join('')}</div>
          <div class="baixo">
            <div class="bloco"><h3>Novembro 2026</h3><div class="cal">${calendario}</div></div>
            <div class="bloco"><h3>Agenda de hoje</h3>
              <div class="linha">Genética <small>08:00–09:30</small></div>
              <div class="linha">Atenção Primária <small>10:00–11:00</small></div>
              <div class="linha">Imunologia <small>13:00–15:00</small></div>
              <div class="linha">Propedêutica <small>15:10–17:00</small></div>
            </div>
            <div class="bloco"><h3>Lembretes</h3>
              <div class="lembra">Levar o jaleco para a Propedêutica.</div>
              <div class="lembra">Revisar IL-6 e TNF-α antes da prova.</div>
              <div class="lembra">Confirmar a sala de Genética.</div>
            </div>
          </div>
        </div>`;

      Sala.montar({
        titulo: 'Cartão de provas na Ardósia',
        dados: DIAS,
        variantes: [
          { id: 'x1', nome: 'X1 · faixa em cinza-ardósia; o próximo dia em grafite cheio', html: (d) => hub(cartaoS(marcasPil(true)), d, 'v-p v-p2 v-q v-r2 ard1') },
          { id: 'x2', nome: 'X2 · faixa em cobalto suave; o próximo dia em cobalto cheio', html: (d) => hub(cartaoS(marcasPil(true)), d, 'v-p v-p2 v-q v-r2 ard2') },
          { id: 'x3', nome: 'X3 · faixa neutra igual em todos; o próximo dia só com o número em cobalto', html: (d) => hub(cartaoS(marcasPil(true)), d, 'v-p v-p2 v-q v-r2 ard3') },
        ],
      });
    </script>
  </body>
</html>
